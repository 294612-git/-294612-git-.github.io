<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahara Camel Math - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fff4e1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #d2912f;
        }
        h2 { font-family: 'Fredoka', cursive; color: #9b6c2a; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice, .option-btn, .back-link {
            transition: all 0.2s;
        }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #fff8ef;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #f4c16f;
            font-weight: 700;
        }
        .topic-link:hover, .choice:hover {
            background: #ffe7c2;
            transform: translateY(-2px);
            border-color: #9b6c2a;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #f4c16f;
            border-radius: 50px;
            background: white;
            color: #9b6c2a;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #ffe7c2; border-color: #9b6c2a; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #9b6c2a;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #9b6c2a 0%, #f4c16f 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #ffe2b8; }
        .hidden { display: none; }
</style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <h2>🐪 Camel Math</h2>
        <h2 id="question-text">Question</h2>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">Try Again</button>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade3-math-topics.html'">Back to 🐪 Camel Math Topics</button>
    </div>

    <script>
        const quizData = [
            { q: "Round 47 to the nearest ten.", a: "50", options: ["40", "50", "45", "100"] },
            { q: "Estimate 21 + 79 by rounding to the nearest ten.", a: "100", options: ["100", "90", "110", "80"] },
            { q: "Round 342 to the nearest hundred.", a: "300", options: ["300", "400", "340", "350"] },
            { q: "Estimate 59 × 2 by rounding 59 to the nearest ten.", a: "120", options: ["100", "120", "110", "60"] },
            { q: "Is 85 closer to 80 or 90?", a: "80", options: ["80", "90"] },
            { q: "Estimate 812 - 395 by rounding to hundreds.", a: "400", options: ["500", "400", "300", "600"] },
            { q: "Round 1,560 to the nearest thousand.", a: "2,000", options: ["1,000", "2,000", "1,500", "1,600"] },
            { q: "Which is the best estimate for the weight of a pencil?", a: "1 ounce", options: ["1 pound", "1 ounce", "1 ton"] },
            { q: "Estimate the sum of $4.95 and $3.05.", a: "$8", options: ["$7", "$8", "$9", "$10"] },
            { q: "Round 9 to the nearest ten.", a: "10", options: ["0", "10", "5", "20"] },
            { q: "Estimate 24 + 24 by rounding to tens.", a: "50", options: ["40", "50", "60", "30"] },
            { q: "Round 749 to the nearest hundred.", a: "700", options: ["800", "700", "750", "740"] },
            { q: "A jar has 512 beans. About how many beans are in the jar?", a: "500", options: ["500", "600", "400", "510"] },
            { q: "Estimate 93 - 21 by rounding to tens.", a: "70", options: ["70", "80", "60", "110"] },
            { q: "Round 55 to the nearest ten.", a: "60", options: ["50", "60", "55", "100"] },
            { q: "Which number rounds to 400 when rounded to the nearest hundred?", a: "399", options: ["349", "451", "399", "460"] },
            { q: "Estimate the cost of 3 items that are $1.99 each.", a: "$6", options: ["$3", "$6", "$9", "$2"] },
            { q: "Round 8,201 to the nearest thousand.", a: "8,000", options: ["8,000", "9,000", "8,200", "8,300"] },
            { q: "Is 12 closer to 10 or 20?", a: "10", options: ["10", "20"] },
            { q: "Estimate 487 + 112 by rounding to hundreds.", a: "600", options: ["500", "600", "700", "400"] }
        ];

        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function ensureTryAgainButton() {
            const summaryBox = document.getElementById("summary-box");
            if (summaryBox && !summaryBox.querySelector('button[onclick="location.reload()"]')) {
                const button = document.createElement('button');
                button.className = 'next-btn';
                button.style.display = 'block';
                button.style.marginTop = '20px';
                button.innerText = 'Try Again';
                button.onclick = function() { location.reload(); };
                const backButton = summaryBox.querySelector('button[onclick^="location.href"]');
                summaryBox.insertBefore(button, backButton || null);
            }
        }

        function initializeQuiz() {
            shuffleArray(quizData);
            loadQuestion();
        }

        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = current.q;
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";

            current.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            
            // Disable buttons after answer
            btns.forEach(b => b.disabled = true);

            if (selected === current.a) {
                feedback.innerText = "Splashtastic! Correct.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "Glub! The correct answer was " + current.a;
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            const summaryBox = document.getElementById("summary-box");
            summaryBox.classList.remove("hidden");
            ensureTryAgainButton();
            
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
            
            userResults.forEach(item => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
        }

        // Start the quiz
        initializeQuiz();
    </script>
</body>
</html>
