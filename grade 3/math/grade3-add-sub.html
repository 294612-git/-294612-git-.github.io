<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahara Camel Math - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fff4e1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #d2912f;
        }
        h2 { font-family: 'Fredoka', cursive; color: #9b6c2a; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice, .option-btn, .back-link {
            transition: all 0.2s;
        }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #fff8ef;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #f4c16f;
            font-weight: 700;
        }
        .topic-link:hover, .choice:hover {
            background: #ffe7c2;
            transform: translateY(-2px);
            border-color: #9b6c2a;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #f4c16f;
            border-radius: 50px;
            background: white;
            color: #9b6c2a;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #ffe7c2; border-color: #9b6c2a; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #9b6c2a;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #9b6c2a 0%, #f4c16f 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #ffe2b8; }
        .hidden { display: none; }
</style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <h2>🐪 Camel Math</h2>
        <h2 id="question-text">Question</h2>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">Try Again</button>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade3-math-topics.html'">Back to 🐪 Camel Math Topics</button>
    </div>

    <script>
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        const questionPool = [
            { q: "Solve: 456 + 234.", a: "690", options: ["680", "690", "700", "590"] },
            { q: "What is 900 - 457?", a: "443", options: ["443", "543", "453", "553"] },
            { q: "Find the sum of 1,200 and 300.", a: "1,500", options: ["1,500", "900", "1,230", "4,200"] },
            { q: "Subtract 89 from 100.", a: "11", options: ["21", "11", "19", "9"] },
            { q: "What is 25 + 25 + 25 + 25?", a: "100", options: ["75", "100", "125", "50"] },
            { q: "Solve: 672 - 0.", a: "672", options: ["0", "672", "1", "671"] },
            { q: "Add: 30 + 40 + 50.", a: "120", options: ["100", "120", "110", "90"] },
            { q: "If a book has 200 pages and you read 145, how many are left?", a: "55", options: ["65", "55", "45", "75"] },
            { q: "What is 5,000 + 4,000?", a: "9,000", options: ["9,000", "1,000", "900", "10,000"] },
            { q: "Solve: 85 - 29.", a: "56", options: ["66", "56", "64", "54"] },
            { q: "What is 123 + 321?", a: "444", options: ["444", "555", "456", "345"] },
            { q: "Find the difference between 50 and 18.", a: "32", options: ["32", "42", "38", "40"] },
            { q: "Solve: 10 + (20 + 30).", a: "60", options: ["50", "60", "40", "70"] },
            { q: "If you have $20 and buy a toy for $12, how much change do you get?", a: "$8", options: ["$8", "$10", "$7", "$12"] },
            { q: "Add: 150 + 150.", a: "300", options: ["250", "300", "350", "400"] },
            { q: "1,000 - 500 = ___?", a: "500", options: ["400", "500", "600", "100"] },
            { q: "What is 99 + 11?", a: "110", options: ["100", "110", "120", "109"] },
            { q: "Solve: 78 - 34.", a: "44", options: ["44", "34", "54", "42"] },
            { q: "Add 5 to 995.", a: "1,000", options: ["1,000", "990", "1,005", "900"] },
            { q: "200 - ___ = 150.", a: "50", options: ["100", "50", "150", "40"] }
        ];

        const quizData = shuffleArray(questionPool.slice()).slice(0, 5);

        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = current.q;
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";

            current.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            
            // Disable buttons after answer
            btns.forEach(b => b.disabled = true);

            if (selected === current.a) {
                feedback.innerText = "Splashtastic! Correct.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "Glub! The correct answer was " + current.a;
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            const summaryBox = document.getElementById("summary-box");
            summaryBox.classList.remove("hidden");
            
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
            
            userResults.forEach(item => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
        }

        // Start the quiz
        loadQuestion();
    </script>
</body>
</html>
