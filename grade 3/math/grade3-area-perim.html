<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahara Camel Math - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fff4e1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #d2912f;
        }
        h2 { font-family: 'Fredoka', cursive; color: #9b6c2a; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice, .option-btn, .back-link {
            transition: all 0.2s;
        }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #fff8ef;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #f4c16f;
            font-weight: 700;
        }
        .topic-link:hover, .choice:hover {
            background: #ffe7c2;
            transform: translateY(-2px);
            border-color: #9b6c2a;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #f4c16f;
            border-radius: 50px;
            background: white;
            color: #9b6c2a;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #ffe7c2; border-color: #9b6c2a; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #9b6c2a;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #9b6c2a 0%, #f4c16f 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #ffe2b8; }
        .hidden { display: none; }
</style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <h2>🐪 Camel Math</h2>
        <h2 id="question-text">Question</h2>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">Try Again</button>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade3-math-topics.html'">Back to 🐪 Camel Math Topics</button>
    </div>

    <script>
        const quizData = [
            { q: "What is the perimeter of a square with 4-inch sides?", a: "16 in", options: ["8 in", "16 in", "12 in", "20 in"] },
            { q: "A rectangle has a length of 5 cm and a width of 3 cm. What is the area?", a: "15 sq cm", options: ["8 sq cm", "15 sq cm", "16 sq cm", "10 sq cm"] },
            { q: "Perimeter is the distance...", a: "Around a shape", options: ["Inside a shape", "Around a shape", "Through a shape"] },
            { q: "What is the area of a square with a 6-foot side?", a: "36 sq ft", options: ["12 sq ft", "24 sq ft", "36 sq ft", "48 sq ft"] },
            { q: "A triangle has sides of 3, 3, and 3 inches. What is the perimeter?", a: "9 in", options: ["6 in", "9 in", "12 in", "3 in"] },
            { q: "How do you find the area of a rectangle?", a: "Length × Width", options: ["Side + Side", "Length × Width", "Length + Width"] },
            { q: "Find the perimeter of a rectangle with length 10 and width 2.", a: "24", options: ["12", "20", "24", "22"] },
            { q: "If a square's area is 25 square units, what is the length of one side?", a: "5", options: ["10", "5", "25", "4"] },
            { q: "Perimeter is measured in ___ units.", a: "Linear (Straight)", options: ["Square", "Linear (Straight)", "Cubic"] },
            { q: "Area is measured in ___ units.", a: "Square", options: ["Linear", "Square", "Heavy"] },
            { q: "Find the perimeter of a hexagon where every side is 2 cm.", a: "12 cm", options: ["8 cm", "10 cm", "12 cm", "6 cm"] },
            { q: "A garden is 4 meters wide and 4 meters long. What is its area?", a: "16 sq m", options: ["8 sq m", "16 sq m", "12 sq m", "20 sq m"] },
            { q: "What is the perimeter of a rectangle with length 8 and width 5?", a: "26", options: ["13", "26", "40", "21"] },
            { q: "If the perimeter of a square is 20, what is the length of one side?", a: "5", options: ["4", "5", "10", "2"] },
            { q: "Find the area of a rectangle with length 9 and width 2.", a: "18", options: ["11", "18", "22", "20"] },
            { q: "A shape has 3 sides. To find its perimeter you...", a: "Add the 3 sides together", options: ["Multiply the sides", "Add the 3 sides together", "Divide by 3"] },
            { q: "If a rectangle has an area of 24 and a width of 4, what is the length?", a: "6", options: ["20", "6", "10", "8"] },
            { q: "What is the perimeter of a triangle with sides 5, 12, and 13?", a: "30", options: ["30", "25", "60", "17"] },
            { q: "Which shape has 4 equal sides?", a: "Square", options: ["Rectangle", "Circle", "Square", "Triangle"] },
            { q: "Area of a square with side s is...", a: "s × s", options: ["s+s", "s × s", "4 × s", "s ÷ 4"] }
        ];

        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function ensureTryAgainButton() {
            const summaryBox = document.getElementById("summary-box");
            if (summaryBox && !summaryBox.querySelector('button[onclick="location.reload()"]')) {
                const button = document.createElement('button');
                button.className = 'next-btn';
                button.style.display = 'block';
                button.style.marginTop = '20px';
                button.innerText = 'Try Again';
                button.onclick = function() { location.reload(); };
                const backButton = summaryBox.querySelector('button[onclick^="location.href"]');
                summaryBox.insertBefore(button, backButton || null);
            }
        }

        function initializeQuiz() {
            shuffleArray(quizData);
            loadQuestion();
        }

        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = current.q;
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";

            current.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            
            // Disable buttons after answer
            btns.forEach(b => b.disabled = true);

            if (selected === current.a) {
                feedback.innerText = "Splashtastic! Correct.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "Glub! The correct answer was " + current.a;
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            const summaryBox = document.getElementById("summary-box");
            summaryBox.classList.remove("hidden");
            ensureTryAgainButton();
            
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
            
            userResults.forEach(item => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
        }

        // Start the quiz
        initializeQuiz();
    </script>
</body>
</html>
