<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahara Camel Math - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fff4e1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #d2912f;
        }
        h2 { font-family: 'Fredoka', cursive; color: #9b6c2a; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice, .option-btn, .back-link {
            transition: all 0.2s;
        }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #fff8ef;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #f4c16f;
            font-weight: 700;
        }
        .topic-link:hover, .choice:hover {
            background: #ffe7c2;
            transform: translateY(-2px);
            border-color: #9b6c2a;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #f4c16f;
            border-radius: 50px;
            background: white;
            color: #9b6c2a;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #ffe7c2; border-color: #9b6c2a; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #9b6c2a;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #9b6c2a 0%, #f4c16f 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #ffe2b8; }
        .hidden { display: none; }
</style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <h2>🐪 Camel Math</h2>
        <h2 id="question-text">Question</h2>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">Try Again</button>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade3-math-topics.html'">Back to 🐪 Camel Math Topics</button>
    </div>

    <script>
        const questionPool = [
            { q: "What is the product of 7 and 6?", a: "42", options: ["13", "42", "49", "36"] },
            { q: "If you have 24 markers and put them into 4 equal boxes, how many markers are in each box?", a: "6", options: ["6", "8", "4", "12"] },
            { q: "Solve for n: n × 9 = 81.", a: "9", options: ["8", "7", "9", "10"] },
            { q: "What is 56 ÷ 8?", a: "7", options: ["6", "7", "8", "9"] },
            { q: "Which property says 3 × 4 = 4 × 3?", a: "Commutative", options: ["Identity", "Commutative", "Associative", "Zero"] },
            { q: "A spider has 8 legs. How many legs do 5 spiders have in total?", a: "40", options: ["13", "40", "32", "48"] },
            { q: "What is 0 × 125?", a: "0", options: ["125", "1", "0", "100"] },
            { q: "If 4 × 10 = 40, then 40 ÷ 10 = ___?", a: "4", options: ["4", "10", "400", "30"] },
            { q: "Which is a way to show 3 × 5?", a: "3 + 3 + 3 + 3 + 3", options: ["3 + 3 + 3", "5 + 5 + 5", "3 + 5", "5 - 3"] },
            { q: "A classroom has 6 rows of desks with 5 desks in each row. How many desks are there?", a: "30", options: ["11", "25", "30", "35"] },
            { q: "What is 12 ÷ 1?", a: "12", options: ["1", "0", "12", "11"] },
            { q: "Which of these is a multiple of 3?", a: "15", options: ["10", "15", "7", "14"] },
            { q: "Find the missing factor: ___ × 2 = 18.", a: "9", options: ["8", "10", "9", "7"] },
            { q: "What is 9 × 4?", a: "36", options: ["32", "36", "45", "27"] },
            { q: "If you divide 15 by 3, what is the quotient?", a: "5", options: ["5", "3", "18", "12"] },
            { q: "Which equation represents 'twice as many as 8'?", a: "8 × 2", options: ["8 + 2", "8 ÷ 2", "8 × 2", "8 - 2"] },
            { q: "What is 63 ÷ 9?", a: "7", options: ["6", "7", "8", "9"] },
            { q: "10 × 7 is the same as...", a: "70", options: ["17", "70", "107", "3"] },
            { q: "Share 12 cookies among 6 people. Each gets...", a: "2", options: ["6", "3", "2", "4"] },
            { q: "8 × 1 = ___?", a: "8", options: ["1", "8", "0", "9"] }
        ];
        const quizData = shufflePool(questionPool.slice()).slice(0, 5);
        function shufflePool(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function ensureTryAgainButton() {
            const summaryBox = document.getElementById("summary-box");
            if (summaryBox && !summaryBox.querySelector('button[onclick="location.reload()"]')) {
                const button = document.createElement('button');
                button.className = 'next-btn';
                button.style.display = 'block';
                button.style.marginTop = '20px';
                button.innerText = 'Try Again';
                button.onclick = function() { location.reload(); };
                const backButton = summaryBox.querySelector('button[onclick^="location.href"]');
                summaryBox.insertBefore(button, backButton || null);
            }
        }

        function initializeQuiz() {
            shuffleArray(quizData);
            loadQuestion();
        }

        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = current.q;
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";

            current.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            
            // Disable buttons after answer
            btns.forEach(b => b.disabled = true);

            if (selected === current.a) {
                feedback.innerText = "Splashtastic! Correct.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "Glub! The correct answer was " + current.a;
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            const summaryBox = document.getElementById("summary-box");
            summaryBox.classList.remove("hidden");
            ensureTryAgainButton();
            
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
            
            userResults.forEach(item => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
        }

        // Start the quiz
        initializeQuiz();
    </script>
</body>
</html>
