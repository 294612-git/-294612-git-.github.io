<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahara Ostrich History - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f6f0e8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #b86f3d;
        }
        h2 { font-family: 'Fredoka', cursive; color: #8c4d29; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice, .option-btn, .back-link {
            transition: all 0.2s;
        }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #fff4ed;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #e1a472;
            font-weight: 700;
        }
        .topic-link:hover, .choice:hover {
            background: #f7dcc1;
            transform: translateY(-2px);
            border-color: #8c4d29;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #e1a472;
            border-radius: 50px;
            background: white;
            color: #8c4d29;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #f7dcc1; border-color: #8c4d29; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #8c4d29;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #8c4d29 0%, #e1a472 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #f5d3a8; }
        .hidden { display: none; }
</style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <h2>🦤 Ostrich History</h2>
        <h2 id="question-text">Question</h2>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">Try Again</button>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade3-history-topics.html'">Back to 🦤 Ostrich History Topics</button>
    </div>

    <script>
        const questionPool = [
            { q: "Who was the first president?", a: "George Washington", options: ["George Washington", "Abraham Lincoln", "Thomas Jefferson", "John Adams"] },
            { q: "The American flag has ___ stripes", a: "13", options: ["13", "50", "7", "20"] },
            { q: "Independence Day is in ___", a: "July", options: ["July", "December", "January", "October"] },
            { q: "What is the capital of the USA?", a: "Washington, D.C.", options: ["New York", "Washington, D.C.", "Los Angeles", "Chicago"] },
            { q: "Who wrote the Declaration of Independence?", a: "Thomas Jefferson", options: ["George Washington", "Thomas Jefferson", "Benjamin Franklin", "John Hancock"] },
            { q: "What year was America founded?", a: "1776", options: ["1492", "1776", "1865", "2000"] },
            { q: "What is the Statue of Liberty?", a: "A symbol of freedom", options: ["A bridge", "A symbol of freedom", "A mountain", "A river"] },
            { q: "Who fought in the Civil War?", a: "North vs South", options: ["East vs West", "North vs South", "Red vs Blue", "Cats vs Dogs"] },
            { q: "What is the Constitution?", a: "The main law of the USA", options: ["A book", "The main law of the USA", "A map", "A flag"] },
            { q: "Who was Abraham Lincoln?", a: "A president who freed slaves", options: ["A general", "A president who freed slaves", "An explorer", "A teacher"] },
            { q: "What is Thanksgiving?", a: "A holiday to give thanks", options: ["A birthday", "A holiday to give thanks", "A sports day", "A school day"] },
            { q: "What is the White House?", a: "Where the president lives", options: ["A school", "Where the president lives", "A park", "A library"] },
            { q: "What is the Supreme Court?", a: "The highest court", options: ["A playground", "The highest court", "A hospital", "A store"] },
            { q: "What is a pioneer?", a: "Someone who explores new land", options: ["Someone who builds houses", "Someone who explores new land", "Someone who cooks", "Someone who sings"] },
            { q: "What is the Bill of Rights?", a: "First 10 amendments", options: ["A list of foods", "First 10 amendments", "A map of rights", "A book of stories"] },
            { q: "Who was Christopher Columbus?", a: "Explorer who sailed to America", options: ["A president", "Explorer who sailed to America", "A scientist", "A musician"] },
            { q: "What is the Liberty Bell?", a: "A symbol of freedom", options: ["A clock", "A symbol of freedom", "A bell for school", "A toy"] },
            { q: "What is the Gettysburg Address?", a: "A famous speech by Lincoln", options: ["A letter", "A famous speech by Lincoln", "A book", "A map"] },
            { q: "What is the Boston Tea Party?", a: "A protest against taxes", options: ["A party with tea", "A protest against taxes", "A birthday party", "A dance party"] },
            { q: "What is the Emancipation Proclamation?", a: "Document that freed slaves", options: ["A map", "Document that freed slaves", "A flag", "A coin"] }
        ];
        const quizData = shufflePool(questionPool.slice()).slice(0, 5);
        function shufflePool(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function ensureTryAgainButton() {
            const summaryBox = document.getElementById("summary-box");
            if (summaryBox && !summaryBox.querySelector('button[onclick="location.reload()"]')) {
                const button = document.createElement('button');
                button.className = 'next-btn';
                button.style.display = 'block';
                button.style.marginTop = '20px';
                button.innerText = 'Try Again';
                button.onclick = function() { location.reload(); };
                const backButton = summaryBox.querySelector('button[onclick^="location.href"]');
                summaryBox.insertBefore(button, backButton || null);
            }
        }

        function initializeQuiz() {
            shuffleArray(quizData);
            loadQuestion();
        }

        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = current.q;
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";

            current.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            
            // Disable buttons after answer
            btns.forEach(b => b.disabled = true);

            if (selected === current.a) {
                feedback.innerText = "Correct! Well done.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "Oops! The correct answer was " + current.a;
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            const summaryBox = document.getElementById("summary-box");
            summaryBox.classList.remove("hidden");
            
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
            
            userResults.forEach(item => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
        }

        // Start the quiz
        initializeQuiz();
    </script>
</body>
</html>
