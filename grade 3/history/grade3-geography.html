<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahara Ostrich History - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f6f0e8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #b86f3d;
        }
        h2 { font-family: 'Fredoka', cursive; color: #8c4d29; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice, .option-btn, .back-link {
            transition: all 0.2s;
        }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #fff4ed;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #e1a472;
            font-weight: 700;
        }
        .topic-link:hover, .choice:hover {
            background: #f7dcc1;
            transform: translateY(-2px);
            border-color: #8c4d29;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #e1a472;
            border-radius: 50px;
            background: white;
            color: #8c4d29;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #f7dcc1; border-color: #8c4d29; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #8c4d29;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #8c4d29 0%, #e1a472 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #f5d3a8; }
        .hidden { display: none; }
</style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <h2>🦤 Ostrich History</h2>
        <h2 id="question-text">Question</h2>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">Try Again</button>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade3-history-topics.html'">Back to 🦤 Ostrich History Topics</button>
    </div>

    <script>
        const questionPool = [
            { q: "A map shows ___", a: "Places", options: ["Places", "Stories", "Food", "Games"] },
            { q: "The Earth has ___ continents", a: "7", options: ["5", "7", "10", "3"] },
            { q: "Past means ___", a: "Long ago", options: ["Long ago", "Now", "Tomorrow", "Yesterday only"] },
            { q: "Present means ___", a: "Now", options: ["Now", "Later", "Before", "Never"] },
            { q: "What is a globe?", a: "A model of Earth", options: ["A ball", "A model of Earth", "A map", "A book"] },
            { q: "What is a compass?", a: "Tool for directions", options: ["Tool for directions", "Tool for cooking", "Tool for painting", "Tool for swimming"] },
            { q: "What is latitude?", a: "Lines north-south", options: ["Lines east-west", "Lines north-south", "Lines up-down", "Lines left-right"] },
            { q: "What is longitude?", a: "Lines east-west", options: ["Lines north-south", "Lines east-west", "Lines diagonal", "Lines curved"] },
            { q: "What is an ocean?", a: "Large body of water", options: ["Large body of water", "Small pond", "Mountain", "Desert"] },
            { q: "What is a mountain?", a: "High land", options: ["High land", "Low land", "Water", "Sky"] },
            { q: "What is a river?", a: "Flowing water", options: ["Flowing water", "Still water", "Land", "Air"] },
            { q: "What is a desert?", a: "Dry land", options: ["Wet land", "Dry land", "Cold land", "Green land"] },
            { q: "What is a forest?", a: "Trees and animals", options: ["Only trees", "Trees and animals", "Only animals", "Buildings"] },
            { q: "What is a city?", a: "Large town", options: ["Small village", "Large town", "Farm", "Ocean"] },
            { q: "What is a country?", a: "Land with borders", options: ["Land with borders", "Land without borders", "Water", "Sky"] },
            { q: "What is a border?", a: "Line between places", options: ["Line between places", "Line in a book", "Line in art", "Line in math"] },
            { q: "What is climate?", a: "Weather over time", options: ["Weather today", "Weather over time", "Food", "Clothes"] },
            { q: "What is a landmark?", a: "Famous place", options: ["Famous place", "Famous person", "Famous food", "Famous game"] },
            { q: "What is history?", a: "Study of the past", options: ["Study of the past", "Study of the future", "Study of math", "Study of science"] },
            { q: "What is the future?", a: "Time to come", options: ["Time gone", "Time to come", "Time now", "Time stopped"] }
        ];
        const quizData = shufflePool(questionPool.slice()).slice(0, 5);
        function shufflePool(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function ensureTryAgainButton() {
            const summaryBox = document.getElementById("summary-box");
            if (summaryBox && !summaryBox.querySelector('button[onclick="location.reload()"]')) {
                const button = document.createElement('button');
                button.className = 'next-btn';
                button.style.display = 'block';
                button.style.marginTop = '20px';
                button.innerText = 'Try Again';
                button.onclick = function() { location.reload(); };
                const backButton = summaryBox.querySelector('button[onclick^="location.href"]');
                summaryBox.insertBefore(button, backButton || null);
            }
        }

        function initializeQuiz() {
            shuffleArray(quizData);
            loadQuestion();
        }

        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = current.q;
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";

            current.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            
            // Disable buttons after answer
            btns.forEach(b => b.disabled = true);

            if (selected === current.a) {
                feedback.innerText = "Correct! Well done.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "Oops! The correct answer was " + current.a;
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            const summaryBox = document.getElementById("summary-box");
            summaryBox.classList.remove("hidden");
            ensureTryAgainButton();
            
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
            
            userResults.forEach(item => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
        }

        // Start the quiz
        initializeQuiz();
    </script>
</body>
</html>
