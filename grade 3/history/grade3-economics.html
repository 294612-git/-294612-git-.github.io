<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahara Ostrich History - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f6f0e8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #b86f3d;
        }
        h2 { font-family: 'Fredoka', cursive; color: #8c4d29; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice, .option-btn, .back-link {
            transition: all 0.2s;
        }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #fff4ed;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #e1a472;
            font-weight: 700;
        }
        .topic-link:hover, .choice:hover {
            background: #f7dcc1;
            transform: translateY(-2px);
            border-color: #8c4d29;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #e1a472;
            border-radius: 50px;
            background: white;
            color: #8c4d29;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #f7dcc1; border-color: #8c4d29; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #8c4d29;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #8c4d29 0%, #e1a472 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #f5d3a8; }
        .hidden { display: none; }
</style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <h2>🦤 Ostrich History</h2>
        <h2 id="question-text">Question</h2>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">Try Again</button>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade3-history-topics.html'">Back to 🦤 Ostrich History Topics</button>
    </div>

    <script>
        const questionPool = [
            { q: "A need is something you ___", a: "Must have", options: ["Must have", "Want", "Ignore", "Throw away"] },
            { q: "A want is something you ___", a: "Would like", options: ["Need", "Would like", "Must have", "Hate"] },
            { q: "Buying and selling is called ___", a: "Trade", options: ["Trade", "Sleeping", "Eating", "Running"] },
            { q: "What is money?", a: "Way to buy things", options: ["Way to buy things", "Way to play", "Way to sleep", "Way to run"] },
            { q: "What is a job?", a: "Work for pay", options: ["Work for pay", "Play for fun", "Sleep for rest", "Eat for hunger"] },
            { q: "What is a budget?", a: "Plan for spending", options: ["Plan for spending", "Plan for eating", "Plan for sleeping", "Plan for playing"] },
            { q: "What is saving?", a: "Keeping money for later", options: ["Keeping money for later", "Spending money now", "Throwing money away", "Giving money away"] },
            { q: "What is spending?", a: "Using money to buy", options: ["Using money to buy", "Keeping money", "Saving money", "Losing money"] },
            { q: "What is a bank?", a: "Place to keep money", options: ["Place to keep money", "Place to buy food", "Place to play games", "Place to sleep"] },
            { q: "What is interest?", a: "Extra money from savings", options: ["Extra money from savings", "Money you spend", "Money you lose", "Money you give"] },
            { q: "What is a loan?", a: "Borrowed money", options: ["Borrowed money", "Saved money", "Spent money", "Lost money"] },
            { q: "What is credit?", a: "Borrowing without cash", options: ["Borrowing without cash", "Paying with cash", "Saving cash", "Losing cash"] },
            { q: "What is a store?", a: "Place to buy goods", options: ["Place to buy goods", "Place to make goods", "Place to grow goods", "Place to teach"] },
            { q: "What is a factory?", a: "Place to make goods", options: ["Place to make goods", "Place to buy goods", "Place to sell goods", "Place to eat goods"] },
            { q: "What is a farmer?", a: "Grows food", options: ["Grows food", "Makes clothes", "Teaches kids", "Heals people"] },
            { q: "What is a teacher?", a: "Teaches others", options: ["Teaches others", "Grows food", "Makes goods", "Heals people"] },
            { q: "What is a doctor?", a: "Helps sick people", options: ["Helps sick people", "Grows food", "Makes goods", "Teaches kids"] },
            { q: "What is a product?", a: "Thing made to sell", options: ["Thing made to sell", "Help given", "Food grown", "Lesson taught"] },
            { q: "What is a service?", a: "Help given for pay", options: ["Help given for pay", "Thing made", "Food eaten", "Game played"] },
            { q: "What is supply and demand?", a: "How much available and wanted", options: ["How much available and wanted", "How much eaten and drunk", "How much played and slept", "How much taught and learned"] }
        ];
        const quizData = shufflePool(questionPool.slice()).slice(0, 5);
        function shufflePool(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function ensureTryAgainButton() {
            const summaryBox = document.getElementById("summary-box");
            if (summaryBox && !summaryBox.querySelector('button[onclick="location.reload()"]')) {
                const button = document.createElement('button');
                button.className = 'next-btn';
                button.style.display = 'block';
                button.style.marginTop = '20px';
                button.innerText = 'Try Again';
                button.onclick = function() { location.reload(); };
                const backButton = summaryBox.querySelector('button[onclick^="location.href"]');
                summaryBox.insertBefore(button, backButton || null);
            }
        }

        function initializeQuiz() {
            shuffleArray(quizData);
            loadQuestion();
        }

        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = current.q;
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";

            current.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            
            // Disable buttons after answer
            btns.forEach(b => b.disabled = true);

            if (selected === current.a) {
                feedback.innerText = "Correct! Well done.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "Oops! The correct answer was " + current.a;
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            const summaryBox = document.getElementById("summary-box");
            summaryBox.classList.remove("hidden");
            ensureTryAgainButton();
            
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
            
            userResults.forEach(item => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
        }

        // Start the quiz
        initializeQuiz();
    </script>
</body>
</html>
