<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahara Ostrich History - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f6f0e8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #b86f3d;
        }
        h2 { font-family: 'Fredoka', cursive; color: #8c4d29; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice, .option-btn, .back-link {
            transition: all 0.2s;
        }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #fff4ed;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #e1a472;
            font-weight: 700;
        }
        .topic-link:hover, .choice:hover {
            background: #f7dcc1;
            transform: translateY(-2px);
            border-color: #8c4d29;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #e1a472;
            border-radius: 50px;
            background: white;
            color: #8c4d29;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #f7dcc1; border-color: #8c4d29; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #8c4d29;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #8c4d29 0%, #e1a472 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #f5d3a8; }
        .hidden { display: none; }
</style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <h2>🦤 Ostrich History</h2>
        <h2 id="question-text">Question</h2>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">Try Again</button>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade3-history-topics.html'">Back to 🦤 Ostrich History Topics</button>
    </div>

    <script>
        const quizData = [
            { q: "A mayor leads a ___", a: "City", options: ["City", "Country", "School", "Park"] },
            { q: "Laws help keep people ___", a: "Safe", options: ["Safe", "Late", "Hungry", "Tired"] },
            { q: "Citizens should ___", a: "Follow rules", options: ["Follow rules", "Ignore rules", "Play games", "Sleep"] },
            { q: "Voting is a way to ___", a: "Choose leaders", options: ["Choose leaders", "Play games", "Eat food", "Watch TV"] },
            { q: "What is a community?", a: "A group of people living together", options: ["A single person", "A group of people living together", "A building", "A car"] },
            { q: "Who makes city laws?", a: "City council", options: ["Mayor only", "City council", "Teachers", "Doctors"] },
            { q: "What is a governor?", a: "Leader of a state", options: ["Leader of a city", "Leader of a state", "Leader of a school", "Leader of a park"] },
            { q: "What does the president do?", a: "Leads the country", options: ["Leads the country", "Leads a city", "Leads a school", "Leads a park"] },
            { q: "What is a citizen?", a: "Someone who lives in a country", options: ["Someone who lives in a country", "Someone who lives alone", "Someone who lives in space", "Someone who lives underwater"] },
            { q: "What is a rule?", a: "A law or guideline", options: ["A game", "A law or guideline", "A toy", "A food"] },
            { q: "What is a leader?", a: "Someone who guides others", options: ["Someone who guides others", "Someone who follows", "Someone who hides", "Someone who runs"] },
            { q: "What is a town?", a: "A small community", options: ["A large country", "A small community", "A big city", "A river"] },
            { q: "What is a state?", a: "A part of a country", options: ["A whole country", "A part of a country", "A city", "A park"] },
            { q: "What is a country?", a: "A large group of people with a government", options: ["A small town", "A large group of people with a government", "A school", "A hospital"] },
            { q: "What is a flag?", a: "A symbol of a country or state", options: ["A toy", "A symbol of a country or state", "A book", "A map"] },
            { q: "What is a map?", a: "A drawing of places", options: ["A drawing of places", "A drawing of people", "A drawing of animals", "A drawing of food"] },
            { q: "What is a library?", a: "A place with books", options: ["A place with books", "A place with cars", "A place with food", "A place with toys"] },
            { q: "What is a school?", a: "A place to learn", options: ["A place to learn", "A place to sleep", "A place to eat", "A place to play sports"] },
            { q: "What is a hospital?", a: "A place for sick people", options: ["A place for sick people", "A place for healthy people", "A place for animals", "A place for cars"] },
            { q: "What is a park?", a: "A place to play and relax", options: ["A place to work", "A place to play and relax", "A place to study", "A place to drive"] }
        ];

        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function ensureTryAgainButton() {
            const summaryBox = document.getElementById("summary-box");
            if (summaryBox && !summaryBox.querySelector('button[onclick="location.reload()"]')) {
                const button = document.createElement('button');
                button.className = 'next-btn';
                button.style.display = 'block';
                button.style.marginTop = '20px';
                button.innerText = 'Try Again';
                button.onclick = function() { location.reload(); };
                const backButton = summaryBox.querySelector('button[onclick^="location.href"]');
                summaryBox.insertBefore(button, backButton || null);
            }
        }

        function initializeQuiz() {
            shuffleArray(quizData);
            loadQuestion();
        }

        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = current.q;
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";

            current.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            
            // Disable buttons after answer
            btns.forEach(b => b.disabled = true);

            if (selected === current.a) {
                feedback.innerText = "Correct! Well done.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "Oops! The correct answer was " + current.a;
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            const summaryBox = document.getElementById("summary-box");
            summaryBox.classList.remove("hidden");
            ensureTryAgainButton();
            
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
            
            userResults.forEach(item => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
        }

        // Start the quiz
        initializeQuiz();
    </script>
</body>
</html>
