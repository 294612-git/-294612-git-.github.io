<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahara Gerbil Science - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f7f1e1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #947147;
        }
        h2 { font-family: 'Fredoka', cursive; color: #6e4f2f; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice, .option-btn, .back-link {
            transition: all 0.2s;
        }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #fff8ee;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #d9a15d;
            font-weight: 700;
        }
        .topic-link:hover, .choice:hover {
            background: #fff0d6;
            transform: translateY(-2px);
            border-color: #6e4f2f;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #d9a15d;
            border-radius: 50px;
            background: white;
            color: #6e4f2f;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #fff0d6; border-color: #6e4f2f; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #6e4f2f;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #6e4f2f 0%, #d9a15d 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #f5deb3; }
        .hidden { display: none; }
</style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <h2>🐹 Gerbil Science</h2>
        <h2 id="question-text">Question</h2>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">Try Again</button>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade3-science-topics.html'">Back to 🐹 Gerbil Science Topics</button>
    </div>

    <script>
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        const questionPool = [
            { q: "Which state of matter has a fixed shape?", a: "Solid", options: ["Solid", "Liquid", "Gas"] },
            { q: "If you pour a liquid into a bowl, it changes its...", a: "Shape", options: ["Weight", "Volume", "Shape"] },
            { q: "Which of these is a gas?", a: "Oxygen", options: ["Ice", "Oxygen", "Milk", "Wood"] },
            { q: "What happens to water at 212°F (100°C)?", a: "It boils", options: ["It freezes", "It boils", "It turns to ice"] },
            { q: "Matter is anything that has mass and...", a: "Takes up space", options: ["Color", "Takes up space", "Is heavy"] },
            { q: "Which state of matter spreads out to fill a whole room?", a: "Gas", options: ["Solid", "Liquid", "Gas"] },
            { q: "Melting is a change from ___ to ___.", a: "Solid to liquid", options: ["Gas to liquid", "Solid to liquid", "Liquid to solid"] },
            { q: "Tiny particles that make up all matter are called...", a: "Atoms", options: ["Cells", "Atoms", "Crumbs"] },
            { q: "Ice cubes are water in which state?", a: "Solid", options: ["Liquid", "Solid", "Gas"] },
            { q: "When a gas turns back into a liquid, it is called...", a: "Condensation", options: ["Evaporation", "Condensation", "Melting"] },
            { q: "Which has more mass: a bowling ball or a balloon?", a: "Bowling ball", options: ["Bowling ball", "Balloon"] },
            { q: "A \"property\" of matter is something you can...", a: "Observe or measure", options: ["Eat", "Observe or measure", "Buy"] },
            { q: "Is air matter?", a: "Yes", options: ["Yes", "No"] },
            { q: "What tool measures mass?", a: "Balance or scale", options: ["Ruler", "Balance or scale", "Thermometer"] },
            { q: "Which state of matter can you pour?", a: "Liquid", options: ["Solid", "Liquid", "Rock"] },
            { q: "Sublimation is when a solid turns directly into a...", a: "Gas", options: ["Liquid", "Gas", "Metal"] },
            { q: "Which is a physical change?", a: "Cutting paper", options: ["Burning wood", "Cutting paper", "Rusting metal"] },
            { q: "A mixture where one substance dissolves in another is a...", a: "Solution", options: ["Solid", "Solution", "Gas"] },
            { q: "What state of matter is the sun made of?", a: "Plasma", options: ["Solid", "Plasma", "Liquid"] },
            { q: "Can matter change its state?", a: "Yes", options: ["Yes", "No"] }
        ];

        const quizData = shuffleArray(questionPool.slice()).slice(0, 5);

        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = current.q;
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";

            current.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            
            // Disable buttons after answer
            btns.forEach(b => b.disabled = true);

            if (selected === current.a) {
                feedback.innerText = "Splashtastic! Correct.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "Glub! The correct answer was " + current.a;
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            const summaryBox = document.getElementById("summary-box");
            summaryBox.classList.remove("hidden");
            
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
            
            userResults.forEach(item => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
        }

        // Start the quiz
        loadQuestion();
    </script>
</body>
</html>
