<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Force, Motion, Light, Electricity, Magnets Quiz - Study Buddy</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .quiz-container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 500px; text-align: center; }
        h2 { color: #667eea; }
        .options-container { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
        .option-btn { padding: 12px; border: 2px solid #ddd; border-radius: 8px; background: white; cursor: pointer; font-size: 1.1rem; transition: 0.2s; }
        .option-btn:hover { border-color: #667eea; background: #f0f2ff; }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #28a745; }
        .wrong { color: #dc3545; }
        .next-btn { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; display: none; margin: 0 auto; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <h2 id="question-text">Question</h2>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">Try Again</button>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade3-science-topics.html'">Back to Topics</button>
    </div>

    <script>
        const quizData = [
            { q: "Gravity is a force that pulls objects...", a: "Toward the center of the Earth", options: ["Up", "Toward the center of the Earth", "Sideways"] },
            { q: "Friction is a force that occurs when two objects...", a: "Rub together", options: ["Pull apart", "Rub together", "Melt"] },
            { q: "A magnet has a North pole and a ___ pole.", a: "South", options: ["East", "West", "South"] },
            { q: "Which material is a good conductor of electricity?", a: "Copper", options: ["Rubber", "Copper", "Plastic", "Wood"] },
            { q: "When light bounces off a mirror, it is...", a: "Reflection", options: ["Refraction", "Reflection", "Absorption"] },
            { q: "What is a \"push\" or a \"pull\"?", a: "Force", options: ["Velocity", "Force", "Energy"] },
            { q: "To move a heavy object, you need ___ force.", a: "More", options: ["Less", "More", "No"] },
            { q: "Like poles of a magnet (N and N) will...", a: "Repel", options: ["Attract", "Repel", "Explode"] },
            { q: "A path that electricity flows through is a...", a: "Circuit", options: ["Circle", "Circuit", "Wire"] },
            { q: "What slows down a rolling ball on grass?", a: "Friction", options: ["Gravity", "Friction", "Light"] },
            { q: "Materials that do NOT let electricity pass through are...", a: "Insulators", options: ["Conductors", "Insulators", "Magnets"] },
            { q: "White light is actually made of ___ colors.", a: "All colors of the rainbow", options: ["Zero", "Three", "All colors of the rainbow"] },
            { q: "When light bends as it passes through water, it is...", a: "Refraction", options: ["Reflection", "Refraction", "Blocking"] },
            { q: "Shadows are formed when light is...", a: "Blocked", options: ["Bending", "Blocked", "Speeding up"] },
            { q: "The faster an object moves, the more ___ energy it has.", a: "Kinetic", options: ["Potential", "Kinetic", "Electrical"] },
            { q: "Static electricity can make your hair...", a: "Stand up", options: ["Fall out", "Stand up", "Change color"] },
            { q: "Magnets attract objects made of...", a: "Iron", options: ["Aluminum", "Iron", "Gold", "Silver"] },
            { q: "The loudness of a sound is its...", a: "Volume", options: ["Pitch", "Volume", "Echo"] },
            { q: "Sound is caused by...", a: "Vibrations", options: ["Light", "Vibrations", "Magnets"] },
            { q: "A battery is a source of ___ energy.", a: "Chemical", options: ["Light", "Chemical", "Sound"] }
        ];

        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function ensureTryAgainButton() {
            const summaryBox = document.getElementById("summary-box");
            if (summaryBox && !summaryBox.querySelector('button[onclick="location.reload()"]')) {
                const button = document.createElement('button');
                button.className = 'next-btn';
                button.style.display = 'block';
                button.style.marginTop = '20px';
                button.innerText = 'Try Again';
                button.onclick = function() { location.reload(); };
                const backButton = summaryBox.querySelector('button[onclick^="location.href"]');
                summaryBox.insertBefore(button, backButton || null);
            }
        }

        function initializeQuiz() {
            shuffleArray(quizData);
            loadQuestion();
        }

        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = current.q;
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";

            current.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            
            // Disable buttons after answer
            btns.forEach(b => b.disabled = true);

            if (selected === current.a) {
                feedback.innerText = "Splashtastic! Correct.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "Glub! The correct answer was " + current.a;
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            const summaryBox = document.getElementById("summary-box");
            summaryBox.classList.remove("hidden");
            ensureTryAgainButton();
            
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
            
            userResults.forEach(item => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
        }

        // Start the quiz
        initializeQuiz();
    </script>
</body>
</html>
