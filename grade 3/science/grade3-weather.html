<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather & Climate Quiz - Study Buddy</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .quiz-container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 500px; text-align: center; }
        h2 { color: #667eea; }
        .options-container { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
        .option-btn { padding: 12px; border: 2px solid #ddd; border-radius: 8px; background: white; cursor: pointer; font-size: 1.1rem; transition: 0.2s; }
        .option-btn:hover { border-color: #667eea; background: #f0f2ff; }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #28a745; }
        .wrong { color: #dc3545; }
        .next-btn { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; display: none; margin: 0 auto; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <h2 id="question-text">Question</h2>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">Try Again</button>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade3-science-topics.html'">Back to Topics</button>
    </div>

    <script>
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        const questionPool = [
            { q: "Which instrument measures wind speed?", a: "Anemometer", options: ["Thermometer", "Anemometer", "Ruler", "Scale"] },
            { q: "\"Climate\" describes weather over a ___ period of time.", a: "Long", options: ["Short", "Long", "1-hour"] },
            { q: "Which of these is a type of cloud that looks like gray blankets?", a: "Stratus", options: ["Cumulus", "Stratus", "Cirrus"] },
            { q: "What is the process of water turning into vapor called?", a: "Evaporation", options: ["Condensation", "Evaporation", "Freezing"] },
            { q: "A \"drought\" is a long period with very little...", a: "Rain", options: ["Sun", "Rain", "Wind", "Cold"] },
            { q: "Where is the air temperature usually the coldest?", a: "Near the North Pole", options: ["Near the Equator", "Near the North Pole", "In a Rainforest"] },
            { q: "What comes after condensation in the water cycle?", a: "Precipitation", options: ["Evaporation", "Precipitation", "Collection"] },
            { q: "Which season usually has the longest days?", a: "Summer", options: ["Winter", "Summer", "Spring", "Fall"] },
            { q: "A person who predicts the weather is a...", a: "Meteorologist", options: ["Geologist", "Meteorologist", "Biologist"] },
            { q: "Thunder is the sound made by...", a: "Lightning", options: ["Clouds bumping", "Lightning", "Rain hitting the ground"] },
            { q: "Which tool tells us which way the wind is blowing?", a: "Weather Vane", options: ["Rain Gauge", "Weather Vane", "Clock"] },
            { q: "Snow and hail are examples of...", a: "Precipitation", options: ["Gases", "Precipitation", "Wind"] },
            { q: "Air pressure is measured with a...", a: "Barometer", options: ["Barometer", "Thermometer", "Ruler"] },
            { q: "Tropical climates are usually...", a: "Hot and wet", options: ["Cold and dry", "Hot and wet", "Frozen"] },
            { q: "What is a \"forecast\"?", a: "A weather prediction", options: ["A weather history", "A weather prediction", "A type of cloud"] },
            { q: "Hurricanes form over...", a: "Warm ocean water", options: ["Cold land", "Warm ocean water", "Mountains"] },
            { q: "The \"eye\" of a hurricane is usually...", a: "Calm", options: ["Very windy", "Calm", "The rainiest part"] },
            { q: "Fog is actually a cloud that is...", a: "Near the ground", options: ["Very high", "Near the ground", "Made of ice"] },
            { q: "What is the main energy source for the water cycle?", a: "The Sun", options: ["The Moon", "The Sun", "Electricity"] },
            { q: "The temperature at which water freezes is ___ Fahrenheit.", a: "32", options: ["0", "32", "100", "212"] }
        ];

        shuffleArray(questionPool);
        const quizData = questionPool.slice(0, 20);

        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = current.q;
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";

            current.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            
            // Disable buttons after answer
            btns.forEach(b => b.disabled = true);

            if (selected === current.a) {
                feedback.innerText = "Splashtastic! Correct.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "Glub! The correct answer was " + current.a;
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            const summaryBox = document.getElementById("summary-box");
            summaryBox.classList.remove("hidden");
            
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
            
            userResults.forEach(item => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
        }

        // Start the quiz
        loadQuestion();
    </script>
</body>
</html>
