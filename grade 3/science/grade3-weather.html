<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahara Gerbil Science - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f7f1e1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #947147;
        }
        h2 { font-family: 'Fredoka', cursive; color: #6e4f2f; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice, .option-btn, .back-link {
            transition: all 0.2s;
        }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #fff8ee;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #d9a15d;
            font-weight: 700;
        }
        .topic-link:hover, .choice:hover {
            background: #fff0d6;
            transform: translateY(-2px);
            border-color: #6e4f2f;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #d9a15d;
            border-radius: 50px;
            background: white;
            color: #6e4f2f;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #fff0d6; border-color: #6e4f2f; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #6e4f2f;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #6e4f2f 0%, #d9a15d 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #f5deb3; }
        .hidden { display: none; }
</style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <h2>🐹 Gerbil Science</h2>
        <h2 id="question-text">Question</h2>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">Try Again</button>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade3-science-topics.html'">Back to 🐹 Gerbil Science Topics</button>
    </div>

    <script>
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        const questionPool = [
            { q: "Which instrument measures wind speed?", a: "Anemometer", options: ["Thermometer", "Anemometer", "Ruler", "Scale"] },
            { q: "\"Climate\" describes weather over a ___ period of time.", a: "Long", options: ["Short", "Long", "1-hour"] },
            { q: "Which of these is a type of cloud that looks like gray blankets?", a: "Stratus", options: ["Cumulus", "Stratus", "Cirrus"] },
            { q: "What is the process of water turning into vapor called?", a: "Evaporation", options: ["Condensation", "Evaporation", "Freezing"] },
            { q: "A \"drought\" is a long period with very little...", a: "Rain", options: ["Sun", "Rain", "Wind", "Cold"] },
            { q: "Where is the air temperature usually the coldest?", a: "Near the North Pole", options: ["Near the Equator", "Near the North Pole", "In a Rainforest"] },
            { q: "What comes after condensation in the water cycle?", a: "Precipitation", options: ["Evaporation", "Precipitation", "Collection"] },
            { q: "Which season usually has the longest days?", a: "Summer", options: ["Winter", "Summer", "Spring", "Fall"] },
            { q: "A person who predicts the weather is a...", a: "Meteorologist", options: ["Geologist", "Meteorologist", "Biologist"] },
            { q: "Thunder is the sound made by...", a: "Lightning", options: ["Clouds bumping", "Lightning", "Rain hitting the ground"] },
            { q: "Which tool tells us which way the wind is blowing?", a: "Weather Vane", options: ["Rain Gauge", "Weather Vane", "Clock"] },
            { q: "Snow and hail are examples of...", a: "Precipitation", options: ["Gases", "Precipitation", "Wind"] },
            { q: "Air pressure is measured with a...", a: "Barometer", options: ["Barometer", "Thermometer", "Ruler"] },
            { q: "Tropical climates are usually...", a: "Hot and wet", options: ["Cold and dry", "Hot and wet", "Frozen"] },
            { q: "What is a \"forecast\"?", a: "A weather prediction", options: ["A weather history", "A weather prediction", "A type of cloud"] },
            { q: "Hurricanes form over...", a: "Warm ocean water", options: ["Cold land", "Warm ocean water", "Mountains"] },
            { q: "The \"eye\" of a hurricane is usually...", a: "Calm", options: ["Very windy", "Calm", "The rainiest part"] },
            { q: "Fog is actually a cloud that is...", a: "Near the ground", options: ["Very high", "Near the ground", "Made of ice"] },
            { q: "What is the main energy source for the water cycle?", a: "The Sun", options: ["The Moon", "The Sun", "Electricity"] },
            { q: "The temperature at which water freezes is ___ Fahrenheit.", a: "32", options: ["0", "32", "100", "212"] }
        ];

        const quizData = shuffleArray(questionPool.slice()).slice(0, 5);

        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = current.q;
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";

            current.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            
            // Disable buttons after answer
            btns.forEach(b => b.disabled = true);

            if (selected === current.a) {
                feedback.innerText = "Splashtastic! Correct.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "Glub! The correct answer was " + current.a;
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            const summaryBox = document.getElementById("summary-box");
            summaryBox.classList.remove("hidden");
            
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
            
            userResults.forEach(item => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
        }

        // Start the quiz
        loadQuestion();
    </script>
</body>
</html>
