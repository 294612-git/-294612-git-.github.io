<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahara Gerbil Science - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f7f1e1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #947147;
        }
        h2 { font-family: 'Fredoka', cursive; color: #6e4f2f; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice, .option-btn, .back-link {
            transition: all 0.2s;
        }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #fff8ee;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #d9a15d;
            font-weight: 700;
        }
        .topic-link:hover, .choice:hover {
            background: #fff0d6;
            transform: translateY(-2px);
            border-color: #6e4f2f;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #d9a15d;
            border-radius: 50px;
            background: white;
            color: #6e4f2f;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #fff0d6; border-color: #6e4f2f; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #6e4f2f;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #6e4f2f 0%, #d9a15d 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #f5deb3; }
        .hidden { display: none; }
</style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <h2>🐹 Gerbil Science</h2>
        <h2 id="question-text">Question</h2>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">Try Again</button>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade3-science-topics.html'">Back to 🐹 Gerbil Science Topics</button>
    </div>

    <script>
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        const questionPool = [
            { q: "An organism that makes its own food is a...", a: "Producer", options: ["Consumer", "Producer", "Decomposer"] },
            { q: "What do we call a consumer that only eats meat?", a: "Carnivore", options: ["Herbivore", "Carnivore", "Omnivore"] },
            { q: "The place where an animal lives is its...", a: "Habitat", options: ["Niche", "Habitat", "Food chain"] },
            { q: "In a food chain, arrows show the flow of...", a: "Energy", options: ["Water", "Energy", "Wind"] },
            { q: "Fungi and bacteria that break down dead things are...", a: "Decomposers", options: ["Producers", "Decomposers", "Predators"] },
            { q: "Which of these is a producer?", a: "Grass", options: ["Grass", "Grasshopper", "Frog", "Hawk"] },
            { q: "An animal that is hunted for food is called...", a: "Prey", options: ["Predator", "Prey", "Producer"] },
            { q: "Humans are usually considered...", a: "Omnivores", options: ["Herbivores", "Carnivores", "Omnivores"] },
            { q: "What starts almost every food chain?", a: "Sunlight", options: ["Rain", "Sunlight", "Soil"] },
            { q: "If one part of a food web is removed, what happens?", a: "Other parts are affected", options: ["Nothing", "Other parts are affected", "Everything grows"] },
            { q: "Camouflage is an ___ that helps animals survive.", a: "Adaptation", options: ["Accident", "Adaptation", "Illness"] },
            { q: "A group of the same kind of animals living together is a...", a: "Population", options: ["Community", "Population", "Ecosystem"] },
            { q: "Which ecosystem is very dry and hot?", a: "Desert", options: ["Rainforest", "Desert", "Tundra"] },
            { q: "Plants need ___ from the air to make food.", a: "Carbon Dioxide", options: ["Oxygen", "Carbon Dioxide", "Nitrogen"] },
            { q: "The process plants use to make food is...", a: "Photosynthesis", options: ["Digestion", "Photosynthesis", "Respiration"] },
            { q: "Animals that eat both plants and animals are...", a: "Omnivores", options: ["Carnivores", "Herbivores", "Omnivores"] },
            { q: "Which animal is a \"scavenger\"?", a: "Vulture", options: ["Vulture", "Lion", "Rabbit"] },
            { q: "Pollution is ___ to an ecosystem.", a: "Harmful", options: ["Helpful", "Harmful", "Necessary"] },
            { q: "A \"niche\" is an animal's ___ in its habitat.", a: "Job/Role", options: ["House", "Job/Role", "Color"] },
            { q: "Coral reefs are found in ___ ecosystems.", a: "Saltwater", options: ["Freshwater", "Saltwater", "Land"] }
        ];

        const quizData = shuffleArray(questionPool.slice()).slice(0, 5);

        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = current.q;
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";

            current.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            
            // Disable buttons after answer
            btns.forEach(b => b.disabled = true);

            if (selected === current.a) {
                feedback.innerText = "Splashtastic! Correct.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "Glub! The correct answer was " + current.a;
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            const summaryBox = document.getElementById("summary-box");
            summaryBox.classList.remove("hidden");
            
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
            
            userResults.forEach(item => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
        }

        // Start the quiz
        loadQuestion();
    </script>
</body>
</html>
