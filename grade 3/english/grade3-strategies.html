<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahara Gazelle Reading - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fff8e5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #d2924a;
        }
        h2 { font-family: 'Fredoka', cursive; color: #b16e27; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice, .option-btn, .back-link {
            transition: all 0.2s;
        }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #fff7ef;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #f0bc78;
            font-weight: 700;
        }
        .topic-link:hover, .choice:hover {
            background: #ffe9c7;
            transform: translateY(-2px);
            border-color: #b16e27;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #f0bc78;
            border-radius: 50px;
            background: white;
            color: #b16e27;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #ffe9c7; border-color: #b16e27; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #b16e27;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #b16e27 0%, #f0bc78 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #ffe5c1; }
        .hidden { display: none; }
</style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <h2>🦌 Gazelle Reading</h2>
        <h2 id="question-text">Question</h2>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">Try Again</button>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade3-reading-topics.html'">Back to 🦌 Gazelle Reading Topics</button>
    </div>

    <script>
        const quizData = [
            { q: "The \"Main Idea\" is...", a: "What the text is mostly about", options: ["A character's name", "What the text is mostly about", "The last sentence"] },
            { q: "Supporting details ___ the main idea.", a: "Describe or explain", options: ["Oppose", "Describe or explain", "Hide"] },
            { q: "When you \"predict,\" you guess what will happen...", a: "Next", options: ["In the past", "Next", "In another book"] },
            { q: "An \"inference\" is a guess based on clues and...", a: "What you already know", options: ["The title", "What you already know", "The pictures only"] },
            { q: "The \"Setting\" of a story is...", a: "The time and place", options: ["The people", "The time and place", "The problem"] },
            { q: "The \"Theme\" is the ___ of the story.", a: "Lesson or message", options: ["Lesson or message", "Main event", "List of items"] },
            { q: "Characters are the ___ in a story.", a: "People or animals", options: ["Places", "People or animals", "Problems"] },
            { q: "A \"Summary\" should be...", a: "Short", options: ["Long", "Short", "The whole book"] },
            { q: "Point of View tells us...", a: "Who is telling the story", options: ["Who is telling the story", "Where the book was made"] },
            { q: "\"First person\" point of view uses the word...", a: "I", options: ["He", "I", "They", "She"] },
            { q: "The \"Plot\" is the ___ of a story.", a: "Sequence of events", options: ["Sequence of events", "Character's favorite food"] },
            { q: "The \"Conflict\" is the...", a: "Problem", options: ["Solution", "Problem", "Ending"] },
            { q: "Comparing two things using \"like\" or \"as\" is a...", a: "Simile", options: ["Simile", "Metaphor", "Verb"] },
            { q: "\"The snow was a white blanket\" is a...", a: "Metaphor", options: ["Simile", "Metaphor", "Question"] },
            { q: "Context clues help you find a word's...", a: "Meaning", options: ["Spelling", "Meaning", "Page"] },
            { q: "Informational text often has...", a: "Captions and diagrams", options: ["Magic", "Captions and diagrams", "Rhymes"] },
            { q: "A \"Cause\" is...", a: "Why it happened", options: ["What happened", "Why it happened", "The result"] },
            { q: "An \"Effect\" is...", a: "What happened as a result", options: ["Why it happened", "What happened as a result"] },
            { q: "Chronological order means...", a: "In time order", options: ["Alphabetical", "In time order", "Most important first"] },
            { q: "An \"Author's Purpose\" can be to...", a: "Entertain", options: ["Persuade", "Inform", "Entertain", "All of these"] },
            { q: "Fiction is...", a: "Made up", options: ["Real", "Made up", "A dictionary"] },
            { q: "A \"Table of Contents\" is found at the ___ of a book.", a: "Front", options: ["Front", "Back", "Middle"] },
            { q: "An \"Index\" helps you find...", a: "Specific topics", options: ["Specific topics", "The author's name", "The title"] },
            { q: "\"Visualizing\" means making a ___ in your mind.", a: "Picture", options: ["List", "Picture", "Sound"] },
            { q: "A \"Biography\" is a story about...", a: "A real person's life", options: ["A fake animal", "A real person's life", "How to cook"] }
        ];

        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function ensureTryAgainButton() {
            const summaryBox = document.getElementById("summary-box");
            if (summaryBox && !summaryBox.querySelector('button[onclick="location.reload()"]')) {
                const button = document.createElement('button');
                button.className = 'next-btn';
                button.style.display = 'block';
                button.style.marginTop = '20px';
                button.innerText = 'Try Again';
                button.onclick = function() { location.reload(); };
                const backButton = summaryBox.querySelector('button[onclick^="location.href"]');
                summaryBox.insertBefore(button, backButton || null);
            }
        }

        function initializeQuiz() {
            shuffleArray(quizData);
            loadQuestion();
        }

        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = current.q;
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";

            current.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            
            // Disable buttons after answer
            btns.forEach(b => b.disabled = true);

            if (selected === current.a) {
                feedback.innerText = "Splashtastic! Correct.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "Glub! The correct answer was " + current.a;
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            const summaryBox = document.getElementById("summary-box");
            summaryBox.classList.remove("hidden");
            ensureTryAgainButton();
            
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
            
            userResults.forEach(item => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
        }

        // Start the quiz
        initializeQuiz();
    </script>
</body>
</html>
