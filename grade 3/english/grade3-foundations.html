<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Foundations Quiz - Study Buddy</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .quiz-container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 500px; text-align: center; }
        h2 { color: #667eea; }
        .options-container { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
        .option-btn { padding: 12px; border: 2px solid #ddd; border-radius: 8px; background: white; cursor: pointer; font-size: 1.1rem; transition: 0.2s; }
        .option-btn:hover { border-color: #667eea; background: #f0f2ff; }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #28a745; }
        .wrong { color: #dc3545; }
        .next-btn { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; display: none; margin: 0 auto; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <h2 id="question-text">Question</h2>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">Try Again</button>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade3-reading-topics.html'">Back to Topics</button>
    </div>

    <script>
        const quizData = [
            { q: "What is the root word of \"unhelpful\"?", a: "Help", options: ["Un", "Help", "Ful", "Helpful"] },
            { q: "Which word has a suffix?", a: "Joyful", options: ["Prepay", "Joyful", "Dislike", "Under"] },
            { q: "What does the prefix \"re-\" mean?", a: "Again", options: ["Not", "Again", "Before", "After"] },
            { q: "A compound word is made of...", a: "Two smaller words", options: ["One word", "Two smaller words", "A prefix and suffix"] },
            { q: "Which is a compound word?", a: "Butterfly", options: ["Running", "Butterfly", "Happier", "Purple"] },
            { q: "What does the suffix \"-er\" usually mean?", a: "One who", options: ["One who", "Without", "Full of"] },
            { q: "How many syllables in \"Conversation\"?", a: "4", options: ["2", "3", "4", "5"] },
            { q: "Which word has a long \"a\" sound?", a: "Cake", options: ["Cat", "Cake", "Apple", "Bath"] },
            { q: "\"Pre-\" in \"Preview\" means...", a: "Before", options: ["During", "After", "Before"] },
            { q: "Which word is plural?", a: "Cats", options: ["Dog", "Cats", "Bird", "Fish (singular)"] },
            { q: "What is the prefix in \"Disappear\"?", a: "Dis", options: ["Appear", "Dis", "Ear"] },
            { q: "A synonym for \"Fast\" is...", a: "Quick", options: ["Slow", "Quick", "Loud", "Big"] },
            { q: "An antonym for \"Hot\" is...", a: "Cold", options: ["Warm", "Cold", "Spicy", "Wet"] },
            { q: "\"Knight\" and \"Night\" are...", a: "Homophones", options: ["Synonyms", "Antonyms", "Homophones"] },
            { q: "What does \"non-fiction\" mean?", a: "Real/True information", options: ["Fake story", "Real/True information", "A poem"] },
            { q: "In \"Bi-weekly,\" what does \"bi-\" mean?", a: "Two", options: ["One", "Two", "Three"] },
            { q: "Which is a silent letter in \"Knife\"?", a: "k", options: ["n", "k", "f"] },
            { q: "\"Bark\" (tree) and \"Bark\" (dog) are...", a: "Homographs", options: ["Homophones", "Homographs", "Synonyms"] },
            { q: "What does the suffix \"-less\" mean?", a: "Without", options: ["More", "Without", "Full of"] },
            { q: "Which word has 1 syllable?", a: "Jump", options: ["Apple", "Jump", "Table", "Banana"] },
            { q: "The base word of \"happiest\" is...", a: "Happy", options: ["Hap", "Happy", "Est"] },
            { q: "\"Un-\" in \"Unkind\" means...", a: "Not", options: ["Very", "Not", "Again"] },
            { q: "Which word starts with a blend?", a: "Dog", options: ["Cat", "Blue", "Dog", "Apple"] },
            { q: "What is a \"contraction\"?", a: "Two words shortened with an apostrophe", options: ["A long word", "Two words shortened with an apostrophe", "A suffix"] },
            { q: "\"Don't\" is a contraction for...", a: "Do not", options: ["Do not", "Does not", "Did not"] }
        ];

        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function ensureTryAgainButton() {
            const summaryBox = document.getElementById("summary-box");
            if (summaryBox && !summaryBox.querySelector('button[onclick="location.reload()"]')) {
                const button = document.createElement('button');
                button.className = 'next-btn';
                button.style.display = 'block';
                button.style.marginTop = '20px';
                button.innerText = 'Try Again';
                button.onclick = function() { location.reload(); };
                const backButton = summaryBox.querySelector('button[onclick^="location.href"]');
                summaryBox.insertBefore(button, backButton || null);
            }
        }

        function initializeQuiz() {
            shuffleArray(quizData);
            loadQuestion();
        }

        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = current.q;
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";

            current.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            
            // Disable buttons after answer
            btns.forEach(b => b.disabled = true);

            if (selected === current.a) {
                feedback.innerText = "Splashtastic! Correct.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "Glub! The correct answer was " + current.a;
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            const summaryBox = document.getElementById("summary-box");
            summaryBox.classList.remove("hidden");
            ensureTryAgainButton();
            
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
            
            userResults.forEach(item => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
        }

        // Start the quiz
        initializeQuiz();
    </script>
</body>
</html>
