<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mountain Mountain Goats Math - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #edf2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #7c8a96;
        }
        h2 { font-family: 'Fredoka', cursive; color: #3f4d57; }
        .theme-sub { color: #b1c1cc; font-weight: bold; margin-bottom: 1.5rem; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #f7fbfd;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #b1c1cc;
            font-weight: 700;
            transition: all 0.2s;
        }
        .topic-link:hover, .choice:hover {
            background: #e7eef4;
            transform: translateY(-2px);
            border-color: #3f4d57;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #b1c1cc;
            border-radius: 50px;
            background: white;
            color: #3f4d57;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #e7eef4; border-color: #3f4d57; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #3f4d57;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #3f4d57 0%, #b1c1cc 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #d8e2e8; }
        .hidden { display: none; }
</style>
</head>
<body>
    <div class="topics-container">

        <a href="grade6-geometry-statistics.html" class="topic-link">Geometry & Statistics</a>

        <a href="../../startquiz.html" class="back-link">← Back to 🐐 Mountain Goat Math Selection</a>
    </div>
