<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mountain Mountain Goats Math - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #edf2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #7c8a96;
        }
        h2 { font-family: 'Fredoka', cursive; color: #3f4d57; }
        .theme-sub { color: #b1c1cc; font-weight: bold; margin-bottom: 1.5rem; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #f7fbfd;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #b1c1cc;
            font-weight: 700;
            transition: all 0.2s;
        }
        .topic-link:hover, .choice:hover {
            background: #e7eef4;
            transform: translateY(-2px);
            border-color: #3f4d57;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #b1c1cc;
            border-radius: 50px;
            background: white;
            color: #3f4d57;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #e7eef4; border-color: #3f4d57; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #3f4d57;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #3f4d57 0%, #b1c1cc 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #d8e2e8; }
        .hidden { display: none; }
</style>
</head>
<body>
    <div class="quiz-container" id="quiz-box">
        <h2>🐐 Mountain Goat Math</h2>
        <h1>🔢 Expressions and Equations</h1>
        <h2 id="question-text" style="color: #333;">Question</h2>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade6-math-topics.html'">Back to Math Topics</button>
    </div>

    <script>
        const questionPool = [
            { q: "Evaluate 5x² - 3(x + 2) when x = 3.", a: "A) 30", options: ["A) 30", "B) 42", "C) 36", "D) 24"] },
            { q: "Simplify the expression by combining like terms: 8a + 2(3a - 4b) + 5b.", a: "A) 14a - 3b", options: ["A) 14a - 3b", "B) 11a + b", "C) 14a + 13b", "D) 11a - 3b"] },
            { q: "Solve for x: 3.2x - 4 = 12.", a: "A) 5", options: ["A) 5", "B) 4", "C) 2.5", "D) 6"] },
            { q: "Which expression represents \"the quotient of the sum of x and 5 and the product of 2 and y\"?", a: "A) (x+5) / 2y", options: ["A) (x+5) / 2y", "B) x + 5 / 2y", "C) 2y / (x+5)", "D) (x+5) * 2y"] },
            { q: "Solve for m: 3/4 m = 12.", a: "B) 16", options: ["A) 9", "B) 16", "C) 15", "D) 18"] },
            { q: "What is the value of (2³ * 3²) / 6?", a: "A) 12", options: ["A) 12", "B) 6", "C) 24", "D) 18"] },
            { q: "Apply the distributive property and simplify: -4(2x - 3) + 5x.", a: "B) -3x + 12", options: ["A) -3x - 12", "B) -3x + 12", "C) -13x + 12", "D) -13x - 12"] },
            { q: "Solve for k: k/5 + 1.2 = 3.2.", a: "A) 10", options: ["A) 10", "B) 5", "C) 15", "D) 20"] },
            { q: "Simplify: 100 - [5 + 2 * (3² - 1)].", a: "A) 79", options: ["A) 79", "B) 85", "C) 81", "D) 71"] },
            { q: "If 4x + 7 = 31, what is the value of x - 2?", a: "B) 4", options: ["A) 6", "B) 4", "C) 8", "D) 5"] },
            { q: "Solve for x: 1/2 x + 1/4 x = 12.", a: "A) 16", options: ["A) 16", "B) 24", "C) 8", "D) 12"] },
            { q: "Which inequality represents \"a weight w must be at least 10 lbs but no more than 50 lbs\"?", a: "B) 10 ≤ w ≤ 50", options: ["A) 10 < w < 50", "B) 10 ≤ w ≤ 50", "C) w > 10", "D) w < 50"] },
            { q: "Simplify: 3(2a + 4b) - 2(a + b).", a: "A) 4a + 10b", options: ["A) 4a + 10b", "B) 4a + 6b", "C) 8a + 10b", "D) 4a + 12b"] },
            { q: "Solve for p: 5p - 3 = 2p + 12.", a: "B) 5", options: ["A) 3", "B) 5", "C) 4", "D) 6"] },
            { q: "If x/2 = 8, what is x²?", a: "C) 256", options: ["A) 16", "B) 64", "C) 256", "D) 128"] },
            { q: "Which set of values contains only solutions to 2x + 1 > 9?", a: "B) {5, 6, 7}", options: ["A) {4, 5, 6}", "B) {5, 6, 7}", "C) {3, 4, 5}", "D) {1, 2, 3}"] },
            { q: "Find the perimeter of a rectangle if the length is (2x + 1) and the width is (x + 3).", a: "B) 6x + 8", options: ["A) 3x + 4", "B) 6x + 8", "C) 2x² + 7x + 3", "D) 6x + 4"] },
            { q: "Evaluate: 2 * [15 - (2+3)² / 5].", a: "A) 20", options: ["A) 20", "B) 10", "C) 50", "D) 40"] },
            { q: "Solve for y: 0.05y = 2.5.", a: "B) 50", options: ["A) 5", "B) 50", "C) 500", "D) 0.5"] },
            { q: "Evaluate x⁰ + x¹ + x² for x = 4.", a: "B) 21", options: ["A) 20", "B) 21", "C) 16", "D) 17"] }
        ];
        const quizData = shufflePool(questionPool.slice()).slice(0, 5);
        function shufflePool(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }
        let currentIdx = 0; let score = 0; let userResults = [];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function ensureTryAgainButton() {
            const summaryBox = document.getElementById("summary-box");
            if (summaryBox && !summaryBox.querySelector('button[onclick="location.reload()"]')) {
                const button = document.createElement('button');
                button.className = 'next-btn';
                button.style.display = 'block';
                button.style.marginTop = '20px';
                button.innerText = 'Try Again';
                button.onclick = function() { location.reload(); };
                const backButton = summaryBox.querySelector('button[onclick^="location.href"]');
                summaryBox.insertBefore(button, backButton || null);
            }
        }

        function initializeQuiz() {
            shuffleArray(quizData);
            loadQuestion();
        }

        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = current.q;
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";
            current.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            btns.forEach(b => b.disabled = true);
            if (selected === current.a) {
                feedback.innerText = "Awesome! Correct.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "Oops! The correct answer was " + current.a;
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) { loadQuestion(); } 
            else { showSummary(); }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            document.getElementById("summary-box").classList.remove("hidden");
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
            userResults.forEach(item => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
            ensureTryAgainButton();
        }
        initializeQuiz();
    </script>
</body>
</html>
