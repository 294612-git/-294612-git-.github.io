<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mountain Alpaca Reading - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fdf9f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #bda487;
        }
        h2 { font-family: 'Fredoka', cursive; color: #7f6b55; }
        .theme-sub { color: #d6bfa8; font-weight: bold; margin-bottom: 1.5rem; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #fdf8f2;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #d6bfa8;
            font-weight: 700;
            transition: all 0.2s;
        }
        .topic-link:hover, .choice:hover {
            background: #f7efe5;
            transform: translateY(-2px);
            border-color: #7f6b55;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #d6bfa8;
            border-radius: 50px;
            background: white;
            color: #7f6b55;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #f7efe5; border-color: #7f6b55; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #7f6b55;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #7f6b55 0%, #d6bfa8 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #e8dccf; }
        .hidden { display: none; }
</style>
</head>
<body>
    <div id="quiz-container">
        <h1>Grade 6 English Quiz: Grammar and Sentence Structure</h1>
        <div id="round-indicator">Round 1 of 2</div>
        <div id="progress-bar">
            <div id="progress"></div>
        </div>
        <div id="question-container">
            <p id="question"></p>
            <div id="options"></div>
        </div>
        <button id="next-btn" onclick="nextQuestion()">Next</button>
    </div>
    <div id="summary" style="display:none;">
        <h2>Quiz Complete!</h2>
        <p id="final-score"></p>
        <p id="round-scores"></p>
        <a href="grade6-english-topics.html">Back to English Topics</a>
    </div>
    <script>
        const allQuestions = [
            [
                {
                    q: "What is the \"Subordinating Conjunction\" in this sentence? \"Since it was raining, we stayed inside.\"",
                    options: ["A) It", "B) Was", "C) Since", "D) Inside"],
                    a: 2
                },
                {
                    q: "A \"Gerund\" is a verb form ending in -ing that acts as a:",
                    options: ["A) Verb", "B) Noun", "C) Adjective", "D) Adverb"],
                    a: 1
                },
                {
                    q: "Identify the \"Relative Pronoun\": \"The book that I bought was expensive.\"",
                    options: ["A) The", "B) That", "C) I", "D) Was"],
                    a: 1
                },
                {
                    q: "Which of these is an \"Infinitive\"?",
                    options: ["A) Running", "B) To run", "C) Ran", "D) Run"],
                    a: 1
                },
                {
                    q: "A \"Restrictive Clause\" is one that:",
                    options: ["A) Is not necessary to the sentence", "B) Is essential to the meaning of the sentence and has no commas", "C) Is always at the end", "D) Contains an interjection"],
                    a: 1
                },
                {
                    q: "What is \"Parallel Structure\"?",
                    options: ["A) Using two lines", "B) Using the same grammatical form for items in a list", "C) Making a sentence long", "D) Using only adjectives"],
                    a: 1
                },
                {
                    q: "Identify the \"Appositive\": \"My friend, a talented artist, won the prize.\"",
                    options: ["A) My friend", "B) A talented artist", "C) Won the prize", "D) The prize"],
                    a: 1
                },
                {
                    q: "Which sentence uses a \"Semicolon\" correctly?",
                    options: ["A) I went to the store; because I was hungry.", "B) The weather was beautiful; however, we stayed in.", "C) I like: apples; oranges; and grapes.", "D) He said; \"Hello.\""],
                    a: 1
                },
                {
                    q: "\"Active Voice\" means:",
                    options: ["A) The sentence is loud", "B) The subject performs the action", "C) The subject receives the action", "D) There is no verb"],
                    a: 1
                },
                {
                    q: "Identify the \"Predicate Adjective\": \"The soup tasted delicious.\"",
                    options: ["A) Soup", "B) Tasted", "C) Delicious", "D) The"],
                    a: 2
                }
            ],
            [
                {
                    q: "A \"Comma Splice\" occurs when:",
                    options: ["A) A comma is missing", "B) Two independent clauses are joined by only a comma", "C) A comma is used before a conjunction", "D) There are too many commas"],
                    a: 1
                },
                {
                    q: "\"Whom\" should be used when the word is:",
                    options: ["A) The subject of the sentence", "B) The object of a verb or preposition", "C) A possessive", "D) An action"],
                    a: 1
                },
                {
                    q: "What is an \"Intransitive Verb\"?",
                    options: ["A) A verb that takes a direct object", "B) A verb that does not take a direct object (e.g., \"She slept\")", "C) A verb with no tense", "D) A helping verb"],
                    a: 1
                },
                {
                    q: "In the sentence \"He gave her a flower,\" what is \"her\"?",
                    options: ["A) Subject", "B) Direct Object", "C) Indirect Object", "D) Preposition"],
                    a: 2
                },
                {
                    q: "Which of these is a \"Modal Verb\"?",
                    options: ["A) Run", "B) Should", "C) Quickly", "D) Blue"],
                    a: 1
                },
                {
                    q: "A \"Participle\" used as an adjective is seen in:",
                    options: ["A) He is crying.", "B) The crying baby was loud.", "C) To cry is human.", "D) Stop crying."],
                    a: 1
                },
                {
                    q: "Identify the \"Coordinating Conjunction\":",
                    options: ["A) Although", "B) And", "C) Because", "D) Since"],
                    a: 1
                },
                {
                    q: "\"Ellipsis\" (...) is used to:",
                    options: ["A) End a sentence", "B) Indicate omitted words or a pause", "C) List items", "D) Show excitement"],
                    a: 1
                },
                {
                    q: "Which sentence is in the \"Imperative Mood\"?",
                    options: ["A) I am eating.", "B) Will you eat?", "C) Eat your dinner.", "D) I wish I could eat."],
                    a: 2
                },
                {
                    q: "\"Misplaced Modifier\" means:",
                    options: ["A) A word is spelled wrong", "B) A describing phrase is too far from the word it describes", "C) There is no subject", "D) The verb tense is wrong"],
                    a: 1
                }
            ]
        ];

        const questionPool = allQuestions.flat();
        let quizData = [];
        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function shufflePool(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initializeQuiz() {
            quizData = shufflePool(questionPool.slice()).slice(0, 5);
            currentIdx = 0;
            score = 0;
            userResults = [];
            document.getElementById('quiz-container').style.display = 'block';
            document.getElementById('summary').style.display = 'none';
            loadQuestion();
        }

        function loadQuestion() {
            const q = quizData[currentIdx];
            document.getElementById('round-indicator').textContent = `Question ${currentIdx + 1} of ${quizData.length}`;
            document.getElementById('question').textContent = q.q;
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(i);
                optionsDiv.appendChild(btn);
            });
            updateProgress();
            document.getElementById('next-btn').style.display = 'none';
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const correct = current.a;
            const buttons = document.querySelectorAll('#options button');
            buttons.forEach(btn => btn.disabled = true);
            if (selected === correct) {
                buttons[selected].classList.add('correct');
                score++;
                userResults.push({ q: current.q, res: 'Correct', class: 'correct' });
            } else {
                buttons[selected].classList.add('wrong');
                buttons[correct].classList.add('correct');
                userResults.push({ q: current.q, res: `Wrong (Answer: ${current.options[correct]})`, class: 'wrong' });
            }
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function updateProgress() {
            const percent = ((currentIdx + 1) / quizData.length) * 100;
            document.getElementById('progress').style.width = `${percent}%`;
        }

        function showSummary() {
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('summary').style.display = 'block';
            document.getElementById('final-score').textContent = `Final Score: ${score} out of ${quizData.length}`;
            document.getElementById('round-scores').textContent = '';
        }

        initializeQuiz();
    </script>
