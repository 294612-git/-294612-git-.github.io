<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mountain Vulture Science - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f1f3f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #6d757c;
        }
        h2 { font-family: 'Fredoka', cursive; color: #3d444a; }
        .theme-sub { color: #a7aeb3; font-weight: bold; margin-bottom: 1.5rem; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #fafbfc;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #a7aeb3;
            font-weight: 700;
            transition: all 0.2s;
        }
        .topic-link:hover, .choice:hover {
            background: #e8ecef;
            transform: translateY(-2px);
            border-color: #3d444a;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #a7aeb3;
            border-radius: 50px;
            background: white;
            color: #3d444a;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #e8ecef; border-color: #3d444a; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #3d444a;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #3d444a 0%, #a7aeb3 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #dce1e5; }
        .hidden { display: none; }
</style>
</head>
<body>
    <div class="quiz-container" id="quiz-box">
        <h2>🦅 Vulture Science</h2>
        <h1>🧬 Cells, Genetics, and Life</h1>
        <h2 id="question-text" style="color: #333;">Question</h2>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade6-science-topics.html'">Back to Science Topics</button>
    </div>

    <script>
        const quizData = [
            { q: "Which organelle contains enzymes that break down waste materials and cellular debris?", a: "B) Lysosome", options: ["A) Ribosome", "B) Lysosome", "C) Vacuole", "D) Chloroplast"] },
            { q: "What is the specific function of the Nucleolus?", a: "C) Ribosome production", options: ["A) DNA replication", "B) Protein folding", "C) Ribosome production", "D) Waste disposal"] },
            { q: "\"Turgor pressure\" in a plant cell is maintained by which organelle?", a: "B) Large Central Vacuole", options: ["A) Cell Wall", "B) Large Central Vacuole", "C) Mitochondria", "D) Nucleus"] },
            { q: "Which of the following is found in all cells, both prokaryotic and eukaryotic?", a: "C) Ribosomes", options: ["A) Nucleus", "B) Mitochondria", "C) Ribosomes", "D) Endoplasmic Reticulum"] },
            { q: "In a Punnett square, if two heterozygous parents (Bb) are crossed, what is the probability of an offspring being homozygous recessive?", a: "A) 25%", options: ["A) 25%", "B) 50%", "C) 75%", "D) 0%"] },
            { q: "What is the primary role of the Golgi Apparatus?", a: "B) Sorting and packaging proteins", options: ["A) Creating lipids", "B) Sorting and packaging proteins", "C) Controlling cell movement", "D) Cellular respiration"] },
            { q: "Which kingdom consists of multicellular decomposers that have cell walls made of chitin?", a: "C) Fungi", options: ["A) Plantae", "B) Protista", "C) Fungi", "D) Monera"] },
            { q: "What is the structural difference between \"Rough\" ER and \"Smooth\" ER?", a: "A) Rough ER has ribosomes attached", options: ["A) Rough ER has ribosomes attached", "B) Smooth ER contains DNA", "C) Rough ER is found in the nucleus", "D) Smooth ER makes energy"] },
            { q: "According to Cell Theory, which statement is true?", a: "C) All cells come from pre-existing cells", options: ["A) All cells have a nucleus", "B) Cells can spontaneously appear", "C) All cells come from pre-existing cells", "D) Cells are non-living"] },
            { q: "An organism's \"Phenotype\" is determined by:", a: "C) The interaction between genes and environment", options: ["A) Only its genes", "B) Only its environment", "C) The interaction between genes and environment", "D) Its physical speed"] },
            { q: "Which process produces haploid gametes (sperm and egg cells)?", a: "B) Meiosis", options: ["A) Mitosis", "B) Meiosis", "C) Binary Fission", "D) Photosynthesis"] },
            { q: "If a cell is placed in a \"hypertonic\" solution (very salty), what will happen to the cell?", a: "C) It will shrink and shrivel", options: ["A) It will swell and burst", "B) It will stay the same", "C) It will shrink and shrivel", "D) It will divide"] },
            { q: "What molecule carries the genetic \"code\" from the nucleus to the ribosome?", a: "B) mRNA", options: ["A) ATP", "B) mRNA", "C) Glucose", "D) Chlorophyll"] },
            { q: "\"Specialization\" or \"Differentiation\" refers to:", a: "B) Stem cells becoming specific types like heart or skin cells", options: ["A) Cells growing larger", "B) Stem cells becoming specific types like heart or skin cells", "C) Cells dying", "D) DNA mutating"] },
            { q: "What is the main source of genetic variation in sexual reproduction?", a: "B) Recombination/Crossing over during meiosis", options: ["A) Cloning", "B) Recombination/Crossing over during meiosis", "C) Mitosis", "D) Eating different foods"] },
            { q: "Eukaryotic cells are defined by the presence of:", a: "B) Membrane-bound organelles", options: ["A) A cell wall", "B) Membrane-bound organelles", "C) Flagella", "D) RNA"] },
            { q: "The energy currency of the cell is:", a: "C) ATP", options: ["A) Sugar", "B) DNA", "C) ATP", "D) Oxygen"] },
            { q: "Which scientist was the first to observe \"cork\" cells and coin the term \"cell\"?", a: "A) Robert Hooke", options: ["A) Robert Hooke", "B) Antonie van Leeuwenhoek", "C) Louis Pasteur", "D) Charles Darwin"] },
            { q: "A \"codominant\" trait is one where:", a: "C) Both traits are expressed equally (like a spotted cow)", options: ["A) Neither trait shows", "B) One trait completely hides the other", "C) Both traits are expressed equally (like a spotted cow)", "D) The traits blend (like pink flowers)"] },
            { q: "In the Hierarchical Classification system, which level is more specific than \"Class\" but less specific than \"Family\"?", a: "C) Order", options: ["A) Kingdom", "B) Phylum", "C) Order", "D) Genus"] }
        ];
        let currentIdx = 0; let score = 0; let userResults = [];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function ensureTryAgainButton() {
            const summaryBox = document.getElementById("summary-box");
            if (summaryBox && !summaryBox.querySelector('button[onclick="location.reload()"]')) {
                const button = document.createElement('button');
                button.className = 'next-btn';
                button.style.display = 'block';
                button.style.marginTop = '20px';
                button.innerText = 'Try Again';
                button.onclick = function() { location.reload(); };
                const backButton = summaryBox.querySelector('button[onclick^="location.href"]');
                summaryBox.insertBefore(button, backButton || null);
            }
        }

        function initializeQuiz() {
            shuffleArray(quizData);
            loadQuestion();
        }

        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = current.q;
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";
            current.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            btns.forEach(b => b.disabled = true);
            if (selected === current.a) {
                feedback.innerText = "Awesome! Correct.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "Oops! The correct answer was " + current.a;
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) { loadQuestion(); } 
            else { showSummary(); }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            document.getElementById("summary-box").classList.remove("hidden");
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
            userResults.forEach(item => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
            ensureTryAgainButton();
        }
        initializeQuiz();
    </script>
</body>
</html>
