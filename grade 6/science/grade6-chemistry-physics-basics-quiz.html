<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mountain Vulture Science - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f1f3f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #6d757c;
        }
        h2 { font-family: 'Fredoka', cursive; color: #3d444a; }
        .theme-sub { color: #a7aeb3; font-weight: bold; margin-bottom: 1.5rem; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #fafbfc;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #a7aeb3;
            font-weight: 700;
            transition: all 0.2s;
        }
        .topic-link:hover, .choice:hover {
            background: #e8ecef;
            transform: translateY(-2px);
            border-color: #3d444a;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #a7aeb3;
            border-radius: 50px;
            background: white;
            color: #3d444a;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #e8ecef; border-color: #3d444a; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #3d444a;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #3d444a 0%, #a7aeb3 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #dce1e5; }
        .hidden { display: none; }
</style>
</head>
<body>
    <div class="quiz-container" id="quiz-box">
        <h2>🦅 Vulture Science</h2>
        <h1>⚗️ Chemistry and Physics Basics</h1>
        <h2 id="question-text" style="color: #333;">Question</h2>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade6-science-topics.html'">Back to Science Topics</button>
    </div>

    <script>
        const questionPool = [
            { q: "\"Isotopes\" are atoms of the same element that have different numbers of:", a: "C) Neutrons", options: ["A) Protons", "B) Electrons", "C) Neutrons", "D) Shells"] },
            { q: "Which type of bond involves the \"sharing\" of electrons between atoms?", a: "B) Covalent", options: ["A) Ionic", "B) Covalent", "C) Metallic", "D) Magnetic"] },
            { q: "\"Valence Electrons\" are located:", a: "B) In the outermost energy level", options: ["A) In the nucleus", "B) In the outermost energy level", "C) Next to the neutrons", "D) Outside the atom"] },
            { q: "A \"Heterogeneous Mixture\" is one where:", a: "B) You can see the individual parts (like a salad)", options: ["A) The components are perfectly blended", "B) You can see the individual parts (like a salad)", "C) The atoms are chemically bonded", "D) It is a pure substance"] },
            { q: "A substance with a pH of 14 is considered:", a: "C) A strong base", options: ["A) Highly acidic", "B) Neutral", "C) A strong base", "D) Pure water"] },
            { q: "\"Viscosity\" refers to:", a: "A) A liquid's resistance to flow (thickness)", options: ["A) A liquid's resistance to flow (thickness)", "B) How much a gas can expand", "C) The melting point of a solid", "D) The color of a chemical"] },
            { q: "Acceleration is defined as a change in:", a: "C) Velocity (speed or direction) over time", options: ["A) Mass", "B) Position", "C) Velocity (speed or direction) over time", "D) Gravity"] },
            { q: "According to Newton's Second Law, Force equals:", a: "C) Mass times Acceleration", options: ["A) Mass plus Acceleration", "B) Mass divided by Acceleration", "C) Mass times Acceleration", "D) Velocity times Time"] },
            { q: "Which type of energy is stored in the bonds of food or gasoline?", a: "B) Chemical Potential", options: ["A) Thermal", "B) Chemical Potential", "C) Mechanical", "D) Nuclear"] },
            { q: "If an object has a mass of 50g and a volume of 10ml, what is its density?", a: "B) 5 g/ml", options: ["A) 0.2 g/ml", "B) 5 g/ml", "C) 500 g/ml", "D) 60 g/ml"] },
            { q: "An \"Exothermic\" reaction is one that:", a: "B) Releases heat into the surroundings", options: ["A) Absorbs heat", "B) Releases heat into the surroundings", "C) Stays the same temperature", "D) Happens only in the dark"] },
            { q: "\"Terminal Velocity\" is reached when:", a: "B) The force of gravity equals the force of air resistance", options: ["A) An object stops moving", "B) The force of gravity equals the force of air resistance", "C) An object hits the ground", "D) An object leaves the atmosphere"] },
            { q: "In a \"Convection\" current, heat is transferred through:", a: "C) The movement of fluids (liquids or gases)", options: ["A) Direct contact", "B) Electromagnetic waves", "C) The movement of fluids (liquids or gases)", "D) Solid metal rods"] },
            { q: "Which Law states that \"for every action, there is an equal and opposite reaction\"?", a: "C) Newton's 3rd Law", options: ["A) Newton's 1st Law", "B) Newton's 2nd Law", "C) Newton's 3rd Law", "D) Law of Universal Gravitation"] },
            { q: "A \"Polyatomic Ion\" is:", a: "B) A group of atoms that stay together and have an overall charge", options: ["A) A single atom with no charge", "B) A group of atoms that stay together and have an overall charge", "C) A type of battery", "D) A gas"] },
            { q: "\"Malleability\" is the ability of a metal to:", a: "B) Be hammered into thin sheets", options: ["A) Be drawn into a wire", "B) Be hammered into thin sheets", "C) Conduct heat", "D) Reflect light"] },
            { q: "A \"Catalyst\" in a chemical reaction:", a: "B) Increases the speed of the reaction without being used up", options: ["A) Slows it down", "B) Increases the speed of the reaction without being used up", "C) Changes the color", "D) Stops the reaction"] },
            { q: "\"Centripetal Force\" pulls a rotating object:", a: "B) Inward toward the center", options: ["A) Outward", "B) Inward toward the center", "C) Downward", "D) Forward"] },
            { q: "Which simple machine is essentially an \"inclined plane wrapped around a cylinder\"?", a: "C) Screw", options: ["A) Wedge", "B) Lever", "C) Screw", "D) Wheel and Axle"] },
            { q: "In \"Nuclear Fission,\" energy is released by:", a: "B) Splitting a heavy nucleus", options: ["A) Joining two small nuclei", "B) Splitting a heavy nucleus", "C) Burning fuel", "D) Vibrating molecules"] }
        ];
        const quizData = shufflePool(questionPool.slice()).slice(0, 5);
        function shufflePool(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }
        let currentIdx = 0; let score = 0; let userResults = [];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function ensureTryAgainButton() {
            const summaryBox = document.getElementById("summary-box");
            if (summaryBox && !summaryBox.querySelector('button[onclick="location.reload()"]')) {
                const button = document.createElement('button');
                button.className = 'next-btn';
                button.style.display = 'block';
                button.style.marginTop = '20px';
                button.innerText = 'Try Again';
                button.onclick = function() { location.reload(); };
                const backButton = summaryBox.querySelector('button[onclick^="location.href"]');
                summaryBox.insertBefore(button, backButton || null);
            }
        }

        function initializeQuiz() {
            shuffleArray(quizData);
            loadQuestion();
        }

        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = current.q;
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";
            current.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            btns.forEach(b => b.disabled = true);
            if (selected === current.a) {
                feedback.innerText = "Awesome! Correct.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "Oops! The correct answer was " + current.a;
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) { loadQuestion(); } 
            else { showSummary(); }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            document.getElementById("summary-box").classList.remove("hidden");
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
            userResults.forEach(item => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
            ensureTryAgainButton();
        }
        initializeQuiz();
    </script>
</body>
</html>
