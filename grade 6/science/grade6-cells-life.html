<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mountain Vulture Science - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f1f3f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #6d757c;
        }
        h2 { font-family: 'Fredoka', cursive; color: #3d444a; }
        .theme-sub { color: #a7aeb3; font-weight: bold; margin-bottom: 1.5rem; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #fafbfc;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #a7aeb3;
            font-weight: 700;
            transition: all 0.2s;
        }
        .topic-link:hover, .choice:hover {
            background: #e8ecef;
            transform: translateY(-2px);
            border-color: #3d444a;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #a7aeb3;
            border-radius: 50px;
            background: white;
            color: #3d444a;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #e8ecef; border-color: #3d444a; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #3d444a;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #3d444a 0%, #a7aeb3 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #dce1e5; }
        .hidden { display: none; }
</style>
</head>
<body>
    <div class="quiz-container">
        <!-- Replace these placeholders with your own images by changing the content and/or adding local image files. -->
        <div class="image-placeholder">
            Picture placeholder 1
            <span>Shutterstock</span>
        </div>
        <div class="image-placeholder">
            Picture placeholder 2
            <span>Shutterstock</span>
        </div>
        <div id="quiz-box">
            <h2 id="question-text">Question</h2>
            <div class="options-container" id="options"></div>
            <div id="feedback" class="feedback"></div>
            <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
        </div>
        <div class="quiz-container hidden" id="summary-box">
            <h2>Quiz Complete!</h2>
            <div id="results-list"></div>
            <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">Try Again</button>
            <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade6-science-topics.html'">Back to 🦅 Vulture Science Topics</button>
        </div>
    </div>

    <script>
        const questionPool = [
            { q: "Which part of the cell is known as the 'brain' or control center?", a: "Nucleus", options: ["Nucleus", "Mitochondria", "Cell Wall"] },
            { q: "Plants turn sunlight into energy through ___.", a: "Photosynthesis", options: ["Respiration", "Photosynthesis", "Digestion"] },
            { q: "Which kingdom do mushrooms belong to?", a: "Fungi", options: ["Plant", "Animal", "Fungi"] },
            { q: "A group of tissues working together is called an ___.", a: "Organ", options: ["Organ", "Atom", "Ecosystem"] }
        ];
        const quizData = shufflePool(questionPool.slice()).slice(0, 5);
        function shufflePool(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = current.q;
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";
            current.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            btns.forEach(b => b.disabled = true);
            if (selected === current.a) {
                feedback.innerText = "Correct! Great job.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "Oops! The correct answer was " + current.a + ".";
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            document.getElementById("summary-box").classList.remove("hidden");
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
            userResults.forEach(item => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
        }

        loadQuestion();
    </script>
</body>
</html>
