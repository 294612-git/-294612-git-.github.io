<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mountain Bighorn Sheep History - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f7f5f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #a38b76;
        }
        h2 { font-family: 'Fredoka', cursive; color: #6b5b4b; }
        .theme-sub { color: #c7b29f; font-weight: bold; margin-bottom: 1.5rem; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #f9f4ef;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #c7b29f;
            font-weight: 700;
            transition: all 0.2s;
        }
        .topic-link:hover, .choice:hover {
            background: #f2e9df;
            transform: translateY(-2px);
            border-color: #6b5b4b;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #c7b29f;
            border-radius: 50px;
            background: white;
            color: #6b5b4b;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #f2e9df; border-color: #6b5b4b; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #6b5b4b;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #6b5b4b 0%, #c7b29f 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #e6dbcc; }
        .hidden { display: none; }
</style>
</head>
<body>
    <div id="quiz-container">
        <h1>Grade 6 History Quiz: Ancient Civilizations</h1>
        <div id="round-indicator">Round 1 of 2</div>
        <div id="progress-bar">
            <div id="progress"></div>
        </div>
        <div id="question-container">
            <p id="question"></p>
            <div id="options"></div>
        </div>
        <button id="next-btn" onclick="nextQuestion()">Next</button>
    </div>
    <div id="summary" style="display:none;">
        <h2>Quiz Complete!</h2>
        <p id="final-score"></p>
        <p id="round-scores"></p>
        <a href="grade6-history-topics.html">Back to History Topics</a>
    </div>
    <script>
        const allQuestions = [
            [
                {
                    q: "\"Cuneiform\" was primarily used in Mesopotamia for:",
                    options: ["A) Writing poetry", "B) Record-keeping and trade", "C) Religious spells", "D) Personal letters"],
                    a: 1
                },
                {
                    q: "The Nile River flows in which direction?",
                    options: ["A) South to North", "B) North to South", "C) East to West", "D) West to East"],
                    a: 0
                },
                {
                    q: "What is the \"Fertile Crescent\"?",
                    options: ["A) A type of bread", "B) A region of rich farmland in Southwest Asia where the first civilizations began", "C) A phase of the moon", "D) A mountain range in India"],
                    a: 1
                },
                {
                    q: "The \"Rosetta Stone\" was key to modern understanding of:",
                    options: ["A) Cuneiform", "B) Egyptian Hieroglyphics", "C) Chinese characters", "D) The Indus script"],
                    a: 1
                },
                {
                    q: "Which Mesopotamian civilization is credited with creating the first empire by uniting city-states?",
                    options: ["A) Sumerians", "B) Akkadians (led by Sargon)", "C) Babylonians", "D) Assyrians"],
                    a: 1
                },
                {
                    q: "The \"Epic of Gilgamesh\" is significant because it is:",
                    options: ["A) A map of the stars", "B) One of the oldest known works of literature", "C) A book of laws", "D) A medical textbook"],
                    a: 1
                },
                {
                    q: "In Ancient India, the \"Vedas\" are:",
                    options: ["A) Sacred religious texts", "B) Types of food", "C) Coins used for trade", "D) Mountain passes"],
                    a: 0
                },
                {
                    q: "The \"Dynastic Cycle\" in China refers to:",
                    options: ["A) The way the moon moves", "B) The rise, fall, and replacement of ruling families", "C) The farming season", "D) The way silk is made"],
                    a: 1
                },
                {
                    q: "\"Mohenjo-Daro\" and \"Harappa\" were unique for their:",
                    options: ["A) Giant pyramids", "B) Advanced urban planning and drainage systems", "C) Human sacrifices", "D) Lack of any government"],
                    a: 1
                },
                {
                    q: "Which metal was first used extensively in Mesopotamia for tools and weapons, marking the end of the Stone Age?",
                    options: ["A) Iron", "B) Steel", "C) Bronze", "D) Gold"],
                    a: 2
                }
            ],
            [
                {
                    q: "\"Theocracy\" is a form of government where:",
                    options: ["A) The people vote", "B) The ruler is seen as a god or ruled by religious law", "C) Only the wealthy rule", "D) There is no leader"],
                    a: 1
                },
                {
                    q: "The \"Legalism\" philosophy in China believed that:",
                    options: ["A) People are naturally good", "B) People are naturally selfish and need strict laws and harsh punishments", "C) Everyone should live in nature", "D) Education is the most important thing"],
                    a: 1
                },
                {
                    q: "Which civilization developed the first 365-day calendar based on the flooding of a river?",
                    options: ["A) China", "B) India", "C) Egypt", "D) Mesopotamia"],
                    a: 2
                },
                {
                    q: "The \"Hanging Gardens\" were a wonder of which ancient city?",
                    options: ["A) Memphis", "B) Babylon", "C) Ur", "D) Anyang"],
                    a: 1
                },
                {
                    q: "\"Sanskrit\" was the primary classical language of:",
                    options: ["A) China", "B) Egypt", "C) Ancient India", "D) Sumer"],
                    a: 2
                },
                {
                    q: "\"Nebuchadnezzar II\" is associated with the revival of which empire?",
                    options: ["A) Neo-Babylonian", "B) Persian", "C) Old Kingdom Egypt", "D) Shang China"],
                    a: 0
                },
                {
                    q: "What was the primary purpose of \"Oracle Bones\" in the Shang Dynasty?",
                    options: ["A) To build houses", "B) For divination/predicting the future", "C) As money", "D) For cooking"],
                    a: 1
                },
                {
                    q: "\"Artisans\" in ancient societies were:",
                    options: ["A) Farmers", "B) Skilled workers who made goods by hand (pottery, cloth, etc.)", "C) Soldiers", "D) Priests"],
                    a: 1
                },
                {
                    q: "Which geographical feature isolated Ancient China from the rest of the world?",
                    options: ["A) The Nile River", "B) The Himalayan Mountains and Gobi Desert", "C) The Mediterranean Sea", "D) The Tigris River"],
                    a: 1
                },
                {
                    q: "The \"Vizier\" in Ancient Egypt was:",
                    options: ["A) The Pharaoh's chief advisor/minister", "B) A type of pyramid", "C) A soldier", "D) A god"],
                    a: 0
                }
            ]
        ];

        const questionPool = allQuestions.flat();
        let quizData = [];
        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function shufflePool(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initializeQuiz() {
            quizData = shufflePool(questionPool.slice()).slice(0, 5);
            currentIdx = 0;
            score = 0;
            userResults = [];
            document.getElementById('quiz-container').style.display = 'block';
            document.getElementById('summary').style.display = 'none';
            loadQuestion();
        }

        function loadQuestion() {
            const q = quizData[currentIdx];
            document.getElementById('round-indicator').textContent = `Question ${currentIdx + 1} of ${quizData.length}`;
            document.getElementById('question').textContent = q.q;
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(i);
                optionsDiv.appendChild(btn);
            });
            updateProgress();
            document.getElementById('next-btn').style.display = 'none';
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const correct = current.a;
            const buttons = document.querySelectorAll('#options button');
            buttons.forEach(btn => btn.disabled = true);
            if (selected === correct) {
                buttons[selected].classList.add('correct');
                score++;
                userResults.push({ q: current.q, res: 'Correct', class: 'correct' });
            } else {
                buttons[selected].classList.add('wrong');
                buttons[correct].classList.add('correct');
                userResults.push({ q: current.q, res: `Wrong (Answer: ${current.options[correct]})`, class: 'wrong' });
            }
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function updateProgress() {
            const percent = ((currentIdx + 1) / quizData.length) * 100;
            document.getElementById('progress').style.width = `${percent}%`;
        }

        function showSummary() {
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('summary').style.display = 'block';
            document.getElementById('final-score').textContent = `Final Score: ${score} out of ${quizData.length}`;
            document.getElementById('round-scores').textContent = '';
        }

        initializeQuiz();
    </script>
