<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mountain Bighorn Sheep History - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f7f5f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #a38b76;
        }
        h2 { font-family: 'Fredoka', cursive; color: #6b5b4b; }
        .theme-sub { color: #c7b29f; font-weight: bold; margin-bottom: 1.5rem; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #f9f4ef;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #c7b29f;
            font-weight: 700;
            transition: all 0.2s;
        }
        .topic-link:hover, .choice:hover {
            background: #f2e9df;
            transform: translateY(-2px);
            border-color: #6b5b4b;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #c7b29f;
            border-radius: 50px;
            background: white;
            color: #6b5b4b;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #f2e9df; border-color: #6b5b4b; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #6b5b4b;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #6b5b4b 0%, #c7b29f 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #e6dbcc; }
        .hidden { display: none; }
</style>
</head>
<body>
    <div id="quiz-container">
        <h1>Grade 6 History Quiz: Ancient Greece and Rome</h1>
        <div id="round-indicator">Round 1 of 2</div>
        <div id="progress-bar">
            <div id="progress"></div>
        </div>
        <div id="question-container">
            <p id="question"></p>
            <div id="options"></div>
        </div>
        <button id="next-btn" onclick="nextQuestion()">Next</button>
    </div>
    <div id="summary" style="display:none;">
        <h2>Quiz Complete!</h2>
        <p id="final-score"></p>
        <p id="round-scores"></p>
        <a href="grade6-history-topics.html">Back to History Topics</a>
    </div>
    <script>
        const allQuestions = [
            [
                {
                    q: "\"Ostracism\" in ancient Athens was a process used to:",
                    options: ["A) Vote for a new king", "B) Banish a citizen who was seen as a threat to democracy", "C) Choose a general", "D) Celebrate a harvest"],
                    a: 1
                },
                {
                    q: "The \"Peloponnesian War\" was fought between:",
                    options: ["A) Greece and Persia", "B) Athens and Sparta", "C) Rome and Carthage", "D) Troy and Greece"],
                    a: 1
                },
                {
                    q: "A \"Direct Democracy\" differs from a \"Republic\" because:",
                    options: ["A) Only one person rules", "B) Citizens vote on all laws directly rather than electing representatives", "C) It uses a king", "D) It is only for soldiers"],
                    a: 1
                },
                {
                    q: "The \"Twelve Tables\" of Rome were important because they:",
                    options: ["A) Were made of gold", "B) Established the principle that all free citizens had a right to protection under the law", "C) Listed the Roman gods", "D) Described how to build roads"],
                    a: 1
                },
                {
                    q: "\"Punic Wars\" were fought between Rome and Carthage over control of:",
                    options: ["A) The Nile River", "B) The Mediterranean Sea trade", "C) The Alps", "D) Britain"],
                    a: 1
                },
                {
                    q: "In Roman society, \"Plebeians\" were:",
                    options: ["A) The wealthy landowning noble class", "B) The common farmers, artisans, and merchants", "C) The elected leaders", "D) The slaves"],
                    a: 1
                },
                {
                    q: "The \"Phalanx\" was a:",
                    options: ["A) Type of government", "B) Military formation of foot soldiers armed with spears and shields", "C) Greek temple", "D) Roman marketplace"],
                    a: 1
                },
                {
                    q: "\"Bread and Circuses\" refers to the Roman government's policy of:",
                    options: ["A) Providing free food and entertainment to keep the poor from rioting", "B) Teaching everyone how to bake", "C) Building more churches", "D) Ending slavery"],
                    a: 0
                },
                {
                    q: "Which Greek city-state was an \"Oligarchy\" focused entirely on military training?",
                    options: ["A) Athens", "B) Corinth", "C) Sparta", "D) Thebes"],
                    a: 2
                },
                {
                    q: "The \"Edict of Milan\" was significant because it:",
                    options: ["A) Ended the Roman Empire", "B) Proclaimed religious toleration for Christianity in the Roman Empire", "C) Taxed all citizens", "D) Declared war on Persia"],
                    a: 1
                }
            ],
            [
                {
                    q: "\"Socratic Method\" involves:",
                    options: ["A) Giving long lectures", "B) Teaching through a series of questions and answers to encourage critical thinking", "C) Writing books", "D) Using magic"],
                    a: 1
                },
                {
                    q: "The \"Tribune\" in Rome was an official elected to protect the rights of:",
                    options: ["A) The Patricians", "B) The Plebeians", "C) The Emperor", "D) The Army"],
                    a: 1
                },
                {
                    q: "\"Hannibal\" is famous for:",
                    options: ["A) Building the Colosseum", "B) Crossing the Alps with elephants to attack Rome", "C) Discovering America", "D) Writing Greek plays"],
                    a: 1
                },
                {
                    q: "\"Stoicism\" was a Roman philosophy that emphasized:",
                    options: ["A) Seeking as much pleasure as possible", "B) Duty, endurance, and self-control", "C) Living in a cave", "D) Having no rules"],
                    a: 1
                },
                {
                    q: "Which battle saw 300 Spartans hold off a massive Persian army?",
                    options: ["A) Battle of Marathon", "B) Battle of Thermopylae", "C) Battle of Salamis", "D) Battle of Actium"],
                    a: 1
                },
                {
                    q: "The \"Senate\" in the Roman Republic was primarily composed of:",
                    options: ["A) Plebeians", "B) Patricians", "C) Soldiers", "D) Foreigners"],
                    a: 1
                },
                {
                    q: "\"Homer\" is the legendary author of which two epics?",
                    options: ["A) The Republic and The Laws", "B) The Iliad and The Odyssey", "C) The Aeneid", "D) The Bible"],
                    a: 1
                },
                {
                    q: "\"Constantinople\" became the capital of:",
                    options: ["A) The Western Roman Empire", "B) The Eastern Roman (Byzantine) Empire", "C) Ancient Greece", "D) Carthage"],
                    a: 1
                },
                {
                    q: "Which building is considered the greatest example of Roman engineering, featuring a massive dome and an oculus?",
                    options: ["A) The Parthenon", "B) The Pantheon", "C) The Colosseum", "D) The Circus Maximus"],
                    a: 1
                },
                {
                    q: "The \"Appian Way\" was a famous Roman:",
                    options: ["A) Law", "B) Road", "C) Temple", "D) Ship"],
                    a: 1
                }
            ]
        ];

        const questionPool = allQuestions.flat();
        let quizData = [];
        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function shufflePool(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initializeQuiz() {
            quizData = shufflePool(questionPool.slice()).slice(0, 5);
            currentIdx = 0;
            score = 0;
            userResults = [];
            document.getElementById('quiz-container').style.display = 'block';
            document.getElementById('summary').style.display = 'none';
            loadQuestion();
        }

        function loadQuestion() {
            const q = quizData[currentIdx];
            document.getElementById('round-indicator').textContent = `Question ${currentIdx + 1} of ${quizData.length}`;
            document.getElementById('question').textContent = q.q;
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(i);
                optionsDiv.appendChild(btn);
            });
            updateProgress();
            document.getElementById('next-btn').style.display = 'none';
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const correct = current.a;
            const buttons = document.querySelectorAll('#options button');
            buttons.forEach(btn => btn.disabled = true);
            if (selected === correct) {
                buttons[selected].classList.add('correct');
                score++;
                userResults.push({ q: current.q, res: 'Correct', class: 'correct' });
            } else {
                buttons[selected].classList.add('wrong');
                buttons[correct].classList.add('correct');
                userResults.push({ q: current.q, res: `Wrong (Answer: ${current.options[correct]})`, class: 'wrong' });
            }
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function updateProgress() {
            const percent = ((currentIdx + 1) / quizData.length) * 100;
            document.getElementById('progress').style.width = `${percent}%`;
        }

        function showSummary() {
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('summary').style.display = 'block';
            document.getElementById('final-score').textContent = `Final Score: ${score} out of ${quizData.length}`;
            document.getElementById('round-scores').textContent = '';
        }

        initializeQuiz();
    </script>
