<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Strategies Quiz - Study Buddy</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .quiz-container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 500px; text-align: center; }
        h2 { color: #667eea; }
        .options-container { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
        .option-btn { padding: 12px; border: 2px solid #ddd; border-radius: 8px; background: white; cursor: pointer; font-size: 1.1rem; transition: 0.2s; }
        .option-btn:hover { border-color: #667eea; background: #f0f2ff; }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #28a745; }
        .wrong { color: #dc3545; }
        .next-btn { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; display: none; margin: 0 auto; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <h2 id="question-text">Question</h2>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">Try Again</button>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade2-reading-topics.html'">Back to Topics</button>
    </div>

    <script>
        const quizData = [
            { q: "The 'Main Idea' of a story is...", a: "What the story is mostly about", options: ["The names of all the characters", "What the story is mostly about", "The very last sentence"] },
            { q: "Where and when a story takes place is called the...", a: "Setting", options: ["Plot", "Setting", "Theme"] },
            { q: "If you 'predict' what happens next, you are...", a: "Making a smart guess", options: ["Telling a secret", "Making a smart guess", "Reading the end first"] },
            { q: "The people or animals in a story are called...", a: "Characters", options: ["Characters", "Authors", "Illustrators"] },
            { q: "Which part of a story usually has the 'problem'?", a: "Middle", options: ["Beginning", "Middle", "Ending"] },
            { q: "When you use clues to figure out something the author didn't say, you...", a: "Infer", options: ["Retell", "Infer", "Scan"] },
            { q: "The person who writes the book is the...", a: "Author", options: ["Illustrator", "Author", "Publisher"] },
            { q: "What is a 'Retell'?", a: "Telling the story in your own words", options: ["Telling the story in your own words", "Making up a new story", "Reading the same book twice"] },
            { q: "In a story, the 'Solution' is...", a: "How the problem is fixed", options: ["How the problem is fixed", "The name of the cat", "The pictures in the book"] },
            { q: "Non-fiction books are...", a: "Books with real facts", options: ["Made up stories", "Books with real facts", "Books that only have poems"] },
            { q: "A 'Caption' in a book is...", a: "Words near a picture that explain it", options: ["The title on the cover", "Words near a picture that explain it", "The list of chapters"] },
            { q: "Which strategy helps you understand a hard word?", a: "Looking at the pictures for clues", options: ["Looking at the pictures for clues", "Closing your eyes", "Skipping the whole page"] },
            { q: "What is the 'Table of Contents' used for?", a: "To find where chapters start", options: ["To see who wrote the book", "To find where chapters start", "To see the glossary"] },
            { q: "If a character is crying, we can infer they are...", a: "Sad", options: ["Happy", "Sad", "Hungry"] },
            { q: "What is a 'Lesson' or 'Moral' of a story?", a: "Something the character learned", options: ["The time it took to read", "Something the character learned", "The number of pages"] },
            { q: "Why do authors use bold words?", a: "To show they are important", options: ["To make them look pretty", "To show they are important", "By accident"] },
            { q: "A 'Summary' should be...", a: "Short and include the main parts", options: ["Short and include the main parts", "Very long and include every word", "Just the title"] },
            { q: "Characters' 'Traits' are...", a: "How they look and act", options: ["Their names", "How they look and act", "Their favorite food"] },
            { q: "Comparing two things means...", a: "Finding how they are different", options: ["Finding how they are different", "Finding how they are the same", "Counting them"] },
            { q: "Contrasting two things means...", a: "Finding how they are different", options: ["Finding how they are different", "Finding how they are the same", "Ignoring them"] }
        ];

        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function ensureTryAgainButton() {
            const summaryBox = document.getElementById("summary-box");
            if (summaryBox && !summaryBox.querySelector('button[onclick="location.reload()"]')) {
                const button = document.createElement('button');
                button.className = 'next-btn';
                button.style.display = 'block';
                button.style.marginTop = '20px';
                button.innerText = 'Try Again';
                button.onclick = function() { location.reload(); };
                const backButton = summaryBox.querySelector('button[onclick^="location.href"]');
                summaryBox.insertBefore(button, backButton || null);
            }
        }

        function initializeQuiz() {
            shuffleArray(quizData);
            loadQuestion();
        }

        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = current.q;
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";

            current.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            
            // Disable buttons after answer
            btns.forEach(b => b.disabled = true);

            if (selected === current.a) {
                feedback.innerText = "Correct! Well done.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "Oops! The correct answer was " + current.a;
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            const summaryBox = document.getElementById("summary-box");
            summaryBox.classList.remove("hidden");
            ensureTryAgainButton();
            
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
            
            userResults.forEach(item => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
        }

        // Start the quiz
        initializeQuiz();
    </script>
</body>
</html>
