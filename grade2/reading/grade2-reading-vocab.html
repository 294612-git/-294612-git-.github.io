<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainforest Capybara Reading - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fff4e1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #d18f4f;
        }
        h2 { font-family: 'Fredoka', cursive; color: #a55f2e; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice, .option-btn, .back-link {
            transition: all 0.2s;
        }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #fff7ed;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #f6c58f;
            font-weight: 700;
        }
        .topic-link:hover, .choice:hover {
            background: #ffefd8;
            transform: translateY(-2px);
            border-color: #a55f2e;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #f6c58f;
            border-radius: 50px;
            background: white;
            color: #a55f2e;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #ffefd8; border-color: #a55f2e; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #8a4a1f;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #a55f2e 0%, #f6c58f 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #ffe5c4; }
        .hidden { display: none; }
</style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <h2>🦫 Capybara Reading</h2>
        <h2 id="question-text">Question</h2>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">Try Again</button>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade2-reading-topics.html'">Back to Capybara Reading Topics</button>
    </div>

    <script>
        const quizData = [
            { q: "A synonym for 'happy' is...", a: "Glad", options: ["Sad", "Glad", "Angry"] },
            { q: "An antonym for 'hot' is...", a: "Cold", options: ["Warm", "Cold", "Burning"] },
            { q: "What does the prefix 'un-' mean (like in 'unhappy')?", a: "Not", options: ["Very", "Not", "Again"] },
            { q: "What does the prefix 're-' mean (like in 'retell')?", a: "Again", options: ["Before", "Again", "Not"] },
            { q: "Which word is a 'homophone' for 'sea'?", a: "See", options: ["Blue", "See", "Ocean"] },
            { q: "A 'Glossary' is found...", a: "At the back of a book to define words", options: ["On the cover", "At the back of a book to define words", "In the middle of a sentence"] },
            { q: "What does 'enormous' mean?", a: "Very big", options: ["Very small", "Very big", "Very loud"] },
            { q: "Which suffix means 'full of' (like in 'joyful')?", a: "-ful", options: ["-less", "-ful", "-ed"] },
            { q: "Which word is a synonym for 'small'?", a: "Tiny", options: ["Tiny", "Huge", "Wide"] },
            { q: "The word 'bat' can mean an animal or sports equipment. This is a...", a: "Multiple-meaning word", options: ["Multiple-meaning word", "Rhyming word", "Long word"] },
            { q: "What does 'scared' mean?", a: "Afraid", options: ["Brave", "Afraid", "Silly"] },
            { q: "Which word is an antonym for 'fast'?", a: "Slow", options: ["Quick", "Slow", "Speedy"] },
            { q: "What does the suffix '-less' mean (like in 'fearless')?", a: "Without", options: ["Without", "Full of", "More"] },
            { q: "A synonym for 'shout' is...", a: "Yell", options: ["Whisper", "Yell", "Think"] },
            { q: "What is a 'Context Clue'?", a: "A hint in the sentence to help find a word's meaning", options: ["A hint in the sentence to help find a word's meaning", "A red crayon", "The author's name"] },
            { q: "Which word means 'to look at closely'?", a: "Examine", options: ["Ignore", "Examine", "Sleep"] },
            { q: "An antonym for 'quiet' is...", a: "Noisy", options: ["Silent", "Noisy", "Soft"] },
            { q: "What does 'ancient' mean?", a: "Very old", options: ["Brand new", "Very old", "Shiny"] },
            { q: "Which word means a 'place where books are kept'?", a: "Library", options: ["Kitchen", "Library", "Park"] },
            { q: "If you are 'exhausted,' you are...", a: "Very tired", options: ["Very tired", "Very excited", "Very tall"] }
        ];

        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function ensureTryAgainButton() {
            const summaryBox = document.getElementById("summary-box");
            if (summaryBox && !summaryBox.querySelector('button[onclick="location.reload()"]')) {
                const button = document.createElement('button');
                button.className = 'next-btn';
                button.style.display = 'block';
                button.style.marginTop = '20px';
                button.innerText = 'Try Again';
                button.onclick = function() { location.reload(); };
                const backButton = summaryBox.querySelector('button[onclick^="location.href"]');
                summaryBox.insertBefore(button, backButton || null);
            }
        }

        function initializeQuiz() {
            shuffleArray(quizData);
            loadQuestion();
        }

        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = current.q;
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";

            current.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            
            // Disable buttons after answer
            btns.forEach(b => b.disabled = true);

            if (selected === current.a) {
                feedback.innerText = "Correct! Well done.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "Oops! The correct answer was " + current.a;
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            const summaryBox = document.getElementById("summary-box");
            summaryBox.classList.remove("hidden");
            ensureTryAgainButton();
            
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
            
            userResults.forEach(item => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
        }

        // Start the quiz
        initializeQuiz();
    </script>
</body>
</html>
