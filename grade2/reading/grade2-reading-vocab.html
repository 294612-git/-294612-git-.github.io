<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary Quiz - Study Buddy</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .quiz-container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 500px; text-align: center; }
        h2 { color: #667eea; }
        .options-container { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
        .option-btn { padding: 12px; border: 2px solid #ddd; border-radius: 8px; background: white; cursor: pointer; font-size: 1.1rem; transition: 0.2s; }
        .option-btn:hover { border-color: #667eea; background: #f0f2ff; }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #28a745; }
        .wrong { color: #dc3545; }
        .next-btn { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; display: none; margin: 0 auto; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <h2 id="question-text">Question</h2>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">Try Again</button>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade2-reading-topics.html'">Back to Topics</button>
    </div>

    <script>
        const quizData = [
            { q: "A synonym for 'happy' is...", a: "Glad", options: ["Sad", "Glad", "Angry"] },
            { q: "An antonym for 'hot' is...", a: "Cold", options: ["Warm", "Cold", "Burning"] },
            { q: "What does the prefix 'un-' mean (like in 'unhappy')?", a: "Not", options: ["Very", "Not", "Again"] },
            { q: "What does the prefix 're-' mean (like in 'retell')?", a: "Again", options: ["Before", "Again", "Not"] },
            { q: "Which word is a 'homophone' for 'sea'?", a: "See", options: ["Blue", "See", "Ocean"] },
            { q: "A 'Glossary' is found...", a: "At the back of a book to define words", options: ["On the cover", "At the back of a book to define words", "In the middle of a sentence"] },
            { q: "What does 'enormous' mean?", a: "Very big", options: ["Very small", "Very big", "Very loud"] },
            { q: "Which suffix means 'full of' (like in 'joyful')?", a: "-ful", options: ["-less", "-ful", "-ed"] },
            { q: "Which word is a synonym for 'small'?", a: "Tiny", options: ["Tiny", "Huge", "Wide"] },
            { q: "The word 'bat' can mean an animal or sports equipment. This is a...", a: "Multiple-meaning word", options: ["Multiple-meaning word", "Rhyming word", "Long word"] },
            { q: "What does 'scared' mean?", a: "Afraid", options: ["Brave", "Afraid", "Silly"] },
            { q: "Which word is an antonym for 'fast'?", a: "Slow", options: ["Quick", "Slow", "Speedy"] },
            { q: "What does the suffix '-less' mean (like in 'fearless')?", a: "Without", options: ["Without", "Full of", "More"] },
            { q: "A synonym for 'shout' is...", a: "Yell", options: ["Whisper", "Yell", "Think"] },
            { q: "What is a 'Context Clue'?", a: "A hint in the sentence to help find a word's meaning", options: ["A hint in the sentence to help find a word's meaning", "A red crayon", "The author's name"] },
            { q: "Which word means 'to look at closely'?", a: "Examine", options: ["Ignore", "Examine", "Sleep"] },
            { q: "An antonym for 'quiet' is...", a: "Noisy", options: ["Silent", "Noisy", "Soft"] },
            { q: "What does 'ancient' mean?", a: "Very old", options: ["Brand new", "Very old", "Shiny"] },
            { q: "Which word means a 'place where books are kept'?", a: "Library", options: ["Kitchen", "Library", "Park"] },
            { q: "If you are 'exhausted,' you are...", a: "Very tired", options: ["Very tired", "Very excited", "Very tall"] }
        ];

        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function ensureTryAgainButton() {
            const summaryBox = document.getElementById("summary-box");
            if (summaryBox && !summaryBox.querySelector('button[onclick="location.reload()"]')) {
                const button = document.createElement('button');
                button.className = 'next-btn';
                button.style.display = 'block';
                button.style.marginTop = '20px';
                button.innerText = 'Try Again';
                button.onclick = function() { location.reload(); };
                const backButton = summaryBox.querySelector('button[onclick^="location.href"]');
                summaryBox.insertBefore(button, backButton || null);
            }
        }

        function initializeQuiz() {
            shuffleArray(quizData);
            loadQuestion();
        }

        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = current.q;
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";

            current.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            
            // Disable buttons after answer
            btns.forEach(b => b.disabled = true);

            if (selected === current.a) {
                feedback.innerText = "Correct! Well done.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "Oops! The correct answer was " + current.a;
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            const summaryBox = document.getElementById("summary-box");
            summaryBox.classList.remove("hidden");
            ensureTryAgainButton();
            
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
            
            userResults.forEach(item => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
        }

        // Start the quiz
        initializeQuiz();
    </script>
</body>
</html>
