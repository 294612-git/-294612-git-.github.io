<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Economics Quiz - Study Buddy</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .quiz-container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 500px; text-align: center; }
        h2 { color: #667eea; }
        .options-container { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
        .option-btn { padding: 12px; border: 2px solid #ddd; border-radius: 8px; background: white; cursor: pointer; font-size: 1.1rem; transition: 0.2s; }
        .option-btn:hover { border-color: #667eea; background: #f0f2ff; }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #28a745; }
        .wrong { color: #dc3545; }
        .next-btn { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; display: none; margin: 0 auto; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <h2 id="question-text">Question</h2>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">Try Again</button>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade2-history-topics.html'">Back to Topics</button>
    </div>

    <script>
        const questionPool = [
            { q: "Things that people make or grow to sell are called...", a: "Goods", options: ["Services", "Goods", "Wants"] },
            { q: "Work that someone does for someone else is called a...", a: "Service", options: ["Good", "Service", "Natural Resource"] },
            { q: "Which of these is a 'Need'?", a: "Food", options: ["Video games", "Food", "Candy"] },
            { q: "Which of these is a 'Want'?", a: "A new toy", options: ["Clean water", "A new toy", "A warm coat"] },
            { q: "Someone who buys goods or services is a...", a: "Consumer", options: ["Consumer", "Producer", "Banker"] },
            { q: "Someone who makes or grows goods is a...", a: "Producer", options: ["Consumer", "Producer", "Customer"] },
            { q: "When there is not enough of something that people want, it is called...", a: "Scarcity", options: ["Scarcity", "Abundance", "Trade"] },
            { q: "Exchanging one thing for another without using money is called...", a: "Bartering (Trading)", options: ["Buying", "Bartering (Trading)", "Saving"] },
            { q: "What is money that people earn for doing work?", a: "Income", options: ["Income", "Spending", "Taxes"] },
            { q: "A bank is a safe place to ___ your money.", a: "Save", options: ["Throw away", "Save", "Hide"] },
            { q: "Which of these is a 'Service'?", a: "A haircut", options: ["A loaf of bread", "A haircut", "A pair of shoes"] },
            { q: "Which of these is a 'Good'?", a: "A bicycle", options: ["Teaching a lesson", "A bicycle", "Cleaning a house"] },
            { q: "What is a 'Natural Resource'?", a: "Something found in nature that people use", options: ["Something made in a factory", "Something found in nature that people use", "A type of money"] },
            { q: "Which of these is a natural resource?", a: "Trees", options: ["Plastic", "Trees", "Computers"] },
            { q: "To choose between two things because you can't have both is a...", a: "Trade-off", options: ["Trade-off", "Gift", "Service"] },
            { q: "A plan for how to spend and save money is a...", a: "Budget", options: ["Receipt", "Budget", "Map"] },
            { q: "Which job provides a service?", a: "Firefighter", options: ["Farmer", "Toymaker", "Firefighter"] },
            { q: "If many people want a toy but there are only a few left, the price usually...", a: "Goes up", options: ["Goes up", "Goes down", "Stays the same"] },
            { q: "What do we call the tools and buildings used to make goods?", a: "Capital Resources", options: ["Human Resources", "Capital Resources", "Natural Resources"] },
            { q: "A person who works is called a...", a: "Human Resource", options: ["Natural Resource", "Human Resource", "Good"] }
        ];
        const quizData = shuffleArray(questionPool.slice()).slice(0, 5);

        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function initializeQuiz() {
            loadQuestion();
        }

        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = current.q;
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";

            current.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            
            // Disable buttons after answer
            btns.forEach(b => b.disabled = true);

            if (selected === current.a) {
                feedback.innerText = "Correct! Well done.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "Oops! The correct answer was " + current.a;
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            const summaryBox = document.getElementById("summary-box");
            summaryBox.classList.remove("hidden");
            
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
            
            userResults.forEach(item => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
        }

        // Start the quiz
        initializeQuiz();
    </script>
</body>
</html>
