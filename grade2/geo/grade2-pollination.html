<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainforest Dart Frog Science - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #e3f7f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #0f6f63;
        }
        h2 { font-family: 'Fredoka', cursive; color: #0d4d4b; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice, .option-btn, .back-link {
            transition: all 0.2s;
        }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #f0fffd;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #4db6ac;
            font-weight: 700;
        }
        .topic-link:hover, .choice:hover {
            background: #c7f1ec;
            transform: translateY(-2px);
            border-color: #0d4d4b;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #4db6ac;
            border-radius: 50px;
            background: white;
            color: #0d4d4b;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #c7f1ec; border-color: #0d4d4b; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #0d4d4b;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #0d4d4b 0%, #4db6ac 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #b2dfdb; }
        .hidden { display: none; }
</style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <h2>🐸 Dart Frog Science</h2>
        <h2 id="question-text">Question</h2>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">Try Again</button>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='../science/grade2-science-topics.html'">Back to Dart Frog Science Topics</button>
    </div>

    <script>
        const questionPool = [
            { q: "What is pollination?", a: "Moving pollen to help plants make seeds", options: ["Moving pollen to help plants make seeds", "Planting seeds in the dirt", "Watering a flower"] },
            { q: "What is the yellow powder inside a flower called?", a: "Pollen", options: ["Dust", "Pollen", "Flour"] },
            { q: "Which of these is a common pollinator?", a: "A bee", options: ["A bee", "A spider", "A worm"] },
            { q: "Why do bees visit flowers?", a: "To drink nectar (sweet juice)", options: ["To take a nap", "To drink nectar (sweet juice)", "To hide from the sun"] },
            { q: "What sticks to a bee's fuzzy body when it visits a flower?", a: "Pollen", options: ["Dirt", "Pollen", "Leaves"] },
            { q: "Which of these can move pollen besides animals?", a: "The wind", options: ["The wind", "Rocks", "Moonlight"] },
            { q: "What part of the flower makes the pollen?", a: "The stamen", options: ["The petals", "The stamen", "The roots"] },
            { q: "Where must the pollen land for a seed to grow?", a: "On the pistil", options: ["On the leaves", "On the pistil", "In the grass"] },
            { q: "Why are flowers bright and colorful?", a: "To attract pollinators", options: ["To stay warm", "To attract pollinators", "To look like the sun"] },
            { q: "Which bird is a famous pollinator?", a: "Hummingbird", options: ["Penguin", "Hummingbird", "Owl"] },
            { q: "Do butterflies help with pollination?", a: "Yes", options: ["Yes", "No"] },
            { q: "What grows after a flower is pollinated?", a: "A seed or fruit", options: ["A new stem", "A seed or fruit", "A rock"] },
            { q: "Some flowers smell like stinky meat to attract...", a: "Flies", options: ["Bees", "Flies", "Butterflies"] },
            { q: "Which animal pollinates at night?", a: "A bat", options: ["A bat", "A squirrel", "A blue jay"] },
            { q: "What is nectar?", a: "A sugary liquid flowers make", options: ["A type of pollen", "A sugary liquid flowers make", "A part of a leaf"] },
            { q: "Can water help pollinate some plants?", a: "Yes", options: ["Yes", "No"] },
            { q: "What happens if there are no pollinators?", a: "Many plants cannot make seeds or fruit", options: ["Plants grow more flowers", "Many plants cannot make seeds or fruit", "The sun stops shining"] },
            { q: "Pollen is usually...", a: "Sticky or dusty", options: ["Sticky or dusty", "Wet and heavy", "Made of metal"] },
            { q: "Where do bees carry extra pollen?", a: "In 'pockets' on their legs", options: ["In their mouths", "In 'pockets' on their legs", "In their wings"] },
            { q: "Is a dog a common pollinator?", a: "No, usually insects, birds, and bats are", options: ["No, usually insects, birds, and bats are", "Yes, always"] }
        ];
        const quizData = shufflePool(questionPool.slice()).slice(0, 5);
        function shufflePool(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function ensureTryAgainButton() {
            const summaryBox = document.getElementById("summary-box");
            if (summaryBox && !summaryBox.querySelector('button[onclick="location.reload()"]')) {
                const button = document.createElement('button');
                button.className = 'next-btn';
                button.style.display = 'block';
                button.style.marginTop = '20px';
                button.innerText = 'Try Again';
                button.onclick = function() { location.reload(); };
                const backButton = summaryBox.querySelector('button[onclick^="location.href"]');
                summaryBox.insertBefore(button, backButton || null);
            }
        }

        function initializeQuiz() {
            shuffleArray(quizData);
            loadQuestion();
        }

        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = current.q;
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";

            current.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            
            // Disable buttons after answer
            btns.forEach(b => b.disabled = true);

            if (selected === current.a) {
                feedback.innerText = "Correct! Well done.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "Oops! The correct answer was " + current.a;
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            const summaryBox = document.getElementById("summary-box");
            summaryBox.classList.remove("hidden");
            ensureTryAgainButton();
            
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
            
            userResults.forEach(item => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
        }

        // Start the quiz
        initializeQuiz();
    </script>
</body>
</html>
