<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainforest Macaw Geo/History - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f7f3e8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #c84b1b;
        }
        h2 { font-family: 'Fredoka', cursive; color: #b02e1d; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice, .option-btn, .back-link {
            transition: all 0.2s;
        }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #fff6eb;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #ffb74d;
            font-weight: 700;
        }
        .topic-link:hover, .choice:hover {
            background: #ffe8d2;
            transform: translateY(-2px);
            border-color: #b02e1d;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #ffb74d;
            border-radius: 50px;
            background: white;
            color: #b02e1d;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #ffe8d2; border-color: #b02e1d; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #b02e1d;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #b02e1d 0%, #ffb74d 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #ffe0b2; }
        .hidden { display: none; }
</style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <h2>🦜 Macaw Geography/History</h2>
        <h2 id="question-text">Question</h2>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">Try Again</button>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='../grade2-history-topics.html'">Back to Macaw History/Geo Topics</button>
    </div>

    <script>
        const quizData = [
            { q: "What is a giant area of land on Earth called?", a: "Continent", options: ["Ocean", "Continent", "Island"] },
            { q: "How many continents are there on Earth?", a: "7", options: ["5", "7", "10"] },
            { q: "Which is the largest body of salt water on Earth?", a: "Ocean", options: ["Lake", "River", "Ocean"] },
            { q: "What do we call a landform that is very high with steep sides and a peak?", a: "Mountain", options: ["Mountain", "Valley", "Plain"] },
            { q: "What is the low land found between mountains or hills?", a: "Valley", options: ["Plateau", "Valley", "Island"] },
            { q: "A piece of land completely surrounded by water is a/an...", a: "Island", options: ["Peninsula", "Continent", "Island"] },
            { q: "What is a large, flat area of land with very few trees?", a: "Plain", options: ["Plain", "Hill", "Mountain"] },
            { q: "Which landform is surrounded by water on only three sides?", a: "Peninsula", options: ["Island", "Peninsula", "Valley"] },
            { q: "What is a very dry area of land with little rain?", a: "Desert", options: ["Rainforest", "Desert", "Swamp"] },
            { q: "A large body of water surrounded by land on all sides is a...", a: "Lake", options: ["Lake", "Ocean", "River"] },
            { q: "What do we call a flowing body of water that goes into an ocean?", a: "River", options: ["Pond", "River", "Lake"] },
            { q: "Which continent do we live on?", a: "North America", options: ["Africa", "North America", "Europe"] },
            { q: "What is a high area of land that is flat on top?", a: "Plateau", options: ["Plateau", "Mountain", "Canyon"] },
            { q: "What is a deep valley with very steep sides, often carved by a river?", a: "Canyon", options: ["Hill", "Canyon", "Plain"] },
            { q: "Which of these is the smallest continent?", a: "Australia", options: ["Asia", "Australia", "Antarctica"] },
            { q: "What is the imaginary line that divides Earth into North and South?", a: "Equator", options: ["Prime Meridian", "Equator", "North Pole"] },
            { q: "Which ocean is the largest in the world?", a: "Pacific", options: ["Atlantic", "Indian", "Pacific"] },
            { q: "A 'Coast' is where the land meets the...", a: "Ocean", options: ["Desert", "Ocean", "Mountain"] },
            { q: "Which landform is raised but usually smaller and more rounded than a mountain?", a: "Hill", options: ["Hill", "Valley", "Plateau"] },
            { q: "What is the coldest continent on Earth?", a: "Antarctica", options: ["South America", "Antarctica", "Australia"] }
        ];

        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function ensureTryAgainButton() {
            const summaryBox = document.getElementById("summary-box");
            if (summaryBox && !summaryBox.querySelector('button[onclick="location.reload()"]')) {
                const button = document.createElement('button');
                button.className = 'next-btn';
                button.style.display = 'block';
                button.style.marginTop = '20px';
                button.innerText = 'Try Again';
                button.onclick = function() { location.reload(); };
                const backButton = summaryBox.querySelector('button[onclick^="location.href"]');
                summaryBox.insertBefore(button, backButton || null);
            }
        }

        function initializeQuiz() {
            shuffleArray(quizData);
            loadQuestion();
        }

        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = current.q;
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";

            current.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            
            // Disable buttons after answer
            btns.forEach(b => b.disabled = true);

            if (selected === current.a) {
                feedback.innerText = "Correct! Well done.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "Oops! The correct answer was " + current.a;
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            const summaryBox = document.getElementById("summary-box");
            summaryBox.classList.remove("hidden");
            ensureTryAgainButton();
            
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
            
            userResults.forEach(item => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
        }

        // Start the quiz
        initializeQuiz();
    </script>
</body>
</html>
