<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainforest Macaw Geo/History - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f7f3e8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #c84b1b;
        }
        h2 { font-family: 'Fredoka', cursive; color: #b02e1d; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice, .option-btn, .back-link {
            transition: all 0.2s;
        }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #fff6eb;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #ffb74d;
            font-weight: 700;
        }
        .topic-link:hover, .choice:hover {
            background: #ffe8d2;
            transform: translateY(-2px);
            border-color: #b02e1d;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #ffb74d;
            border-radius: 50px;
            background: white;
            color: #b02e1d;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #ffe8d2; border-color: #b02e1d; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #b02e1d;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #b02e1d 0%, #ffb74d 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #ffe0b2; }
        .hidden { display: none; }
</style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <h2>🦜 Macaw Geography/History</h2>
        <h2 id="question-text">Question</h2>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">Try Again</button>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='../grade2-history-topics.html'">Back to Macaw History/Geo Topics</button>
    </div>

    <script>
        const questionPool = [
            { q: "What is a drawing of a place from above called?", a: "Map", options: ["Photograph", "Map", "Portrait"] },
            { q: "What tells you what the symbols on a map mean?", a: "Map Key (Legend)", options: ["Map Key (Legend)", "Title", "Compass Rose"] },
            { q: "What part of a map shows the directions North, South, East, and West?", a: "Compass Rose", options: ["Ruler", "Compass Rose", "Map Key"] },
            { q: "What direction is the opposite of North?", a: "South", options: ["East", "West", "South"] },
            { q: "Which of these is a 'Cardinal Direction'?", a: "East", options: ["Up", "East", "Left"] },
            { q: "What color usually represents water on a map?", a: "Blue", options: ["Green", "Blue", "Brown"] },
            { q: "A round model of the Earth is called a...", a: "Globe", options: ["Globe", "Flat Map", "Compass"] },
            { q: "What map symbol usually represents a capital city?", a: "A star", options: ["A circle", "A star", "A triangle"] },
            { q: "Which direction is to the right on most maps?", a: "East", options: ["West", "East", "North"] },
            { q: "What do we use to find the distance between two places on a map?", a: "Map Scale", options: ["Map Scale", "Map Key", "Title"] },
            { q: "A map that shows mountains, rivers, and lakes is a...", a: "Physical Map", options: ["Political Map", "Physical Map", "Road Map"] },
            { q: "A map that shows state and country borders is a...", a: "Political Map", options: ["Political Map", "Weather Map", "Physical Map"] },
            { q: "What tells you the name of the place the map is showing?", a: "Title", options: ["Title", "Key", "Scale"] },
            { q: "If you are traveling from Florida to New York, what direction are you going?", a: "North", options: ["South", "North", "West"] },
            { q: "What do green areas on a map usually represent?", a: "Land or forests", options: ["Water", "Land or forests", "Snow"] },
            { q: "What is a 'Grid' on a map used for?", a: "Finding exact locations", options: ["Making the map colorful", "Finding exact locations", "Measuring weight"] },
            { q: "How many main cardinal directions are there?", a: "4", options: ["2", "4", "8"] },
            { q: "Which direction is to the left on a map?", a: "West", options: ["East", "North", "West"] },
            { q: "A collection of maps in a book is called an...", a: "Atlas", options: ["Encyclopedia", "Atlas", "Dictionary"] },
            { q: "What is a mental map?", a: "A map you have in your head of your neighborhood", options: ["A map you draw on paper", "A map you have in your head of your neighborhood", "A map found on a computer"] }
        ];
        const quizData = shufflePool(questionPool.slice()).slice(0, 5);
        function shufflePool(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function ensureTryAgainButton() {
            const summaryBox = document.getElementById("summary-box");
            if (summaryBox && !summaryBox.querySelector('button[onclick="location.reload()"]')) {
                const button = document.createElement('button');
                button.className = 'next-btn';
                button.style.display = 'block';
                button.style.marginTop = '20px';
                button.innerText = 'Try Again';
                button.onclick = function() { location.reload(); };
                const backButton = summaryBox.querySelector('button[onclick^="location.href"]');
                summaryBox.insertBefore(button, backButton || null);
            }
        }

        function initializeQuiz() {
            shuffleArray(quizData);
            loadQuestion();
        }

        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = current.q;
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";

            current.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            
            // Disable buttons after answer
            btns.forEach(b => b.disabled = true);

            if (selected === current.a) {
                feedback.innerText = "Correct! Well done.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "Oops! The correct answer was " + current.a;
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            const summaryBox = document.getElementById("summary-box");
            summaryBox.classList.remove("hidden");
            ensureTryAgainButton();
            
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
            
            userResults.forEach(item => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
        }

        // Start the quiz
        initializeQuiz();
    </script>
</body>
</html>
