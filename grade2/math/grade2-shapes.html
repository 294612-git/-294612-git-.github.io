<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Rainforest Jaguar Math - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
   <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #e8f7e9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #3f7d3f;
        }
        h2 { font-family: 'Fredoka', cursive; color: #215b2f; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice, .option-btn, .back-link {
            transition: all 0.2s;
        }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #f6f9f4;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #81c784;
            font-weight: 700;
        }
        .topic-link:hover, .choice:hover {
            background: #d4f0d8;
            transform: translateY(-2px);
            border-color: #215b2f;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #81c784;
            border-radius: 50px;
            background: white;
            color: #215b2f;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #d4f0d8; border-color: #215b2f; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #215b2f;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #215b2f 0%, #81c784 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #c8e6c9; }
        .hidden { display: none; }
</style>
</head>
<body>

   <div class="quiz-container" id="quiz-box">
        <h2>🐆 Jaguar Math</h2>
       <h2 id="question-text">Question</h2>
       <div class="options-container" id="options"></div>
       <div id="feedback" class="feedback"></div>
       <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
   </div>

   <div class="quiz-container hidden" id="summary-box">
       <h2>Quiz Complete!</h2>
       <div id="results-list"></div>
       <button class="next-btn" style="display:block; margin:20px auto 0;" onclick="location.reload()">Try Again</button>
       <button class="next-btn" style="display:block; margin:10px auto 0;" onclick="location.href='grade2-math-topics.html'">Back to Jaguar Math Topics</button>
   </div>

   <script>
       const quizData = [
           { q: "How many sides does a hexagon have?", a: "6", options: ["5", "6", "7", "8"] },
           { q: "Which shape has 4 equal sides and 4 corners?", a: "Square", options: ["Rectangle", "Square", "Triangle", "Circle"] },
           { q: "A 3D shape that looks like a soup can is called a ____.", a: "Cylinder", options: ["Cylinder", "Sphere", "Cube", "Cone"] },
           { q: "A 3D shape that looks like a ball is called a ____.", a: "Sphere", options: ["Cube", "Ball", "Sphere", "Pyramid"] },
           { q: "How many corners (vertices) does a triangle have?", a: "3", options: ["2", "3", "4", "5"] },
           { q: "Which shape has 5 sides and 5 corners?", a: "Pentagon", options: ["Hexagon", "Pentagon", "Octagon", "Square"] },
           { q: "A rectangle has 4 sides. How are they different from a square's sides?", a: "Two sides are long and two are short", options: ["They are all the same", "Two sides are long and two are short", "They are all curved", "It only has 3 sides"] },
           { q: "Which 3D shape looks like a box where all sides are equal squares?", a: "Cube", options: ["Cylinder", "Rectangular Prism", "Cube", "Cone"] },
           { q: "How many sides does an octagon have?", a: "8", options: ["6", "7", "8", "10"] },
           { q: "Which of these shapes has NO sides and NO corners?", a: "Circle", options: ["Square", "Circle", "Triangle", "Hexagon"] },
           { q: "A party hat is shaped like a ____.", a: "Cone", options: ["Cube", "Sphere", "Cone", "Cylinder"] },
           { q: "If you put two squares together side-by-side, what new shape do you make?", a: "A rectangle", options: ["A bigger square", "A triangle", "A rectangle", "A circle"] },
           { q: "What do we call the flat surface of a 3D shape?", a: "A face", options: ["A side", "A face", "A corner", "An edge"] },
           { q: "How many faces does a cube have?", a: "6", options: ["4", "6", "8", "12"] },
           { q: "Which shape looks like a stretched-out circle?", a: "Oval", options: ["Oval", "Diamond", "Star", "Heart"] },
           { q: "A 'vertex' is another word for a ____.", a: "Corner", options: ["Side", "Face", "Corner", "Line"] },
           { q: "Which 3D shape has a circular base and comes to a point at the top?", a: "Cone", options: ["Cylinder", "Cone", "Sphere", "Cube"] },
           { q: "A stop sign is the shape of a(n) ____.", a: "Octagon", options: ["Hexagon", "Pentagon", "Octagon", "Rectangle"] },
           { q: "How many edges does a sphere have?", a: "0", options: ["0", "1", "2", "4"] },
           { q: "Which 2D shape has 4 sides, but is tilted so it looks like a diamond?", a: "Rhombus", options: ["Trapezoid", "Rhombus", "Pentagon", "Hexagon"] }
       ];

       let currentIdx = 0;
       let score = 0;
       let userResults = [];

       function shuffleArray(array) {
           for (let i = array.length - 1; i > 0; i--) {
               const j = Math.floor(Math.random() * (i + 1));
               [array[i], array[j]] = [array[j], array[i]];
           }
       }

       function initializeQuiz() {
           shuffleArray(quizData);
           loadQuestion();
       }

       function loadQuestion() {
           const current = quizData[currentIdx];
           document.getElementById("question-text").innerText = current.q;
           const optionsDiv = document.getElementById("options");
           optionsDiv.innerHTML = "";
           document.getElementById("feedback").innerText = "";
           document.getElementById("next-button").style.display = "none";

           current.options.forEach(opt => {
               const btn = document.createElement("button");
               btn.innerText = opt;
               btn.className = "option-btn";
               btn.onclick = () => checkAnswer(opt);
               optionsDiv.appendChild(btn);
           });
       }

       function checkAnswer(selected) {
           const current = quizData[currentIdx];
           const feedback = document.getElementById("feedback");
           const btns = document.querySelectorAll(".option-btn");
           btns.forEach(b => b.disabled = true);

           if (selected === current.a) {
               feedback.innerText = "Correct! Well done.";
               feedback.className = "feedback correct";
               score++;
               userResults.push({ q: current.q, res: "Correct", class: "correct" });
           } else {
               feedback.innerText = "Oops! The correct answer was " + current.a;
               feedback.className = "feedback wrong";
               userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
           }
           document.getElementById("next-button").style.display = "block";
       }

       function loadNextQuestion() {
           currentIdx++;
           if (currentIdx < quizData.length) {
               loadQuestion();
           } else {
               showSummary();
           }
       }

       function showSummary() {
           document.getElementById("quiz-box").classList.add("hidden");
           const summaryBox = document.getElementById("summary-box");
           summaryBox.classList.remove("hidden");
           const list = document.getElementById("results-list");
           list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
           userResults.forEach(item => {
               const div = document.createElement("div");
               div.className = "summary-item";
               div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
               list.appendChild(div);
           });
       }

       initializeQuiz();
   </script>
</body>
</html>
