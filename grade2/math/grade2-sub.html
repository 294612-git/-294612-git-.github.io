<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Rainforest Jaguar Math - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
   <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #e8f7e9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #3f7d3f;
        }
        h2 { font-family: 'Fredoka', cursive; color: #215b2f; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice, .option-btn, .back-link {
            transition: all 0.2s;
        }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #f6f9f4;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #81c784;
            font-weight: 700;
        }
        .topic-link:hover, .choice:hover {
            background: #d4f0d8;
            transform: translateY(-2px);
            border-color: #215b2f;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #81c784;
            border-radius: 50px;
            background: white;
            color: #215b2f;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #d4f0d8; border-color: #215b2f; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #215b2f;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #215b2f 0%, #81c784 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #c8e6c9; }
        .hidden { display: none; }
</style>
</head>
<body>

   <div class="quiz-container" id="quiz-box">
        <h2>🐆 Jaguar Math</h2>
       <h2 id="question-text">Question</h2>
       <div class="options-container" id="options"></div>
       <div id="feedback" class="feedback"></div>
       <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
   </div>

   <div class="quiz-container hidden" id="summary-box">
       <h2>Quiz Complete!</h2>
       <div id="results-list"></div>
       <button class="next-btn" style="display:block; margin:20px auto 0;" onclick="location.reload()">Try Again</button>
       <button class="next-btn" style="display:block; margin:10px auto 0;" onclick="location.href='grade2-math-topics.html'">Back to Jaguar Math Topics</button>
   </div>

   <script>
       const questionPool = [
           { q: "What is 23 + 15?", a: "38", options: ["37", "38", "48", "35"] },
           { q: "What is 45 − 12?", a: "33", options: ["32", "34", "33", "43"] },
           { q: "What is 56 + 10?", a: "66", options: ["60", "65", "66", "76"] },
           { q: "What is 72 − 20?", a: "52", options: ["50", "52", "62", "42"] },
           { q: "What is 34 + 22?", a: "56", options: ["56", "54", "66", "58"] },
           { q: "What is 88 − 33?", a: "55", options: ["55", "45", "65", "50"] },
           { q: "What is 15 + 15?", a: "30", options: ["25", "30", "35", "40"] },
           { q: "What is 60 − 40?", a: "20", options: ["10", "20", "30", "25"] },
           { q: "What is 41 + 18?", a: "59", options: ["58", "59", "60", "69"] },
           { q: "What is 95 − 5?", a: "90", options: ["80", "85", "90", "100"] },
           { q: "What is 12 + 24?", a: "36", options: ["34", "36", "38", "46"] },
           { q: "What is 50 − 25?", a: "25", options: ["20", "30", "25", "15"] },
           { q: "What is 10 + 10 + 10?", a: "30", options: ["20", "30", "40", "100"] },
           { q: "What is 39 − 19?", a: "20", options: ["10", "20", "30", "29"] },
           { q: "What is 62 + 7?", a: "69", options: ["67", "68", "69", "70"] },
           { q: "What is 80 − 50?", a: "30", options: ["20", "30", "40", "50"] },
           { q: "What is 14 + 13?", a: "27", options: ["26", "27", "28", "37"] },
           { q: "What is 100 − 50?", a: "50", options: ["40", "50", "60", "70"] },
           { q: "What is 25 + 25?", a: "50", options: ["40", "45", "50", "60"] },
           { q: "What is 47 − 10?", a: "37", options: ["37", "40", "30", "57"] }
        ];
        const quizData = shufflePool(questionPool.slice()).slice(0, 5);
        function shufflePool(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

       let currentIdx = 0;
       let score = 0;
       let userResults = [];

       function shuffleArray(array) {
           for (let i = array.length - 1; i > 0; i--) {
               const j = Math.floor(Math.random() * (i + 1));
               [array[i], array[j]] = [array[j], array[i]];
           }
       }

       function initializeQuiz() {
           shuffleArray(quizData);
           loadQuestion();
       }

       function loadQuestion() {
           const current = quizData[currentIdx];
           document.getElementById("question-text").innerText = current.q;
           const optionsDiv = document.getElementById("options");
           optionsDiv.innerHTML = "";
           document.getElementById("feedback").innerText = "";
           document.getElementById("next-button").style.display = "none";

           current.options.forEach(opt => {
               const btn = document.createElement("button");
               btn.innerText = opt;
               btn.className = "option-btn";
               btn.onclick = () => checkAnswer(opt);
               optionsDiv.appendChild(btn);
           });
       }

       function checkAnswer(selected) {
           const current = quizData[currentIdx];
           const feedback = document.getElementById("feedback");
           const btns = document.querySelectorAll(".option-btn");
           btns.forEach(b => b.disabled = true);

           if (selected === current.a) {
               feedback.innerText = "Correct! Well done.";
               feedback.className = "feedback correct";
               score++;
               userResults.push({ q: current.q, res: "Correct", class: "correct" });
           } else {
               feedback.innerText = "Oops! The correct answer was " + current.a + ".";
               feedback.className = "feedback wrong";
               userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
           }
           document.getElementById("next-button").style.display = "block";
       }

       function loadNextQuestion() {
           currentIdx++;
           if (currentIdx < quizData.length) {
               loadQuestion();
           } else {
               showSummary();
           }
       }

       function showSummary() {
           document.getElementById("quiz-box").classList.add("hidden");
           const summaryBox = document.getElementById("summary-box");
           summaryBox.classList.remove("hidden");
          
           const list = document.getElementById("results-list");
           list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
          
           userResults.forEach(item => {
               const div = document.createElement("div");
               div.className = "summary-item";
               div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
               list.appendChild(div);
           });
       }

       initializeQuiz();
   </script>
</body>
</html>
