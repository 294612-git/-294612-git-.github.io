<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Money Quiz - Study Buddy</title>
   <style>
       body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
       .quiz-container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 500px; text-align: center; }
       h2 { color: #667eea; }
       .options-container { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
       .option-btn { padding: 12px; border: 2px solid #ddd; border-radius: 8px; background: white; cursor: pointer; font-size: 1.1rem; transition: 0.2s; }
       .option-btn:hover { border-color: #667eea; background: #f0f2ff; }
       .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
       .correct { color: #28a745; }
       .wrong { color: #dc3545; }
       .next-btn { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; display: none; margin: 0 auto; }
       .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
       .hidden { display: none; }
   </style>
</head>
<body>

   <div class="quiz-container" id="quiz-box">
       <h2 id="question-text">Question</h2>
       <div class="options-container" id="options"></div>
       <div id="feedback" class="feedback"></div>
       <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
   </div>

   <div class="quiz-container hidden" id="summary-box">
       <h2>Quiz Complete!</h2>
       <div id="results-list"></div>
       <button class="next-btn" style="display:block; margin:20px auto 0;" onclick="location.reload()">Try Again</button>
       <button class="next-btn" style="display:block; margin:10px auto 0;" onclick="location.href='grade2-math-topics.html'">Back to Topics</button>
   </div>

   <script>
       const quizData = [
           { q: "How much is one quarter worth?", a: "25¢", options: ["10¢", "25¢", "50¢", "5¢"] },
           { q: "How much are 2 dimes worth?", a: "20¢", options: ["10¢", "20¢", "30¢", "40¢"] },
           { q: "Which coin is worth 5¢?", a: "Nickel", options: ["Penny", "Nickel", "Dime", "Quarter"] },
           { q: "If you have 3 quarters, how much money do you have?", a: "75¢", options: ["50¢", "75¢", "$1.00", "30¢"] },
           { q: "How many pennies make $1.00?", a: "100", options: ["10", "50", "100", "1,000"] },
           { q: "What is the total of 1 quarter and 1 nickel?", a: "30¢", options: ["26¢", "30¢", "35¢", "40¢"] },
           { q: "Which bill has George Washington on it?", a: "$1 bill", options: ["$1 bill", "$5 bill", "$10 bill", "$20 bill"] },
           { q: "If an apple costs 60¢ and you pay with 3 quarters, how much change do you get back?", a: "15¢", options: ["10¢", "15¢", "20¢", "25¢"] },
           { q: "How many dimes do you need to make $1.00?", a: "10", options: ["5", "10", "20", "100"] },
           { q: "Which is more money?", a: "3 dimes", options: ["5 nickels", "3 dimes", "1 quarter", "20 pennies"] },
           { q: "How much is 1 nickel and 4 pennies?", a: "9¢", options: ["5¢", "9¢", "10¢", "14¢"] },
           { q: "Which coin is the smallest in size?", a: "Dime", options: ["Quarter", "Nickel", "Penny", "Dime"] },
           { q: "What is the value of 2 quarters and 2 dimes?", a: "70¢", options: ["60¢", "70¢", "52¢", "80¢"] },
           { q: "How much is a 'half-dollar' coin worth?", a: "50¢", options: ["25¢", "50¢", "75¢", "$1.00"] },
           { q: "If you have $5.00 and spend $2.00 on a toy, how much do you have left?", a: "$3.00", options: ["$2.00", "$3.00", "$4.00", "$7.00"] },
           { q: "How many nickels make a quarter?", a: "5", options: ["2", "3", "4", "5"] },
           { q: "Which coin is copper-colored (brown)?", a: "Penny", options: ["Dime", "Nickel", "Penny", "Quarter"] },
           { q: "What is the total of 4 quarters?", a: "$1.00", options: ["75¢", "$1.00", "$2.00", "40¢"] },
           { q: "If you have 1 dime, 1 nickel, and 1 penny, how much do you have?", a: "16¢", options: ["11¢", "15¢", "16¢", "20¢"] },
           { q: "Which is the correct way to write fifty cents?", a: "$0.50", options: ["50$", "0.50¢", "$0.50", "5¢"] }
       ];

       let currentIdx = 0;
       let score = 0;
       let userResults = [];

       function shuffleArray(array) {
           for (let i = array.length - 1; i > 0; i--) {
               const j = Math.floor(Math.random() * (i + 1));
               [array[i], array[j]] = [array[j], array[i]];
           }
       }

       function initializeQuiz() {
           shuffleArray(quizData);
           loadQuestion();
       }

       function loadQuestion() {
           const current = quizData[currentIdx];
           document.getElementById("question-text").innerText = current.q;
           const optionsDiv = document.getElementById("options");
           optionsDiv.innerHTML = "";
           document.getElementById("feedback").innerText = "";
           document.getElementById("next-button").style.display = "none";

           current.options.forEach(opt => {
               const btn = document.createElement("button");
               btn.innerText = opt;
               btn.className = "option-btn";
               btn.onclick = () => checkAnswer(opt);
               optionsDiv.appendChild(btn);
           });
       }

       function checkAnswer(selected) {
           const current = quizData[currentIdx];
           const feedback = document.getElementById("feedback");
           const btns = document.querySelectorAll(".option-btn");
           btns.forEach(b => b.disabled = true);

           if (selected === current.a) {
               feedback.innerText = "Correct! Well done.";
               feedback.className = "feedback correct";
               score++;
               userResults.push({ q: current.q, res: "Correct", class: "correct" });
           } else {
               feedback.innerText = "Oops! The correct answer was " + current.a;
               feedback.className = "feedback wrong";
               userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
           }
           document.getElementById("next-button").style.display = "block";
       }

       function loadNextQuestion() {
           currentIdx++;
           if (currentIdx < quizData.length) {
               loadQuestion();
           } else {
               showSummary();
           }
       }

       function showSummary() {
           document.getElementById("quiz-box").classList.add("hidden");
           const summaryBox = document.getElementById("summary-box");
           summaryBox.classList.remove("hidden");
           const list = document.getElementById("results-list");
           list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
           userResults.forEach(item => {
               const div = document.createElement("div");
               div.className = "summary-item";
               div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
               list.appendChild(div);
           });
       }

       initializeQuiz();
   </script>
</body>
</html>
