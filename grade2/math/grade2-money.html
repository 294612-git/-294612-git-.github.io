<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Rainforest Jaguar Math - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
   <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #e8f7e9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #3f7d3f;
        }
        h2 { font-family: 'Fredoka', cursive; color: #215b2f; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice, .option-btn, .back-link {
            transition: all 0.2s;
        }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #f6f9f4;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #81c784;
            font-weight: 700;
        }
        .topic-link:hover, .choice:hover {
            background: #d4f0d8;
            transform: translateY(-2px);
            border-color: #215b2f;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #81c784;
            border-radius: 50px;
            background: white;
            color: #215b2f;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #d4f0d8; border-color: #215b2f; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #215b2f;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #215b2f 0%, #81c784 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #c8e6c9; }
        .hidden { display: none; }
</style>
</head>
<body>

   <div class="quiz-container" id="quiz-box">
        <h2>🐆 Jaguar Math</h2>
       <h2 id="question-text">Question</h2>
       <div class="options-container" id="options"></div>
       <div id="feedback" class="feedback"></div>
       <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
   </div>

   <div class="quiz-container hidden" id="summary-box">
       <h2>Quiz Complete!</h2>
       <div id="results-list"></div>
       <button class="next-btn" style="display:block; margin:20px auto 0;" onclick="location.reload()">Try Again</button>
       <button class="next-btn" style="display:block; margin:10px auto 0;" onclick="location.href='grade2-math-topics.html'">Back to Jaguar Math Topics</button>
   </div>

   <script>
       const questionPool = [
           { q: "How much is one quarter worth?", a: "25¢", options: ["10¢", "25¢", "50¢", "5¢"] },
           { q: "How much are 2 dimes worth?", a: "20¢", options: ["10¢", "20¢", "30¢", "40¢"] },
           { q: "Which coin is worth 5¢?", a: "Nickel", options: ["Penny", "Nickel", "Dime", "Quarter"] },
           { q: "If you have 3 quarters, how much money do you have?", a: "75¢", options: ["50¢", "75¢", "$1.00", "30¢"] },
           { q: "How many pennies make $1.00?", a: "100", options: ["10", "50", "100", "1,000"] },
           { q: "What is the total of 1 quarter and 1 nickel?", a: "30¢", options: ["26¢", "30¢", "35¢", "40¢"] },
           { q: "Which bill has George Washington on it?", a: "$1 bill", options: ["$1 bill", "$5 bill", "$10 bill", "$20 bill"] },
           { q: "If an apple costs 60¢ and you pay with 3 quarters, how much change do you get back?", a: "15¢", options: ["10¢", "15¢", "20¢", "25¢"] },
           { q: "How many dimes do you need to make $1.00?", a: "10", options: ["5", "10", "20", "100"] },
           { q: "Which is more money?", a: "3 dimes", options: ["5 nickels", "3 dimes", "1 quarter", "20 pennies"] },
           { q: "How much is 1 nickel and 4 pennies?", a: "9¢", options: ["5¢", "9¢", "10¢", "14¢"] },
           { q: "Which coin is the smallest in size?", a: "Dime", options: ["Quarter", "Nickel", "Penny", "Dime"] },
           { q: "What is the value of 2 quarters and 2 dimes?", a: "70¢", options: ["60¢", "70¢", "52¢", "80¢"] },
           { q: "How much is a 'half-dollar' coin worth?", a: "50¢", options: ["25¢", "50¢", "75¢", "$1.00"] },
           { q: "If you have $5.00 and spend $2.00 on a toy, how much do you have left?", a: "$3.00", options: ["$2.00", "$3.00", "$4.00", "$7.00"] },
           { q: "How many nickels make a quarter?", a: "5", options: ["2", "3", "4", "5"] },
           { q: "Which coin is copper-colored (brown)?", a: "Penny", options: ["Dime", "Nickel", "Penny", "Quarter"] },
           { q: "What is the total of 4 quarters?", a: "$1.00", options: ["75¢", "$1.00", "$2.00", "40¢"] },
           { q: "If you have 1 dime, 1 nickel, and 1 penny, how much do you have?", a: "16¢", options: ["11¢", "15¢", "16¢", "20¢"] },
           { q: "Which is the correct way to write fifty cents?", a: "$0.50", options: ["50$", "0.50¢", "$0.50", "5¢"] }
        ];
        const quizData = shufflePool(questionPool.slice()).slice(0, 5);
        function shufflePool(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

       let currentIdx = 0;
       let score = 0;
       let userResults = [];

       function shuffleArray(array) {
           for (let i = array.length - 1; i > 0; i--) {
               const j = Math.floor(Math.random() * (i + 1));
               [array[i], array[j]] = [array[j], array[i]];
           }
       }

       function initializeQuiz() {
           shuffleArray(quizData);
           loadQuestion();
       }

       function loadQuestion() {
           const current = quizData[currentIdx];
           document.getElementById("question-text").innerText = current.q;
           const optionsDiv = document.getElementById("options");
           optionsDiv.innerHTML = "";
           document.getElementById("feedback").innerText = "";
           document.getElementById("next-button").style.display = "none";

           current.options.forEach(opt => {
               const btn = document.createElement("button");
               btn.innerText = opt;
               btn.className = "option-btn";
               btn.onclick = () => checkAnswer(opt);
               optionsDiv.appendChild(btn);
           });
       }

       function checkAnswer(selected) {
           const current = quizData[currentIdx];
           const feedback = document.getElementById("feedback");
           const btns = document.querySelectorAll(".option-btn");
           btns.forEach(b => b.disabled = true);

           if (selected === current.a) {
               feedback.innerText = "Correct! Well done.";
               feedback.className = "feedback correct";
               score++;
               userResults.push({ q: current.q, res: "Correct", class: "correct" });
           } else {
               feedback.innerText = "Oops! The correct answer was " + current.a;
               feedback.className = "feedback wrong";
               userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
           }
           document.getElementById("next-button").style.display = "block";
       }

       function loadNextQuestion() {
           currentIdx++;
           if (currentIdx < quizData.length) {
               loadQuestion();
           } else {
               showSummary();
           }
       }

       function showSummary() {
           document.getElementById("quiz-box").classList.add("hidden");
           const summaryBox = document.getElementById("summary-box");
           summaryBox.classList.remove("hidden");
           const list = document.getElementById("results-list");
           list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
           userResults.forEach(item => {
               const div = document.createElement("div");
               div.className = "summary-item";
               div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
               list.appendChild(div);
           });
       }

       initializeQuiz();
   </script>
</body>
</html>
