<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 2 English - Choose Topic</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .menu-container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 500px; text-align: center; }
        h2 { color: #667eea; }
        .topic-select { width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #ddd; font-size: 1rem; margin: 1rem 0; }
        .go-btn { background: #667eea; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 1rem; }
        .go-btn:hover { background: #5563c1; }
        .back-link { display: inline-block; margin-top: 1rem; color: #667eea; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="menu-container">
        <h2>Grade 2 English</h2>
        <p>Choose a topic to start your quiz:</p>
        <select id="topic-select" class="topic-select">
            <option value="grade2-reading-foundations.html">Reading Foundations</option>
            <option value="grade2-reading-strategies.html">Reading Strategies</option>
            <option value="grade2-vocabulary.html">Vocabulary</option>
        </select>
        <button class="go-btn" onclick="goToTopic()">Go to Quiz</button>
        <a href="../startquiz.html" class="back-link">← Back to Quiz Selection</a>
    </div>
    <script>
        function goToTopic() {
            const select = document.getElementById('topic-select');
            window.location.href = select.value;
        }
    </script>
</body>
</html>
