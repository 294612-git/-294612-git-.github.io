<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Rainforest Dart Frog Science - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
   <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #e3f7f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #0f6f63;
        }
        h2 { font-family: 'Fredoka', cursive; color: #0d4d4b; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice, .option-btn, .back-link {
            transition: all 0.2s;
        }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #f0fffd;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #4db6ac;
            font-weight: 700;
        }
        .topic-link:hover, .choice:hover {
            background: #c7f1ec;
            transform: translateY(-2px);
            border-color: #0d4d4b;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #4db6ac;
            border-radius: 50px;
            background: white;
            color: #0d4d4b;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #c7f1ec; border-color: #0d4d4b; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #0d4d4b;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #0d4d4b 0%, #4db6ac 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #b2dfdb; }
        .hidden { display: none; }
</style>
</head>
<body>

   <div class="quiz-container" id="quiz-box">
        <h2>🐸 Dart Frog Science</h2>
       <h2 id="question-text">Question</h2>
       <div class="options-container" id="options"></div>
       <div id="feedback" class="feedback"></div>
       <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
   </div>

   <div class="quiz-container hidden" id="summary-box">
       <h2>Quiz Complete!</h2>
       <div id="results-list"></div>
       <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">Try Again</button>
       <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade2-science-topics.html'">Back to Dart Frog Science Topics</button>
   </div>

   <script>
       const questionPool = [
           { q: "What do plants need to make their own food?", a: "Sunlight, water, and air", options: ["Sunlight, water, and air", "Rocks and dirt", "Plastic and metal", "Juice and soda"] },
           { q: "Which part of a plant is responsible for making seeds?", a: "The Flower", options: ["The Root", "The Stem", "The Flower", "The Leaf"] },
           { q: "The very first stage of a plant’s life cycle is a ____.", a: "Seed", options: ["Leaf", "Seed", "Fruit", "Flower"] },
           { q: "What is the main job of the roots?", a: "To absorb water and nutrients from the soil", options: ["To help the plant fly", "To absorb water and nutrients from the soil", "To make the plant look pretty", "To catch sunlight"] },
           { q: "What is the name of the process plants use to make food from sunlight?", a: "Photosynthesis", options: ["Cooking", "Photosynthesis", "Hibernation", "Germination"] },
           { q: "Which part of the plant acts like a straw to move water to the leaves?", a: "The Stem", options: ["The Flower", "The Stem", "The Seed", "The Petal"] },
           { q: "What do leaves take in from the air to help the plant grow?", a: "Carbon dioxide", options: ["Carbon dioxide", "Dust", "Rain", "Soil"] },
           { q: "When a seed begins to grow and sprout, it is called ____.", a: "Germination", options: ["Wilting", "Germination", "Sleeping", "Harvesting"] },
           { q: "What part of the plant protects the seeds?", a: "The Fruit", options: ["The Root", "The Fruit", "The Stem", "The Dirt"] },
           { q: "Which of these is NOT something a plant needs to survive?", a: "Pizza", options: ["Space to grow", "Sunlight", "Pizza", "Water"] },
           { q: "What do we call the yellow powder that helps plants make seeds?", a: "Pollen", options: ["Sugar", "Pollen", "Sand", "Salt"] },
           { q: "A young plant that has just sprouted from a seed is called a ____.", a: "Seedling", options: ["Tree", "Seedling", "Fruit", "Root"] },
           { q: "Why are most leaves green?", a: "Because of chlorophyll", options: ["Because of chlorophyll", "Because they are painted", "Because of the blue sky", "Because of the brown dirt"] },
           { q: "Which part of the plant keeps it anchored (stuck) in the ground?", a: "The Roots", options: ["The Leaves", "The Roots", "The Petals", "The Seeds"] },
           { q: "What happens during the 'Adult' stage of a plant's life cycle?", a: "It produces flowers or fruit", options: ["It turns back into a seed", "It produces flowers or fruit", "It stops needing water", "It grows a trunk"] },
           { q: "How can seeds move to new places?", a: "By wind, water, or animals", options: ["By wind, water, or animals", "By calling a taxi", "By walking on their roots", "They never move"] },
           { q: "Which plant part catches the most sunlight?", a: "The Leaf", options: ["The Root", "The Leaf", "The Stem", "The Seed"] },
           { q: "What do plants release into the air that humans need to breathe?", a: "Oxygen", options: ["Water", "Oxygen", "Smoke", "Helium"] },
           { q: "What is the 'skin' of a seed called?", a: "Seed coat", options: ["Seed coat", "Shell", "Wrapper", "Jacket"] },
           { q: "Plants are 'Producers' because they ____.", a: "Make their own food", options: ["Eat other plants", "Make their own food", "Buy food at the store", "Do not need food"] }
        ];
        const quizData = shufflePool(questionPool.slice()).slice(0, 5);
        function shufflePool(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

       let currentIdx = 0;
       let score = 0;
       let userResults = [];

       function shuffleArray(array) {
           for (let i = array.length - 1; i > 0; i--) {
               const j = Math.floor(Math.random() * (i + 1));
               [array[i], array[j]] = [array[j], array[i]];
           }
       }

       function initializeQuiz() {
           shuffleArray(quizData);
           loadQuestion();
       }

       function loadQuestion() {
           const current = quizData[currentIdx];
           document.getElementById("question-text").innerText = current.q;
           const optionsDiv = document.getElementById("options");
           optionsDiv.innerHTML = "";
           document.getElementById("feedback").innerText = "";
           document.getElementById("next-button").style.display = "none";

           current.options.forEach(opt => {
               const btn = document.createElement("button");
               btn.innerText = opt;
               btn.className = "option-btn";
               btn.onclick = () => checkAnswer(opt);
               optionsDiv.appendChild(btn);
           });
       }

       function checkAnswer(selected) {
           const current = quizData[currentIdx];
           const feedback = document.getElementById("feedback");
           const btns = document.querySelectorAll(".option-btn");
           btns.forEach(b => b.disabled = true);

           if (selected === current.a) {
               feedback.innerText = "Correct! Well done.";
               feedback.className = "feedback correct";
               score++;
               userResults.push({ q: current.q, res: "Correct", class: "correct" });
           } else {
               feedback.innerText = "Oops! The correct answer was " + current.a;
               feedback.className = "feedback wrong";
               userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
           }
           document.getElementById("next-button").style.display = "block";
       }

       function loadNextQuestion() {
           currentIdx++;
           if (currentIdx < quizData.length) {
               loadQuestion();
           } else {
               showSummary();
           }
       }

       function showSummary() {
           document.getElementById("quiz-box").classList.add("hidden");
           const summaryBox = document.getElementById("summary-box");
           summaryBox.classList.remove("hidden");
           const list = document.getElementById("results-list");
           list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
           userResults.forEach(item => {
               const div = document.createElement("div");
               div.className = "summary-item";
               div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
               list.appendChild(div);
           });
       }

       initializeQuiz();
   </script>
</body>
</html>
