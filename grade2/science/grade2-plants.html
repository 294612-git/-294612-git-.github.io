<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plants Quiz - Study Buddy</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .quiz-container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 500px; text-align: center; }
        h2 { color: #667eea; }
        .options-container { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
        .option-btn { padding: 12px; border: 2px solid #ddd; border-radius: 8px; background: white; cursor: pointer; font-size: 1.1rem; transition: 0.2s; }
        .option-btn:hover { border-color: #667eea; background: #f0f2ff; }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #28a745; }
        .wrong { color: #dc3545; }
        .next-btn { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; display: none; margin: 0 auto; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <h2 id="question-text">Question</h2>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">Try Again</button>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade2-science-topics.html'">Back to Topics</button>
    </div>

    <script>
        const quizData = [
            { q: "What is the part of the plant that grows underground and drinks water?", a: "Roots", options: ["Flower", "Roots", "Leaf"] },
            { q: "What part of the plant acts like a straw to move water to the leaves?", a: "Stem", options: ["Stem", "Seed", "Fruit"] },
            { q: "What do leaves need to capture from the sky to make food?", a: "Sunlight", options: ["Rain", "Sunlight", "Wind"] },
            { q: "What is the green 'stuff' inside leaves that helps make food?", a: "Chlorophyll", options: ["Chlorophyll", "Paint", "Sap"] },
            { q: "What does a seed need to wake up and start growing?", a: "Warmth and water", options: ["Darkness and ice", "Warmth and water", "Toys and music"] },
            { q: "Which part of the plant makes seeds?", a: "Flower", options: ["Roots", "Flower", "Bark"] },
            { q: "What gas do plants 'breathe in' that humans breathe out?", a: "Carbon Dioxide", options: ["Oxygen", "Carbon Dioxide", "Helium"] },
            { q: "What gas do plants 'breathe out' that helps humans live?", a: "Oxygen", options: ["Oxygen", "Smoke", "Nitrogen"] },
            { q: "A tiny plant inside a seed is called an...", a: "Embryo", options: ["Adult", "Embryo", "Root"] },
            { q: "Which of these is a plant's 'fruit'?", a: "An apple", options: ["An apple", "A rock", "A stick"] },
            { q: "Why do some plants have thorns?", a: "To protect themselves from being eaten", options: ["To look pretty", "To protect themselves from being eaten", "To catch rain"] },
            { q: "What is a tree trunk covered in?", a: "Bark", options: ["Skin", "Bark", "Cloth"] },
            { q: "What do we call a tree that stays green all winter?", a: "Evergreen", options: ["Deciduous", "Evergreen", "Frozen"] },
            { q: "Where do plants get their nutrients?", a: "The soil", options: ["The sun", "The soil", "The air"] },
            { q: "Which part of the plant usually grows toward the light?", a: "Stem", options: ["Roots", "Stem", "Seeds"] },
            { q: "What is a 'sapling'?", a: "A young tree", options: ["An old tree", "A young tree", "A dead tree"] },
            { q: "Which plant grows in the desert and stores water in its stem?", a: "Cactus", options: ["Pine tree", "Cactus", "Fern"] },
            { q: "What is the process of a seed sprouting called?", a: "Germination", options: ["Germination", "Hibernation", "Condensation"] },
            { q: "What do plants use to make food?", a: "Sunlight, water, and air", options: ["Soil and rocks", "Sunlight, water, and air", "Insects and worms"] },
            { q: "Which part of the plant attracts bees with its color?", a: "Petals", options: ["Stem", "Petals", "Roots"] }
        ];

        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function ensureTryAgainButton() {
            const summaryBox = document.getElementById("summary-box");
            if (summaryBox && !summaryBox.querySelector('button[onclick="location.reload()"]')) {
                const button = document.createElement('button');
                button.className = 'next-btn';
                button.style.display = 'block';
                button.style.marginTop = '20px';
                button.innerText = 'Try Again';
                button.onclick = function() { location.reload(); };
                const backButton = summaryBox.querySelector('button[onclick^="location.href"]');
                summaryBox.insertBefore(button, backButton || null);
            }
        }

        function initializeQuiz() {
            shuffleArray(quizData);
            loadQuestion();
        }

        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = current.q;
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";

            current.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            btns.forEach(b => b.disabled = true);

            if (selected === current.a) {
                feedback.innerText = "Correct! Well done.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "Oops! The correct answer was " + current.a;
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            const summaryBox = document.getElementById("summary-box");
            summaryBox.classList.remove("hidden");
            ensureTryAgainButton();

            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
            userResults.forEach(item => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
        }

        initializeQuiz();
    </script>
</body>
</html>
