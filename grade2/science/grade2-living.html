<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Living vs. Non-Living Things Quiz - Study Buddy</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .quiz-container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 500px; text-align: center; }
        h2 { color: #667eea; }
        .options-container { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
        .option-btn { padding: 12px; border: 2px solid #ddd; border-radius: 8px; background: white; cursor: pointer; font-size: 1.1rem; transition: 0.2s; }
        .option-btn:hover { border-color: #667eea; background: #f0f2ff; }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #28a745; }
        .wrong { color: #dc3545; }
        .next-btn { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; display: none; margin: 0 auto; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <h2 id="question-text">Question</h2>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">Try Again</button>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade2-science-topics.html'">Back to Topics</button>
    </div>

    <script>
        const quizData = [
            { q: "Which of these is a living thing?", a: "A tree", options: ["A rock", "A tree", "A car"] },
            { q: "What is one thing all living things need?", a: "Energy (Food/Sun)", options: ["Toys", "Energy (Food/Sun)", "A computer"] },
            { q: "Can non-living things grow on their own?", a: "No", options: ["Yes", "No"] },
            { q: "A teddy bear is non-living because...", a: "It does not breathe or grow", options: ["It is soft", "It does not breathe or grow", "It is brown"] },
            { q: "Which of these is a non-living thing found in nature?", a: "A river", options: ["A flower", "A river", "A bird"] },
            { q: "Do living things move on their own?", a: "Yes", options: ["Yes", "No"] },
            { q: "A cloud moves in the sky. Is it living?", a: "No, because it does not eat or reproduce", options: ["Yes, because it moves", "No, because it does not eat or reproduce"] },
            { q: "What do we call it when living things make babies or seeds?", a: "Reproduction", options: ["Reproduction", "Breathing", "Growing"] },
            { q: "Is a seed living or non-living?", a: "Living (it is dormant)", options: ["Living (it is dormant)", "Non-living"] },
            { q: "Which of these is NOT a characteristic of living things?", a: "Staying the same size forever", options: ["Reacting to the environment", "Staying the same size forever", "Needing water"] },
            { q: "Is fire living or non-living?", a: "Non-living (it does not have cells)", options: ["Living (it grows and moves)", "Non-living (it does not have cells)"] },
            { q: "Living things are made of tiny building blocks called...", a: "Cells", options: ["Bricks", "Cells", "Atoms"] },
            { q: "Which of these is a man-made non-living thing?", a: "A bicycle", options: ["A mountain", "A bicycle", "A fish"] },
            { q: "Why is a volcano non-living?", a: "It does not breathe or need food", options: ["It is too hot", "It does not breathe or need food", "It is made of rock"] },
            { q: "All living things need ___ to breathe.", a: "Air", options: ["Air", "Dirt", "Sunlight"] },
            { q: "Which of these can reproduce?", a: "A mushroom", options: ["A mushroom", "A pencil", "A shoe"] },
            { q: "What happens to a living thing if it has no water?", a: "It will die", options: ["It grows bigger", "It will die", "It turns into a rock"] },
            { q: "A robot can move and talk. Is it living?", a: "No, it is a machine", options: ["Yes", "No, it is a machine"] },
            { q: "Which sense helps living things react to a loud noise?", a: "Hearing", options: ["Sight", "Hearing", "Smell"] },
            { q: "Is a dead leaf living or non-living?", a: "Non-living (it was once living)", options: ["Living", "Non-living (it was once living)"] }
        ];

        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function ensureTryAgainButton() {
            const summaryBox = document.getElementById("summary-box");
            if (summaryBox && !summaryBox.querySelector('button[onclick="location.reload()"]')) {
                const button = document.createElement('button');
                button.className = 'next-btn';
                button.style.display = 'block';
                button.style.marginTop = '20px';
                button.innerText = 'Try Again';
                button.onclick = function() { location.reload(); };
                const backButton = summaryBox.querySelector('button[onclick^="location.href"]');
                summaryBox.insertBefore(button, backButton || null);
            }
        }

        function initializeQuiz() {
            shuffleArray(quizData);
            loadQuestion();
        }

        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = current.q;
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";

            current.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            
            // Disable buttons after answer
            btns.forEach(b => b.disabled = true);

            if (selected === current.a) {
                feedback.innerText = "Correct! Well done.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "Oops! The correct answer was " + current.a;
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            const summaryBox = document.getElementById("summary-box");
            summaryBox.classList.remove("hidden");
            ensureTryAgainButton();
            
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
            
            userResults.forEach(item => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
        }

        // Start the quiz
        initializeQuiz();
    </script>
</body>
</html>
