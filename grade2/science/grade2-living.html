<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Living vs. Non-Living Things Quiz - Study Buddy</title>
   <style>
       body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
       .quiz-container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 500px; text-align: center; }
       h2 { color: #667eea; }
       .options-container { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
       .option-btn { padding: 12px; border: 2px solid #ddd; border-radius: 8px; background: white; cursor: pointer; font-size: 1.1rem; transition: 0.2s; text-align: left; }
       .option-btn:hover { border-color: #667eea; background: #f0f2ff; }
       .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
       .correct { color: #28a745; }
       .wrong { color: #dc3545; }
       .next-btn { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; display: none; margin: 0 auto; }
       .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
       .hidden { display: none; }
   </style>
</head>
<body>

   <div class="quiz-container" id="quiz-box">
       <h2 id="question-text">Question</h2>
       <div class="options-container" id="options"></div>
       <div id="feedback" class="feedback"></div>
       <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
   </div>

   <div class="quiz-container hidden" id="summary-box">
       <h2>Quiz Complete!</h2>
       <div id="results-list"></div>
       <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">Try Again</button>
       <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade2-science-topics.html'">Back to Topics</button>
   </div>

   <script>
       const quizData = [
           { q: "Which of these is a living thing?", a: "A Tree", options: ["A Rock", "A Tree", "A Water bottle", "A Bicycle"] },
           { q: "All living things must have ____ to stay alive.", a: "Air, water, and nutrients", options: ["Air, water, and nutrients", "Nothing at all", "Batteries", "Gasoline"] },
           { q: "Which of these is a non-living thing?", a: "A Chair", options: ["A Dog", "A Chair", "A Mushroom", "A Grasshopper"] },
           { q: "One way to tell if something is living is that it can ____.", a: "Grow and change", options: ["Grow and change", "Stay the same size forever", "Never move on its own", "Live without water"] },
           { q: "Living things make more of their own kind. This is called ____.", a: "Reproduction", options: ["Sleeping", "Reproduction", "Exercise", "Hiding"] },
           { q: "Which of these non-living things was once part of a living thing?", a: "A wooden table", options: ["A plastic spoon", "A wooden table", "A glass window", "A metal key"] },
           { q: "How do plants (living things) get their nutrients?", a: "They make their own food using sunlight", options: ["They eat other plants", "They make their own food using sunlight", "They go to the grocery store", "They do not need nutrients"] },
           { q: "Which is a characteristic of non-living things?", a: "They do not grow on their own", options: ["They breathe air", "They do not grow on their own", "They have babies", "They react to touch"] },
           { q: "Is water living or non-living?", a: "Non-living, because it does not breathe or grow", options: ["Living, because it moves", "Non-living, because it does not breathe or grow", "Living, because fish live in it", "Non-living, because it is blue"] },
           { q: "Living things 'respond' to their environment. An example of this is:", a: "A plant turning its leaves toward the light", options: ["A rock sitting in the sun", "A plant turning its leaves toward the light", "A ball rolling down a hill", "A car stopping at a red light"] },
           { q: "Which of these needs a shelter or a home?", a: "A Bear", options: ["A Mountain", "A Bear", "A River", "A Cloud"] },
           { q: "What happens to living things if they do not get what they need?", a: "They stop growing and may die", options: ["They turn into non-living things like rocks", "They stop growing and may die", "They get bigger", "They change color but stay healthy"] },
           { q: "Why is a robot considered non-living even though it can move and talk?", a: "It does not grow, breathe, or reproduce", options: ["It is too small", "It does not grow, breathe, or reproduce", "It is made of metal", "It needs a remote control"] },
           { q: "What do animals breathe out that plants use?", a: "Carbon Dioxide", options: ["Oxygen", "Carbon Dioxide", "Smoke", "Steam"] },
           { q: "Which of these is a living thing found in the ocean?", a: "Coral", options: ["Sand", "Coral", "Shells", "Salt"] },
           { q: "Non-living things can be moved by ____.", a: "Natural forces like wind and water", options: ["Their own legs", "Natural forces like wind and water", "Thinking about moving", "Growing toward the sun"] },
           { q: "Which group contains ONLY living things?", a: "Cat, Rose, Spider", options: ["Cat, Rose, Spider", "Rock, Paper, Scissors", "Sun, Moon, Stars", "Car, Bus, Plane"] },
           { q: "A seed is considered ____.", a: "Living, because it can grow into a plant", options: ["Non-living", "Living, because it can grow into a plant", "Dead", "A rock"] },
           { q: "What do we call the tiny building blocks that all living things are made of?", a: "Cells", options: ["Bricks", "Cells", "Dust", "Atoms"] },
           { q: "Which of these is a basic need of a non-living thing?", a: "None of the above", options: ["Food", "Water", "Sunlight", "None of the above"] }
       ];

       let currentIdx = 0;
       let score = 0;
       let userResults = [];

       function shuffleArray(array) {
           for (let i = array.length - 1; i > 0; i--) {
               const j = Math.floor(Math.random() * (i + 1));
               [array[i], array[j]] = [array[j], array[i]];
           }
       }

       function initializeQuiz() {
           shuffleArray(quizData);
           loadQuestion();
       }

       function loadQuestion() {
           const current = quizData[currentIdx];
           document.getElementById("question-text").innerText = current.q;
           const optionsDiv = document.getElementById("options");
           optionsDiv.innerHTML = "";
           document.getElementById("feedback").innerText = "";
           document.getElementById("next-button").style.display = "none";

           current.options.forEach(opt => {
               const btn = document.createElement("button");
               btn.innerText = opt;
               btn.className = "option-btn";
               btn.onclick = () => checkAnswer(opt);
               optionsDiv.appendChild(btn);
           });
       }

       function checkAnswer(selected) {
           const current = quizData[currentIdx];
           const feedback = document.getElementById("feedback");
           const btns = document.querySelectorAll(".option-btn");
           btns.forEach(b => b.disabled = true);

           if (selected === current.a) {
               feedback.innerText = "Correct!";
               feedback.className = "feedback correct";
               score++;
               userResults.push({ q: current.q, res: "Correct", class: "correct" });
           } else {
               feedback.innerText = "The correct answer was: " + current.a;
               feedback.className = "feedback wrong";
               userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
           }
           document.getElementById("next-button").style.display = "block";
       }

       function loadNextQuestion() {
           currentIdx++;
           if (currentIdx < quizData.length) {
               loadQuestion();
           } else {
               showSummary();
           }
       }

       function showSummary() {
           document.getElementById("quiz-box").classList.add("hidden");
           const summaryBox = document.getElementById("summary-box");
           summaryBox.classList.remove("hidden");
           const list = document.getElementById("results-list");
           list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
           userResults.forEach(item => {
               const div = document.createElement("div");
               div.className = "summary-item";
               div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
               list.appendChild(div);
           });
       }

       initializeQuiz();
   </script>
</body>
</html>
