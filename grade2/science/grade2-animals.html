<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animals Quiz - Study Buddy</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .quiz-container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 500px; text-align: center; }
        h2 { color: #667eea; }
        .options-container { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
        .option-btn { padding: 12px; border: 2px solid #ddd; border-radius: 8px; background: white; cursor: pointer; font-size: 1.1rem; transition: 0.2s; }
        .option-btn:hover { border-color: #667eea; background: #f0f2ff; }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #28a745; }
        .wrong { color: #dc3545; }
        .next-btn { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; display: none; margin: 0 auto; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <h2 id="question-text">Question</h2>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">Try Again</button>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade2-science-topics.html'">Back to Topics</button>
    </div>

    <script>
        const quizData = [
            { q: "What do fish use to breathe underwater?", a: "Gills", options: ["Lungs", "Gills", "Noses"] },
            { q: "Which animal group has feathers and lays eggs?", a: "Birds", options: ["Mammals", "Birds", "Reptiles"] },
            { q: "What is an animal with a backbone called?", a: "Vertebrate", options: ["Invertebrate", "Vertebrate", "Insect"] },
            { q: "What does a carnivore eat?", a: "Only meat", options: ["Only plants", "Only meat", "Both plants and meat"] },
            { q: "Which animal group has cold blood and dry, scaly skin?", a: "Reptiles", options: ["Amphibians", "Reptiles", "Mammals"] },
            { q: "What is it called when an animal sleeps through the cold winter?", a: "Hibernation", options: ["Migration", "Hibernation", "Evolution"] },
            { q: "Where does a camel live?", a: "The desert", options: ["The ocean", "The desert", "The rainforest"] },
            { q: "How many legs does an insect have?", a: "6", options: ["4", "6", "8"] },
            { q: "What is a 'habitat'?", a: "An animal's home", options: ["An animal's home", "An animal's name", "A type of food"] },
            { q: "Which animal lives in the Arctic Tundra?", a: "Polar Bear", options: ["Lion", "Polar Bear", "Monkey"] },
            { q: "What is it called when an animal blends in with its environment?", a: "Camouflage", options: ["Camouflage", "Communication", "Adaptation"] },
            { q: "Which group of animals feeds their babies milk?", a: "Mammals", options: ["Fish", "Mammals", "Insects"] },
            { q: "A tadpole grows up to be a...", a: "Frog", options: ["Fish", "Frog", "Lizard"] },
            { q: "What do herbivores eat?", a: "Plants", options: ["Plants", "Meat", "Rocks"] },
            { q: "Which animal is an invertebrate (no backbone)?", a: "Butterfly", options: ["Dog", "Butterfly", "Snake"] },
            { q: "Why do birds migrate south in the winter?", a: "To find food and warmth", options: ["To play", "To find food and warmth", "To learn to fly"] },
            { q: "What is the hard outer shell of an insect called?", a: "Exoskeleton", options: ["Backbone", "Exoskeleton", "Fur"] },
            { q: "Which animal group spends half its life in water and half on land?", a: "Amphibians", options: ["Amphibians", "Birds", "Reptiles"] },
            { q: "What is a 'predator'?", a: "An animal that hunts other animals", options: ["An animal that is eaten", "An animal that hunts other animals", "A plant eater"] },
            { q: "Which of these is a nocturnal animal?", a: "Owl", options: ["Squirrel", "Owl", "Horse"] }
        ];

        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function ensureTryAgainButton() {
            const summaryBox = document.getElementById("summary-box");
            if (summaryBox && !summaryBox.querySelector('button[onclick="location.reload()"]')) {
                const button = document.createElement('button');
                button.className = 'next-btn';
                button.style.display = 'block';
                button.style.marginTop = '20px';
                button.innerText = 'Try Again';
                button.onclick = function() { location.reload(); };
                const backButton = summaryBox.querySelector('button[onclick^="location.href"]');
                summaryBox.insertBefore(button, backButton || null);
            }
        }

        function initializeQuiz() {
            shuffleArray(quizData);
            loadQuestion();
        }

        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = current.q;
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";

            current.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            
            // Disable buttons after answer
            btns.forEach(b => b.disabled = true);

            if (selected === current.a) {
                feedback.innerText = "Correct! Well done.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "Oops! The correct answer was " + current.a;
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            const summaryBox = document.getElementById("summary-box");
            summaryBox.classList.remove("hidden");
            ensureTryAgainButton();
            
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
            
            userResults.forEach(item => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
        }

        // Start the quiz
        initializeQuiz();
    </script>
</body>
</html>
