<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Rainforest Dart Frog Science - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
   <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #e3f7f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #0f6f63;
        }
        h2 { font-family: 'Fredoka', cursive; color: #0d4d4b; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice, .option-btn, .back-link {
            transition: all 0.2s;
        }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #f0fffd;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #4db6ac;
            font-weight: 700;
        }
        .topic-link:hover, .choice:hover {
            background: #c7f1ec;
            transform: translateY(-2px);
            border-color: #0d4d4b;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #4db6ac;
            border-radius: 50px;
            background: white;
            color: #0d4d4b;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #c7f1ec; border-color: #0d4d4b; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #0d4d4b;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #0d4d4b 0%, #4db6ac 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #b2dfdb; }
        .hidden { display: none; }
</style>
</head>
<body>

   <div class="quiz-container" id="quiz-box">
        <h2>🐸 Dart Frog Science</h2>
       <h2 id="question-text">Question</h2>
       <div class="options-container" id="options"></div>
       <div id="feedback" class="feedback"></div>
       <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
   </div>

   <div class="quiz-container hidden" id="summary-box">
       <h2>Quiz Complete!</h2>
       <div id="results-list"></div>
       <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">Try Again</button>
       <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade2-science-topics.html'">Back to Dart Frog Science Topics</button>
   </div>

   <script>
       const quizData = [
           { q: "What do all animals need to survive?", a: "Food, water, air, and shelter", options: ["Food, water, air, and shelter", "Toys, beds, and television", "Soda, candy, and backpacks", "Shoes and hats"] },
           { q: "A camel is best suited to live in which habitat?", a: "The Desert", options: ["The Ocean", "The Desert", "The Rainforest", "The Tundra"] },
           { q: "What is a physical characteristic that all birds share?", a: "They all have feathers", options: ["They all have gills", "They all have feathers", "They all have fur", "They all have four legs"] },
           { q: "A fish breathes underwater using special parts called ____.", a: "Gills", options: ["Lungs", "Gills", "Fins", "Scales"] },
           { q: "Which group of animals feeds its babies milk and usually has hair or fur?", a: "Mammals", options: ["Reptiles", "Birds", "Mammals", "Fish"] },
           { q: "What do we call the place where an animal naturally lives and grows?", a: "A Habitat", options: ["A House", "A Habitat", "A Cage", "A City"] },
           { q: "An animal that only eats plants is called a(n) ____.", a: "Herbivore", options: ["Carnivore", "Herbivore", "Omnivore", "Predator"] },
           { q: "Which habitat is very cold, snowy, and found at the North and South Poles?", a: "The Tundra", options: ["The Savannah", "The Tundra", "The Desert", "The Forest"] },
           { q: "What is 'camouflage'?", a: "A way for animals to blend into their surroundings", options: ["A type of animal food", "A way for animals to blend into their surroundings", "The way an animal breathes", "A baby animal's name"] },
           { q: "Frogs and toads belong to which animal group?", a: "Amphibians", options: ["Mammals", "Amphibians", "Birds", "Insects"] },
           { q: "An animal that is hunted and eaten by another animal is called ____.", a: "The Prey", options: ["A Predator", "The Prey", "A Producer", "A Mammal"] },
           { q: "Which of these is a characteristic of a reptile?", a: "Dry, scaly skin", options: ["They have wet, slimy skin", "Dry, scaly skin", "They have feathers", "They breathe through gills"] },
           { q: "Why do some animals, like bears, hibernate in the winter?", a: "To save energy when food is hard to find", options: ["To play in the snow", "To save energy when food is hard to find", "To find new friends", "To grow more fur"] },
           { q: "Which habitat is underwater and filled with salt water?", a: "An Ocean", options: ["A Pond", "A Lake", "An Ocean", "A River"] },
           { q: "What do we call an animal that eats both plants and meat?", a: "Omnivore", options: ["Herbivore", "Carnivore", "Omnivore", "Insectivore"] },
           { q: "Insects have how many legs?", a: "6", options: ["4", "6", "8", "10"] },
           { q: "Which body part helps a bird or an airplane stay up in the air?", a: "Wings", options: ["Beak", "Wings", "Tail", "Claws"] },
           { q: "A 'nocturnal' animal is one that is ____.", a: "Active at night", options: ["Active during the day", "Active at night", "Always sleeping", "Very fast"] },
           { q: "What is the main reason a polar bear has a thick layer of blubber (fat)?", a: "To keep it warm in the cold", options: ["To help it swim faster", "To keep it warm in the cold", "To make it look scary", "To help it catch fish"] },
           { q: "Which of these animals would you most likely find in a rainforest?", a: "A Toucan", options: ["A Polar Bear", "A Toucan", "A Camel", "A Cow"] }
       ];

       let currentIdx = 0;
       let score = 0;
       let userResults = [];

       function shuffleArray(array) {
           for (let i = array.length - 1; i > 0; i--) {
               const j = Math.floor(Math.random() * (i + 1));
               [array[i], array[j]] = [array[j], array[i]];
           }
       }

       function initializeQuiz() {
           shuffleArray(quizData);
           loadQuestion();
       }

       function loadQuestion() {
           const current = quizData[currentIdx];
           document.getElementById("question-text").innerText = current.q;
           const optionsDiv = document.getElementById("options");
           optionsDiv.innerHTML = "";
           document.getElementById("feedback").innerText = "";
           document.getElementById("next-button").style.display = "none";

           current.options.forEach(opt => {
               const btn = document.createElement("button");
               btn.innerText = opt;
               btn.className = "option-btn";
               btn.onclick = () => checkAnswer(opt);
               optionsDiv.appendChild(btn);
           });
       }

       function checkAnswer(selected) {
           const current = quizData[currentIdx];
           const feedback = document.getElementById("feedback");
           const btns = document.querySelectorAll(".option-btn");
           btns.forEach(b => b.disabled = true);

           if (selected === current.a) {
               feedback.innerText = "Correct! Well done.";
               feedback.className = "feedback correct";
               score++;
               userResults.push({ q: current.q, res: "Correct", class: "correct" });
           } else {
               feedback.innerText = "Oops! The correct answer was " + current.a;
               feedback.className = "feedback wrong";
               userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
           }
           document.getElementById("next-button").style.display = "block";
       }

       function loadNextQuestion() {
           currentIdx++;
           if (currentIdx < quizData.length) {
               loadQuestion();
           } else {
               showSummary();
           }
       }

       function showSummary() {
           document.getElementById("quiz-box").classList.add("hidden");
           const summaryBox = document.getElementById("summary-box");
           summaryBox.classList.remove("hidden");
           const list = document.getElementById("results-list");
           list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
           userResults.forEach(item => {
               const div = document.createElement("div");
               div.className = "summary-item";
               div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
               list.appendChild(div);
           });
       }

       initializeQuiz();
   </script>
</body>
</html>
