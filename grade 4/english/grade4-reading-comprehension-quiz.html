<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 4 Reading & ELA Quiz - Study Buddy</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .quiz-container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 600px; }
        h2 { color: #667eea; text-align: center; }
        .progress-bar { background: #e0e0e0; height: 10px; border-radius: 5px; margin: 15px 0; overflow: hidden; }
        .progress-fill { background: #667eea; height: 100%; transition: width 0.3s; }
        .options-container { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
        .option-btn { padding: 12px; border: 2px solid #ddd; border-radius: 8px; background: white; cursor: pointer; text-align: left; font-size: 0.95rem; transition: 0.2s; }
        .option-btn:hover { border-color: #667eea; background: #f0f2ff; }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; text-align: center; }
        .correct { color: #28a745; }
        .wrong { color: #dc3545; }
        .next-btn { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; display: none; margin: 0 auto; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
        .hidden { display: none; }
        .round-indicator { text-align: center; color: #667eea; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <div class="round-indicator" id="round-indicator"></div>
        <h2 id="question-text">Question</h2>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="loadNewRound()">Try Again (New Round)</button>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade4-reading-topics.html'">Back to Topics</button>
    </div>

    <script>
        const allQuestions = [
            // Round 1: Questions 1-10
            { q: "The 'Main Idea' of a passage is best described as ____.", options: ["The very first sentence of the story", "A small piece of information about a character", "What the text is mostly or mainly about", "The name of the person who wrote the book"], a: "What the text is mostly or mainly about" },
            { q: "'Supporting Details' are important because they ____.", options: ["Are always more important than the main idea", "Provide evidence or examples that help explain the main idea", "Tell you the page number of the book", "Are only found in the table of contents"], a: "Provide evidence or examples that help explain the main idea" },
            { q: "A long, fictional story that is usually divided into chapters is called a ____.", options: ["Summary", "Poem", "Novel", "Bibliography"], a: "Novel" },
            { q: "'Nonfiction' writing is defined as text that is ____.", options: ["Based on imaginary characters and magical events", "Written to be funny but not true", "Based on facts, real events, and real people", "A story told entirely through rhyming words"], a: "Based on facts, real events, and real people" },
            { q: "What is a 'Summary'?", options: ["A very long version of a story with more details", "A short statement of the main points of a story or text", "The list of characters at the beginning of a play", "The opinion you have about a book"], a: "A short statement of the main points of a story or text" },
            { q: "In a story, the 'Theme' is ____.", options: ["The location where the story takes place", "The sequence of events that happens", "The underlying message or 'lesson' the author wants you to learn", "The dialogue between two characters"], a: "The underlying message or 'lesson' the author wants you to learn" },
            { q: "Which of these is an example of a 'Text Feature' often found in nonfiction?", options: ["A magic wand", "A talking animal", "A caption under a photograph", "A rhyme scheme"], a: "A caption under a photograph" },
            { q: "If you are 'Inferring' while reading, you are ____.", options: ["Reading the words as fast as you can", "Using clues from the text and your own knowledge to understand something not explicitly stated", "Copying the sentences exactly as they are written", "Skipping the hard parts of the chapter"], a: "Using clues from the text and your own knowledge to understand something not explicitly stated" },
            { q: "The 'Setting' of a story tells the reader ____.", options: ["Who the main characters are", "Why the characters are angry", "When and where the story takes place", "How the story ends"], a: "When and where the story takes place" },
            { q: "A 'Biography' is a book written about ____.", options: ["A person's life, written by a different person", "How to build a model airplane", "A fictional planet in the future", "A collection of jokes"], a: "A person's life, written by a different person" },
            // Round 2: Questions 11-20
            { q: "What is the 'Conflict' in a story?", options: ["The part where everyone is happy", "The main problem or struggle that the characters face", "The list of books the author has written", "The way the book smells"], a: "The main problem or struggle that the characters face" },
            { q: "'First-person point of view' means the story is being told by ____.", options: ["A narrator who is not in the story", "A character in the story using words like 'I' and 'me'", "The person who bought the book", "Many different people at the same time"], a: "A character in the story using words like 'I' and 'me'" },
            { q: "Which genre features gods, goddesses, and heroes, and often explains how things in nature began?", options: ["Science Fiction", "Mystery", "Myth", "Informational Text"], a: "Myth" },
            { q: "A 'Stanza' is a group of lines found in a ____.", options: ["Dictionary", "Poem", "Newspaper", "Map"], a: "Poem" },
            { q: "What is the 'Climax' of a story?", options: ["The very first page", "The most exciting part or the turning point of the plot", "The biography of the author", "The table of contents"], a: "The most exciting part or the turning point of the plot" },
            { q: "In nonfiction, an 'Index' helps you ____.", options: ["Find the definitions of words", "Find specific topics and the page numbers where they are located", "See what the author looks like", "Read the story in reverse"], a: "Find specific topics and the page numbers where they are located" },
            { q: "A 'Chronological' text structure organizes information ____.", options: ["By most important to least important", "In the order that events happened in time", "By comparing two different things", "By listing problems and their solutions"], a: "In the order that events happened in time" },
            { q: "What does the 'Resolution' of a story describe?", options: ["The beginning of the problem", "How the conflict or problem is solved at the end", "The middle of the book", "The author's favorite food"], a: "How the conflict or problem is solved at the end" },
            { q: "An 'Autobiography' is different from a Biography because ____.", options: ["It is much shorter", "It is written by the person the book is actually about", "It only contains pictures", "It is a work of fiction"], a: "It is written by the person the book is actually about" },
            { q: "The 'Tone' of a piece of writing refers to ____.", options: ["How loud the reader reads the words", "The author's attitude toward the subject", "The font size of the letters", "The number of pages in the book"], a: "The author's attitude toward the subject" }
        ];

        let currentRound = 1;
        let currentIdx = 0;
        let score = 0;
        let userResults = [];
        let quizData = [];

        function loadRound(roundNum) {
            const startIdx = (roundNum - 1) * 10;
            const endIdx = startIdx + 10;
            quizData = allQuestions.slice(startIdx, endIdx);
            currentIdx = 0;
            score = 0;
            userResults = [];
            document.getElementById("quiz-box").classList.remove("hidden");
            document.getElementById("summary-box").classList.add("hidden");
            document.getElementById("round-indicator").innerText = `Round ${roundNum}`;
            loadQuestion();
        }

        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = `Q${currentIdx + 1}: ${current.q}`;
            
            const progress = ((currentIdx + 1) / quizData.length) * 100;
            document.getElementById("progress-fill").style.width = progress + "%";
            
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";

            current.options.forEach((opt, idx) => {
                const btn = document.createElement("button");
                btn.innerText = String.fromCharCode(65 + idx) + ") " + opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            
            btns.forEach(b => b.disabled = true);

            if (selected === current.a) {
                feedback.innerText = "✓ Correct! Well done.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "✗ Oops! The correct answer was: " + current.a;
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            const summaryBox = document.getElementById("summary-box");
            summaryBox.classList.remove("hidden");
            
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Round ${currentRound} - Final Score: ${score}/10</h3>`;
            
            userResults.forEach((item, idx) => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>Q${idx + 1}: ${item.q}</strong><br/><span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
        }

        function loadNewRound() {
            currentRound++;
            if (currentRound <= 2) {
                loadRound(currentRound);
            } else {
                alert("No more rounds available. You've completed all questions!");
                location.href = "grade4-reading-topics.html";
            }
        }

        // Start with Round 1
        loadRound(1);
    </script>
</body>
</html>
