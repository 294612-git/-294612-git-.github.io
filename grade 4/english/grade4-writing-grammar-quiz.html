<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tundra Snowy Owls Reading - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fbfbf5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #c1c4b9;
        }
        h2 { font-family: 'Fredoka', cursive; color: #6f7464; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice, .option-btn, .back-link {
            transition: all 0.2s;
        }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #fcfcf8;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #d7d9c3;
            font-weight: 700;
        }
        .topic-link:hover, .choice:hover {
            background: #f5f6ec;
            transform: translateY(-2px);
            border-color: #6f7464;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #d7d9c3;
            border-radius: 50px;
            background: white;
            color: #6f7464;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #f5f6ec; border-color: #6f7464; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #6f7464;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #6f7464 0%, #d7d9c3 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #e7e8d9; }
        .hidden { display: none; }
</style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <h2>🦉 Snowy Owl Reading</h2>
        <div class="round-indicator" id="round-indicator"></div>
        <h2 id="question-text">Question</h2>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="loadNewRound()">Try Again (New Round)</button>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade4-reading-topics.html'">Back to 🦉 Snowy Owl Reading Topics</button>
    </div>

    <script>
        const allQuestions = [
            // Round 1: Questions 1-10
            { q: "Which of the following is a 'Run-on Sentence' that needs to be fixed?", options: ["Because the cake was still hot, we had to wait to eat it.", "The sun was setting behind the mountains it was a beautiful sight.", "After the long movie ended, everyone walked slowly to their cars.", "Do you want to go to the library, or would you rather go to the park?"], a: "The sun was setting behind the mountains it was a beautiful sight." },
            { q: "A 'Topic Sentence' is most effective when it ____.", options: ["Lists every single detail that will be in the paragraph", "Is the very last sentence of the entire essay", "Clearly states the main idea that the rest of the paragraph will support", "Only contains one or two words"], a: "Clearly states the main idea that the rest of the paragraph will support" },
            { q: "What is the 'Preposition' in the following sentence: 'The curious cat hid under the wooden porch.'?", options: ["Curious", "Hid", "Under", "Porch"], a: "Under" },
            { q: "Which sentence uses the correct punctuation for a list?", options: ["We need to buy bread milk eggs and butter at the store.", "We need to buy bread, milk, eggs, and butter at the store.", "We need to buy, bread milk eggs and butter, at the store.", "We need to buy bread milk, eggs and, butter at the store."], a: "We need to buy bread, milk, eggs, and butter at the store." },
            { q: "Which of these words is a 'Homophone' for the word Scent (as in a smell)?", options: ["Send", "Cent", "Scene", "Since"], a: "Cent" },
            { q: "In the sentence 'She quickly finished her project,' the word quickly is which part of speech?", options: ["Adjective", "Noun", "Adverb", "Conjunction"], a: "Adverb" },
            { q: "How should you combine these two sentences into one 'Compound Sentence'? I am very tired. I am going to stay up to finish my book.", options: ["I am very tired and I am going to stay up to finish my book.", "I am very tired, but I am going to stay up to finish my book.", "I am very tired because I am going to stay up to finish my book.", "I am very tired so I am going to stay up to finish my book."], a: "I am very tired, but I am going to stay up to finish my book." },
            { q: "Which of the following is an 'Abstract Noun' (something you cannot touch)?", options: ["Table", "Bravery", "Apple", "Dog"], a: "Bravery" },
            { q: "What is the 'Predicate' of the following sentence: 'The tall basketball player made a perfect shot.'?", options: ["The tall basketball player", "Made a perfect shot", "Basketball player", "Perfect shot"], a: "Made a perfect shot" },
            { q: "Which sentence uses 'Quotation Marks' correctly?", options: ["\"I can't wait for summer vacation! shouted Mark.\"", "\"I can't wait for summer vacation!\" shouted Mark.", "I can't wait for \"summer vacation!\" shouted Mark.", "I can't wait for summer vacation! \"shouted Mark.\""], a: "\"I can't wait for summer vacation!\" shouted Mark." },
            // Round 2: Questions 11-20
            { q: "Identify the 'Subject' in this sentence: 'Down by the river, the three bears searched for fish.'", options: ["Down by the river", "Searched for fish", "The three bears", "The fish"], a: "The three bears" },
            { q: "Which word is the 'Antonym' of Ancient?", options: ["Old", "Modern", "Dusty", "Historical"], a: "Modern" },
            { q: "Which sentence uses the possessive form correctly?", options: ["The three birds nests were high in the tree.", "The three birds's nests were high in the tree.", "The three birds' nests were high in the tree.", "The three bird's nests were high in the tree."], a: "The three birds' nests were high in the tree." },
            { q: "What is the 'Root Word' of Uncomfortable?", options: ["Un", "Comfort", "Table", "Able"], a: "Comfort" },
            { q: "Which of these is a 'Complex Sentence' (contains an independent and a dependent clause)?", options: ["I like pizza and I like tacos.", "Although it was cold, he did not wear a coat.", "The bird flew away.", "He ran, jumped, and climbed."], a: "Although it was cold, he did not wear a coat." },
            { q: "Which word should be used to complete this sentence correctly: 'Of the two brothers, Caleb is the ____.'?", options: ["Tallest", "Taller", "Most tall", "Tall"], a: "Taller" },
            { q: "What is the purpose of an 'Expository' piece of writing?", options: ["To tell a funny, made-up story", "To persuade someone to change their mind", "To inform or explain a topic to the reader", "To express the author's feelings through rhyming"], a: "To inform or explain a topic to the reader" },
            { q: "Which of these words is a 'Proper Adjective'?", options: ["American", "Happy", "Large", "Wooden"], a: "American" },
            { q: "What is wrong with this sentence? 'The pack of wolves were howling at the moon.'", options: ["It is missing a period.", "The word 'wolves' should be capitalized.", "The verb 'were' should be 'was' because the subject is the singular 'pack.'", "Nothing is wrong with it."], a: "The verb 'were' should be 'was' because the subject is the singular 'pack.'" },
            { q: "Which of these words is a 'Pronoun' that shows ownership?", options: ["Him", "They", "Mine", "Us"], a: "Mine" }
        ];

        let currentRound = 1;
        let currentIdx = 0;
        let score = 0;
        let userResults = [];
        let quizData = [];

        function loadRound(roundNum) {
            const startIdx = (roundNum - 1) * 10;
            const endIdx = startIdx + 10;
            quizData = allQuestions.slice(startIdx, endIdx);
            currentIdx = 0;
            score = 0;
            userResults = [];
            document.getElementById("quiz-box").classList.remove("hidden");
            document.getElementById("summary-box").classList.add("hidden");
            document.getElementById("round-indicator").innerText = `Round ${roundNum}`;
            loadQuestion();
        }

        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = `Q${currentIdx + 1}: ${current.q}`;
            
            const progress = ((currentIdx + 1) / quizData.length) * 100;
            document.getElementById("progress-fill").style.width = progress + "%";
            
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";

            current.options.forEach((opt, idx) => {
                const btn = document.createElement("button");
                btn.innerText = String.fromCharCode(65 + idx) + ") " + opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            
            btns.forEach(b => b.disabled = true);

            if (selected === current.a) {
                feedback.innerText = "✓ Correct! Well done.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "✗ Oops! The correct answer was: " + current.a;
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            const summaryBox = document.getElementById("summary-box");
            summaryBox.classList.remove("hidden");
            
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Round ${currentRound} - Final Score: ${score}/10</h3>`;
            
            userResults.forEach((item, idx) => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>Q${idx + 1}: ${item.q}</strong><br/><span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
        }

        function loadNewRound() {
            currentRound++;
            if (currentRound <= 2) {
                loadRound(currentRound);
            } else {
                alert("No more rounds available. You've completed all questions!");
                location.href = "grade4-reading-topics.html";
            }
        }

        // Start with Round 1
        loadRound(1);
    </script>
</body>
</html>
