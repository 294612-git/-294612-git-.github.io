<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tundra Penguin Science - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #ebf5fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #3b6b91;
        }
        h2 { font-family: 'Fredoka', cursive; color: #24466d; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice, .option-btn, .back-link {
            transition: all 0.2s;
        }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #f3f8fc;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #89abcd;
            font-weight: 700;
        }
        .topic-link:hover, .choice:hover {
            background: #d8eaf6;
            transform: translateY(-2px);
            border-color: #24466d;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #89abcd;
            border-radius: 50px;
            background: white;
            color: #24466d;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #d8eaf6; border-color: #24466d; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #24466d;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #24466d 0%, #89abcd 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #c7dfea; }
        .hidden { display: none; }
</style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <h2>🐧 Penguin Science</h2>
        <div class="round-indicator" id="round-indicator"></div>
        <h2 id="question-text">Question</h2>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="loadNewRound()">Try Again (New Round)</button>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade4-science-topics.html'">Back to 🐧 Penguin Science Topics</button>
    </div>

    <script>
        const allQuestions = [
            // Round 1: Questions 1-10
            { q: "When liquid water on Earth's surface is heated by the sun, it turns into an invisible gas called ____.", options: ["Liquid water", "Water vapor", "Nitrogen", "Ice crystals"], a: "Water vapor" },
            { q: "The process where water vapor cools down and turns back into tiny liquid water droplets to form clouds is called ____.", options: ["Evaporation", "Precipitation", "Condensation", "Collection"], a: "Condensation" },
            { q: "Rain, snow, sleet, and hail are all different forms of ____.", options: ["Evaporation", "Condensation", "Precipitation", "Transpiration"], a: "Precipitation" },
            { q: "The water cycle is a continuous process that repeats forever. What is the primary source of energy that keeps it moving?", options: ["The Moon's gravity", "The Sun", "The Wind", "Deep-sea volcanoes"], a: "The Sun" },
            { q: "When plants release water vapor into the air through their leaves, the process is specifically called ____.", options: ["Respiration", "Transpiration", "Condensation", "Sublimation"], a: "Transpiration" },
            { q: "Water that flows over the land and into streams, rivers, and eventually the ocean is known as ____.", options: ["Groundwater", "Runoff", "Infiltration", "Vapor"], a: "Runoff" },
            { q: "Where is most of the Earth's water 'collected' or stored?", options: ["In the clouds", "In underground caves", "In the oceans", "In the atmosphere"], a: "In the oceans" },
            { q: "Which state of matter is water in when it is in the form of 'water vapor'?", options: ["Solid", "Liquid", "Gas", "Plasma"], a: "Gas" },
            { q: "What must happen for condensation to occur in the atmosphere?", options: ["The air must get much hotter", "The water vapor must cool down", "The wind must stop blowing", "It must be nighttime"], a: "The water vapor must cool down" },
            { q: "Water that soaks into the soil and is stored in the cracks of rocks underground is called ____.", options: ["Runoff", "Groundwater", "Surface water", "Glacial water"], a: "Groundwater" },
            // Round 2: Questions 11-20
            { q: "Which form of precipitation happens when raindrops freeze into ice pellets before hitting the ground?", options: ["Snow", "Rain", "Sleet", "Fog"], a: "Sleet" },
            { q: "What role do 'Dust Particles' play in the water cycle?", options: ["They block the sun to keep the water cool", "They provide a surface for water vapor to condense onto to form clouds", "They make the rain turn into snow", "They have no role in the water cycle"], a: "They provide a surface for water vapor to condense onto to form clouds" },
            { q: "Why is the amount of water on Earth always about the same?", options: ["Because it rains every single day somewhere", "Because the water is constantly being recycled through the water cycle", "Because the oceans are too deep to dry up", "Because humans make new water in factories"], a: "Because the water is constantly being recycled through the water cycle" },
            { q: "Which of these would most likely increase the rate of evaporation from a lake?", options: ["A very cold, cloudy day", "A hot, sunny, and windy day", "A calm night with no wind", "Covering the lake with a giant tarp"], a: "A hot, sunny, and windy day" },
            { q: "What is a 'Glacier' in the context of the water cycle?", options: ["A type of heavy rain", "A huge mass of slowly moving ice that stores fresh water", "A cloud that touches the ground", "A very fast-moving river"], a: "A huge mass of slowly moving ice that stores fresh water" },
            { q: "When water vapor changes directly into ice crystals (like frost on a window), skipping the liquid stage, it is called ____.", options: ["Melting", "Freezing", "Deposition", "Evaporation"], a: "Deposition" },
            { q: "Which of these is the 'collection' part of the water cycle?", options: ["A puddle drying up in the sun", "Clouds getting heavy and dark", "Water pooling in a lake or ocean", "Steam rising from a hot cup of cocoa"], a: "Water pooling in a lake or ocean" },
            { q: "Clouds are made of ____.", options: ["Only gas", "Billions of tiny liquid water droplets or ice crystals", "Smoke from forest fires", "Pure oxygen"], a: "Billions of tiny liquid water droplets or ice crystals" },
            { q: "If the air temperature is below 32°F (0°C) all the way to the ground, precipitation will likely fall as ____.", options: ["Rain", "Snow", "Dew", "Fog"], a: "Snow" },
            { q: "Which of these moves water through the atmosphere?", options: ["Tectonic plates", "Wind and air currents", "The roots of trees", "The rotation of the Earth"], a: "Wind and air currents" }
        ];

        let currentRound = 1;
        let currentIdx = 0;
        let score = 0;
        let userResults = [];
        let quizData = [];

        function loadRound(roundNum) {
            const startIdx = (roundNum - 1) * 10;
            const endIdx = startIdx + 10;
            quizData = allQuestions.slice(startIdx, endIdx);
            currentIdx = 0;
            score = 0;
            userResults = [];
            document.getElementById("quiz-box").classList.remove("hidden");
            document.getElementById("summary-box").classList.add("hidden");
            document.getElementById("round-indicator").innerText = `Round ${roundNum}`;
            loadQuestion();
        }

        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = `Q${currentIdx + 1}: ${current.q}`;
            
            const progress = ((currentIdx + 1) / quizData.length) * 100;
            document.getElementById("progress-fill").style.width = progress + "%";
            
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";

            current.options.forEach((opt, idx) => {
                const btn = document.createElement("button");
                btn.innerText = String.fromCharCode(65 + idx) + ") " + opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            
            btns.forEach(b => b.disabled = true);

            if (selected === current.a) {
                feedback.innerText = "✓ Correct! Well done.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "✗ Oops! The correct answer was: " + current.a;
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            const summaryBox = document.getElementById("summary-box");
            summaryBox.classList.remove("hidden");
            
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Round ${currentRound} - Final Score: ${score}/10</h3>`;
            
            userResults.forEach((item, idx) => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>Q${idx + 1}: ${item.q}</strong><br/><span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
        }

        function loadNewRound() {
            currentRound++;
            if (currentRound <= 2) {
                loadRound(currentRound);
            } else {
                alert("No more rounds available. You've completed all questions!");
                location.href = "grade4-science-topics.html";
            }
        }

        // Start with Round 1
        loadRound(1);
    </script>
</body>
</html>
