<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tundra Penguin Science - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #ebf5fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #3b6b91;
        }
        h2 { font-family: 'Fredoka', cursive; color: #24466d; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice, .option-btn, .back-link {
            transition: all 0.2s;
        }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #f3f8fc;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #89abcd;
            font-weight: 700;
        }
        .topic-link:hover, .choice:hover {
            background: #d8eaf6;
            transform: translateY(-2px);
            border-color: #24466d;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #89abcd;
            border-radius: 50px;
            background: white;
            color: #24466d;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #d8eaf6; border-color: #24466d; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #24466d;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #24466d 0%, #89abcd 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #c7dfea; }
        .hidden { display: none; }
</style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <h2>🐧 Penguin Science</h2>
        <div class="round-indicator" id="round-indicator"></div>
        <h2 id="question-text">Question</h2>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">Try Again</button>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade4-science-topics.html'">Back to 🐧 Penguin Science Topics</button>
    </div>

    <script>
        const allQuestions = [
            // Round 1: Questions 1-10
            { q: "Which of these is the best example of 'Potential Energy' being converted into 'Kinetic Energy'?", options: ["A battery sitting in a drawer", "A sledder standing still at the very top of a snowy hill", "A rollercoaster car as it begins to drop down the first big hill", "A lightbulb glowing in a dark room"], a: "A rollercoaster car as it begins to drop down the first big hill" },
            { q: "In a 'Series Circuit,' if one lightbulb burns out or is removed, what happens to the other bulbs?", options: ["They get much brighter", "They stay lit exactly as they were", "They all go out because the path is broken", "They start to blink on and off"], a: "They all go out because the path is broken" },
            { q: "When you use a battery-operated radio, what is the correct 'Energy Transformation' taking place?", options: ["Electrical to Light to Sound", "Chemical (in the battery) to Electrical to Sound", "Kinetic to Potential to Electrical", "Sound to Thermal to Chemical"], a: "Chemical (in the battery) to Electrical to Sound" },
            { q: "Which of these energy sources is considered 'Renewable' because it will never run out?", options: ["Natural Gas", "Petroleum (Oil)", "Geothermal energy (heat from inside the Earth)", "Coal"], a: "Geothermal energy (heat from inside the Earth)" },
            { q: "A 'Closed Circuit' is a circuit where ____.", options: ["The switch is off and the electricity cannot flow", "The path is complete and the electricity flows freely", "The wires are made of plastic", "There is no battery attached"], a: "The path is complete and the electricity flows freely" },
            { q: "Why are electrical wires usually covered in plastic or rubber?", options: ["To make the electricity move faster", "Because plastic is a good conductor", "Because those materials are insulators that keep the electricity inside the wire", "To keep the wires from getting too cold"], a: "Because those materials are insulators that keep the electricity inside the wire" },
            { q: "What happens to the kinetic energy of a moving car if it increases its speed?", options: ["The kinetic energy decreases", "The kinetic energy stays exactly the same", "The kinetic energy increases", "The kinetic energy turns into potential energy"], a: "The kinetic energy increases" },
            { q: "A hydroelectric dam creates electricity by using ____.", options: ["The potential energy of still water", "The kinetic energy of falling or flowing water", "The chemical energy of fish in the river", "The heat of the sun on the water's surface"], a: "The kinetic energy of falling or flowing water" },
            { q: "What kind of energy is produced when you strike a match?", options: ["Only light energy", "Chemical, thermal (heat), and light energy", "Only electrical energy", "Nuclear and sound energy"], a: "Chemical, thermal (heat), and light energy" },
            { q: "A 'Parallel Circuit' is different from a Series Circuit because ____.", options: ["It only uses one wire", "It has more than one path for the electricity to flow", "It cannot power more than one lightbulb", "It does not require a battery"], a: "It has more than one path for the electricity to flow" },
            // Round 2: Questions 11-20
            { q: "Which device is designed specifically to change electrical energy into 'Mechanical Energy' (motion)?", options: ["An electric fan", "A toaster", "A flashlight", "A heater"], a: "An electric fan" },
            { q: "What is 'Friction'?", options: ["A type of battery", "A force that resists motion and turns kinetic energy into heat", "The speed at which light travels", "A form of renewable energy"], a: "A force that resists motion and turns kinetic energy into heat" },
            { q: "In a flashlight, the energy stored in the battery is ____.", options: ["Radiant energy", "Chemical energy", "Sound energy", "Mechanical energy"], a: "Chemical energy" },
            { q: "If you hold a metal spoon in a cup of hot cocoa, the handle gets hot. This is an example of heat transfer by ____.", options: ["Insulation", "Conduction", "Reflection", "Vibration"], a: "Conduction" },
            { q: "Which of these is a 'Non-renewable' resource that took millions of years to form?", options: ["Biomass (wood/plants)", "Fossil Fuels (like oil and coal)", "Wind energy", "Solar energy"], a: "Fossil Fuels (like oil and coal)" },
            { q: "What is the 'Output' energy of a doorbell?", options: ["Light", "Motion", "Sound", "Chemical"], a: "Sound" },
            { q: "When energy is transferred from one object to another, what always happens?", options: ["Some energy is usually lost as heat", "The energy is destroyed", "The energy doubles in size", "The objects stop moving"], a: "Some energy is usually lost as heat" },
            { q: "A 'Switch' in a circuit acts as a ____.", options: ["Power source", "Bridge that can be opened or closed to control the flow", "Type of lightbulb", "Way to store electricity for later"], a: "Bridge that can be opened or closed to control the flow" },
            { q: "Static electricity (like the shock you get from a doorknob) is caused by ____.", options: ["A flow of electricity through a wire", "An imbalance of electrical charges on the surface of an object", "High temperatures in the room", "Magnetic pull from the North Pole"], a: "An imbalance of electrical charges on the surface of an object" },
            { q: "Which of these would most likely increase the 'Potential Energy' of an object?", options: ["Lowering it closer to the ground", "Moving it faster along the floor", "Raising it to a higher shelf", "Painting it a brighter color"], a: "Raising it to a higher shelf" }
        ];

        const questionPool = allQuestions;
        let quizData = [];
        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function shufflePool(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initializeQuiz() {
            quizData = shufflePool(questionPool.slice()).slice(0, 5);
            currentIdx = 0;
            score = 0;
            userResults = [];
            document.getElementById("quiz-box").classList.remove("hidden");
            document.getElementById("summary-box").classList.add("hidden");
            loadQuestion();
        }

        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = `Q${currentIdx + 1}: ${current.q}`;
            const progress = ((currentIdx + 1) / quizData.length) * 100;
            document.getElementById("progress-fill").style.width = progress + "%";
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";
            current.options.forEach((opt, idx) => {
                const btn = document.createElement("button");
                btn.innerText = String.fromCharCode(65 + idx) + ") " + opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            btns.forEach(b => b.disabled = true);
            if (selected === current.a) {
                feedback.innerText = "✓ Correct! Well done.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "✗ Oops! The correct answer was: " + current.a;
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            const summaryBox = document.getElementById("summary-box");
            summaryBox.classList.remove("hidden");
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
            userResults.forEach((item, idx) => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>Q${idx + 1}: ${item.q}</strong><br/><span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
        }

        initializeQuiz();
    </script>
</body>
</html>
