<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tundra Arctic Foxes Math - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #eef4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #7a9bb8;
        }
        h2 { font-family: 'Fredoka', cursive; color: #3d5b7a; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice, .option-btn, .back-link {
            transition: all 0.2s;
        }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #f6f9fc;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #9fbdd4;
            font-weight: 700;
        }
        .topic-link:hover, .choice:hover {
            background: #d9e8f2;
            transform: translateY(-2px);
            border-color: #3d5b7a;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #9fbdd4;
            border-radius: 50px;
            background: white;
            color: #3d5b7a;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #d9e8f2; border-color: #3d5b7a; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #3d5b7a;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #3d5b7a 0%, #9fbdd4 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #d6e6f0; }
        .hidden { display: none; }
</style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <h2>🦊 Arctic Fox Math</h2>
        <div class="round-indicator" id="round-indicator"></div>
        <h2 id="question-text">Question</h2>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">Try Again</button>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade4-math-topics.html'">Back to 🦊 Arctic Fox Math Topics</button>
    </div>

    <script>
        const allQuestions = [
            // Round 1: Questions 1-10
            { q: "What is 32 × 12?", options: ["348", "384", "364", "402"], a: "384" },
            { q: "Solve for the quotient: 156 ÷ 6.", options: ["24", "26", "28", "31"], a: "26" },
            { q: "What is 45 × 11?", options: ["495", "455", "505", "445"], a: "495" },
            { q: "If you divide 75 by 4, what is the remainder?", options: ["1", "2", "3", "0"], a: "3" },
            { q: "Which of these numbers is a 'Multiple' of both 4 and 6?", options: ["10", "12", "18", "20"], a: "12" },
            { q: "What is 14 × 15?", options: ["210", "190", "200", "225"], a: "210" },
            { q: "Solve: 800 ÷ 20.", options: ["4", "40", "400", "80"], a: "40" },
            { q: "A rectangle has an area of 108 square inches. If the length is 9 inches, what is the width?", options: ["10 inches", "11 inches", "12 inches", "13 inches"], a: "12 inches" },
            { q: "What is 25 × 25?", options: ["525", "600", "625", "650"], a: "625" },
            { q: "A baker has 53 cookies and wants to put them into boxes of 5. How many cookies will be left over?", options: ["1", "2", "3", "4"], a: "3" },
            // Round 2: Questions 11-20
            { q: "Find the product: 18 × 7.", options: ["116", "126", "136", "106"], a: "126" },
            { q: "Which of these is a 'Composite' number (has more than two factors)?", options: ["13", "17", "19", "21"], a: "21" },
            { q: "What is 3,000 ÷ 6?", options: ["50", "500", "5,000", "600"], a: "500" },
            { q: "Solve: 56 × 4.", options: ["224", "214", "204", "234"], a: "224" },
            { q: "If n × 7 = 91, what is the value of n?", options: ["11", "12", "13", "14"], a: "13" },
            { q: "What is the product of 12 and 12?", options: ["122", "144", "124", "132"], a: "144" },
            { q: "What is 168 ÷ 8?", options: ["21", "22", "23", "24"], a: "21" },
            { q: "Which estimate is closest to 49 × 21?", options: ["800", "1,000", "1,200", "1,500"], a: "1,000" },
            { q: "Calculate: 15 × 9.", options: ["125", "135", "145", "115"], a: "135" },
            { q: "What is 1,000 ÷ 8?", options: ["125", "150", "200", "250"], a: "125" }
        ];

        const questionPool = allQuestions;
        let quizData = [];
        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function shufflePool(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initializeQuiz() {
            quizData = shufflePool(questionPool.slice()).slice(0, 5);
            currentIdx = 0;
            score = 0;
            userResults = [];
            document.getElementById("quiz-box").classList.remove("hidden");
            document.getElementById("summary-box").classList.add("hidden");
            loadQuestion();
        }

        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = `Q${currentIdx + 1}: ${current.q}`;
            const progress = ((currentIdx + 1) / quizData.length) * 100;
            document.getElementById("progress-fill").style.width = progress + "%";
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";
            current.options.forEach((opt, idx) => {
                const btn = document.createElement("button");
                btn.innerText = String.fromCharCode(65 + idx) + ") " + opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            btns.forEach(b => b.disabled = true);
            if (selected === current.a) {
                feedback.innerText = "✓ Correct! Well done.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "✗ Oops! The correct answer was: " + current.a;
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            const summaryBox = document.getElementById("summary-box");
            summaryBox.classList.remove("hidden");
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
            userResults.forEach((item, idx) => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>Q${idx + 1}: ${item.q}</strong><br/><span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
        }

        initializeQuiz();
    </script>
</body>
</html>
