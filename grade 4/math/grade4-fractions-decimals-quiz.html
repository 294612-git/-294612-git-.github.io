<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 4 Fractions & Decimals Quiz - Study Buddy</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .quiz-container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 600px; }
        h2 { color: #667eea; text-align: center; }
        .progress-bar { background: #e0e0e0; height: 10px; border-radius: 5px; margin: 15px 0; overflow: hidden; }
        .progress-fill { background: #667eea; height: 100%; transition: width 0.3s; }
        .options-container { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
        .option-btn { padding: 12px; border: 2px solid #ddd; border-radius: 8px; background: white; cursor: pointer; text-align: left; font-size: 1rem; transition: 0.2s; }
        .option-btn:hover { border-color: #667eea; background: #f0f2ff; }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; text-align: center; }
        .correct { color: #28a745; }
        .wrong { color: #dc3545; }
        .next-btn { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; display: none; margin: 0 auto; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
        .hidden { display: none; }
        .round-indicator { text-align: center; color: #667eea; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <div class="round-indicator" id="round-indicator"></div>
        <h2 id="question-text">Question</h2>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="loadNewRound()">Try Again (New Round)</button>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade4-math-topics.html'">Back to Topics</button>
    </div>

    <script>
        const allQuestions = [
            // Round 1: Questions 1-10
            { q: "Which decimal is equal to the fraction 1/2?", options: ["0.2", "0.5", "0.8", "0.12"], a: "0.5" },
            { q: "What is the sum of 3/4 + 1/4?", options: ["4/8", "1 (or 4/4)", "2", "3/4"], a: "1 (or 4/4)" },
            { q: "Which number has the greatest value?", options: ["0.6", "0.56", "0.06", "0.49"], a: "0.6" },
            { q: "What is 1/3 of 9?", options: ["2", "3", "6", "1"], a: "3" },
            { q: "Which fraction is equivalent to 2/4?", options: ["1/3", "1/2", "3/4", "2/2"], a: "1/2" },
            { q: "What is 0.75 written as a fraction?", options: ["1/4", "1/2", "3/4", "7/5"], a: "3/4" },
            { q: "What is 5/10 + 20/100?", options: ["25/100", "7/10", "70/100", "25/10"], a: "70/100" },
            { q: "Which symbol makes this statement true? 0.4 ___ 0.39", options: ["< (Less than)", "> (Greater than)", "= (Equal to)"], a: "> (Greater than)" },
            { q: "If a pizza is cut into 8 slices and you eat 3, what fraction is left?", options: ["3/8", "5/8", "1/2", "8/3"], a: "5/8" },
            { q: "What is 1/10 written as a decimal?", options: ["0.01", "0.1", "1.0", "0.11"], a: "0.1" },
            // Round 2: Questions 11-20
            { q: "Which fraction is 'simplest form' for 6/12?", options: ["3/6", "1/2", "2/4", "6/12"], a: "1/2" },
            { q: "What is 2 and 3/10 written as a decimal?", options: ["0.23", "2.3", "2.03", "23.0"], a: "2.3" },
            { q: "Which is smaller, 1/4 or 1/8?", options: ["1/4", "1/8", "They are equal"], a: "1/8" },
            { q: "What is 10/12 - 4/12?", options: ["14/12", "6/12", "6/0", "1/2"], a: "6/12" },
            { q: "In the number 4.56, which digit is in the 'hundredths' place?", options: ["4", "5", "6", "None"], a: "6" },
            { q: "How many fourths make a whole?", options: ["2", "4", "1", "8"], a: "4" },
            { q: "What is 0.4 + 0.05?", options: ["0.9", "0.45", "0.54", "4.5"], a: "0.45" },
            { q: "Which of these is an 'improper' fraction (where the top is bigger than the bottom)?", options: ["1/2", "3/4", "5/2", "7/8"], a: "5/2" },
            { q: "What is 1/5 of 20?", options: ["4", "5", "10", "2"], a: "4" },
            { q: "If you have 0.50 cents, what fraction of a dollar do you have?", options: ["1/4", "1/2", "1/5", "1/10"], a: "1/2" }
        ];

        let currentRound = 1;
        let currentIdx = 0;
        let score = 0;
        let userResults = [];
        let quizData = [];

        function loadRound(roundNum) {
            const startIdx = (roundNum - 1) * 10;
            const endIdx = startIdx + 10;
            quizData = allQuestions.slice(startIdx, endIdx);
            currentIdx = 0;
            score = 0;
            userResults = [];
            document.getElementById("quiz-box").classList.remove("hidden");
            document.getElementById("summary-box").classList.add("hidden");
            document.getElementById("round-indicator").innerText = `Round ${roundNum}`;
            loadQuestion();
        }

        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = `Q${currentIdx + 1}: ${current.q}`;
            
            const progress = ((currentIdx + 1) / quizData.length) * 100;
            document.getElementById("progress-fill").style.width = progress + "%";
            
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";

            current.options.forEach((opt, idx) => {
                const btn = document.createElement("button");
                btn.innerText = String.fromCharCode(65 + idx) + ") " + opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            
            btns.forEach(b => b.disabled = true);

            if (selected === current.a) {
                feedback.innerText = "✓ Correct! Well done.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "✗ Oops! The correct answer was: " + current.a;
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            const summaryBox = document.getElementById("summary-box");
            summaryBox.classList.remove("hidden");
            
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Round ${currentRound} - Final Score: ${score}/10</h3>`;
            
            userResults.forEach((item, idx) => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>Q${idx + 1}: ${item.q}</strong><br/><span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
        }

        function loadNewRound() {
            currentRound++;
            if (currentRound <= 2) {
                loadRound(currentRound);
            } else {
                alert("No more rounds available. You've completed all questions!");
                location.href = "grade4-math-topics.html";
            }
        }

        // Start with Round 1
        loadRound(1);
    </script>
</body>
</html>
