<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tundra Polar Bears History - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f4f8fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #92a9be;
        }
        h2 { font-family: 'Fredoka', cursive; color: #546d8c; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice, .option-btn, .back-link {
            transition: all 0.2s;
        }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #fafcff;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #bbcddf;
            font-weight: 700;
        }
        .topic-link:hover, .choice:hover {
            background: #e7f0f7;
            transform: translateY(-2px);
            border-color: #546d8c;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #bbcddf;
            border-radius: 50px;
            background: white;
            color: #546d8c;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #e7f0f7; border-color: #546d8c; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #546d8c;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #546d8c 0%, #bbcddf 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #d9e5f1; }
        .hidden { display: none; }
</style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <h2>🐻 Polar Bear History</h2>
        <div class="round-indicator" id="round-indicator"></div>
        <h2 id="question-text">Question</h2>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">Try Again</button>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade4-history-topics.html'">Back to 🐻 Polar Bear History Topics</button>
    </div>

    <script>
        const allQuestions = [
            // Round 1: Questions 1-10
            { q: "The study of History is defined as the study of the ____.", options: ["Events that will happen in the next 100 years", "Past, including the people, events, and decisions that shaped the world", "Weather patterns found only in the mountains", "Way animals communicate with each other"], a: "Past, including the people, events, and decisions that shaped the world" },
            { q: "Why do historians believe it is important to study significant events from the past?", options: ["So that we can forget everything that happened before", "To learn from past mistakes and understand how our world was built", "Because the future is too boring to think about", "To prove that people in the past were not very smart"], a: "To learn from past mistakes and understand how our world was built" },
            { q: "A 'Primary Source' is a first-hand account or an original object. Which is a Primary Source?", options: ["A history textbook written in 2024", "A diary written by a soldier during the Revolutionary War", "A movie made last year about ancient Egypt", "An encyclopedia entry about the moon"], a: "A diary written by a soldier during the Revolutionary War" },
            { q: "What is a 'Secondary Source' in historical research?", options: ["A letter written by George Washington", "A photograph taken during a famous speech", "A book written by a modern researcher who studied many primary sources", "An arrowhead found in a field"], a: "A book written by a modern researcher who studied many primary sources" },
            { q: "In history, a 'Cause and Effect' relationship explains ____.", options: ["Why two things happened at the exact same time by accident", "How one event (the cause) led to another event happening", "How to tell the difference between a map and a globe", "Why people like to read stories about dragons"], a: "How one event (the cause) led to another event happening" },
            { q: "Which of these is an example of a 'Timeline'?", options: ["A list of vocabulary words and definitions", "A diagram that shows the order of events from oldest to newest", "A map that shows where the gold is hidden", "A drawing of a famous king or queen"], a: "A diagram that shows the order of events from oldest to newest" },
            { q: "The term 'B.C.E.' (Before Common Era) refers to dates that ____.", options: ["Happened after the year 2000", "Occurred before the year 1 on the standard calendar", "Are only used for science fiction stories", "Refer to the exact day a person was born"], a: "Occurred before the year 1 on the standard calendar" },
            { q: "What does it mean for a historian to be 'Biased'?", options: ["They have read every single book in the library", "They have a personal preference that might influence how they report history", "They only write about things that happen in winter", "They are experts at drawing maps"], a: "They have a personal preference that might influence how they report history" },
            { q: "An 'Oral History' is a type of historical record that is ____.", options: ["Carved into the side of a mountain", "Passed down through spoken stories and interviews from generation to generation", "Written in a secret code", "Found only in the ocean"], a: "Passed down through spoken stories and interviews from generation to generation" },
            { q: "What is 'Archaeology'?", options: ["The study of stars and planets", "The study of human history through the recovery and analysis of artifacts", "The study of how to bake bread", "The study of modern television shows"], a: "The study of human history through the recovery and analysis of artifacts" },
            // Round 2: Questions 11-20
            { q: "Which of these is an 'Artifact'?", options: ["A story someone made up yesterday", "An old clay pot used by people thousands of years ago", "A cloud in the sky", "The feeling of being tired"], a: "An old clay pot used by people thousands of years ago" },
            { q: "A 'Century' is a period of time that lasts ____.", options: ["10 years", "50 years", "100 years", "1,000 years"], a: "100 years" },
            { q: "When a historian looks at 'Perspective,' they are trying to understand ____.", options: ["How many pages are in a book", "How different people involved in an event might have seen it differently", "The exact temperature on the day an event happened", "The name of the person who discovered the artifact"], a: "How different people involved in an event might have seen it differently" },
            { q: "Which of these events would be considered a 'Turning Point' in history?", options: ["A person eating breakfast on a Tuesday", "The invention of the printing press, which allowed ideas to spread quickly", "A leaf falling off a tree in the forest", "A cat sleeping in the sun"], a: "The invention of the printing press, which allowed ideas to spread quickly" },
            { q: "What is a 'Heritage'?", options: ["A type of heavy stone", "The traditions, achievements, and beliefs that are part of the history of a group or nation", "A machine used to move dirt", "The speed at which a horse runs"], a: "The traditions, achievements, and beliefs that are part of the history of a group or nation" },
            { q: "Why do maps change over time throughout history?", options: ["Because the Earth's continents move hundreds of miles every day", "Because borders change due to wars, treaties, and the discovery of new information", "Because mapmakers get bored of looking at the same lines", "Because the ocean gets blue-er over time"], a: "Because borders change due to wars, treaties, and the discovery of new information" },
            { q: "Which term refers to a 10-year period?", options: ["Era", "Millennium", "Decade", "Score"], a: "Decade" },
            { q: "A 'Chronicle' is a historical account that ____.", options: ["Lists events in the order they happened", "Only lists the names of famous dogs", "Is written in invisible ink", "Is always 500 pages long"], a: "Lists events in the order they happened" },
            { q: "What is the purpose of a 'Museum'?", options: ["To sell toys and candy", "To collect, preserve, and display items of historical or artistic importance", "To provide a place for people to sleep", "To grow vegetables for the city"], a: "To collect, preserve, and display items of historical or artistic importance" },
            { q: "When studying a historical event, why is it important to look at multiple sources?", options: ["To make the homework take longer", "To get a more complete and accurate picture of what really happened", "Because the first book is usually wrong", "To see which author has the coolest name"], a: "To get a more complete and accurate picture of what really happened" }
        ];

        const questionPool = allQuestions;
        let quizData = [];
        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function shufflePool(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initializeQuiz() {
            quizData = shufflePool(questionPool.slice()).slice(0, 5);
            currentIdx = 0;
            score = 0;
            userResults = [];
            document.getElementById("quiz-box").classList.remove("hidden");
            document.getElementById("summary-box").classList.add("hidden");
            loadQuestion();
        }

        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = `Q${currentIdx + 1}: ${current.q}`;
            const progress = ((currentIdx + 1) / quizData.length) * 100;
            document.getElementById("progress-fill").style.width = progress + "%";
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";
            current.options.forEach((opt, idx) => {
                const btn = document.createElement("button");
                btn.innerText = String.fromCharCode(65 + idx) + ") " + opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            btns.forEach(b => b.disabled = true);
            if (selected === current.a) {
                feedback.innerText = "✓ Correct! Well done.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "✗ Oops! The correct answer was: " + current.a;
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            const summaryBox = document.getElementById("summary-box");
            summaryBox.classList.remove("hidden");
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
            userResults.forEach((item, idx) => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>Q${idx + 1}: ${item.q}</strong><br/><span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
        }

        initializeQuiz();
    </script>
</body>
</html>
