<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grasslands Prairie Dogs Math - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f7f2df;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #c7a25c;
        }
        h2 { font-family: 'Fredoka', cursive; color: #7a5a28; }
        .theme-sub { color: #d9b36c; font-weight: bold; margin-bottom: 1.5rem; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #fbf3e1;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #d9b36c;
            font-weight: 700;
            transition: all 0.2s;
        }
        .topic-link:hover, .choice:hover {
            background: #fff3d9;
            transform: translateY(-2px);
            border-color: #7a5a28;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #d9b36c;
            border-radius: 50px;
            background: white;
            color: #7a5a28;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #fff3d9; border-color: #7a5a28; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #7a5a28;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #7a5a28 0%, #d9b36c 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #f0e1b6; }
        .hidden { display: none; }
</style>
</head>
<body>
    <div class="quiz-container">
        <h1>Grade 5 Challenge Mode Math Quiz</h1>
        <div id="active-quiz">
            <div class="round-info" id="round-info">Round 1</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="question" id="question"></div>
            <ul class="options" id="options"></ul>
            <div class="feedback" id="feedback"></div>
        </div>
        <div class="summary" id="summary">
            <h2>Quiz Complete!</h2>
            <p id="final-score"></p>
            <p id="round-scores"></p>
            <a href="grade5-math-topics.html" class="back-link">Back to Math Topics</a>
        </div>
    </div>

    <script>
        const allQuestions = [
            { q: "A recipe requires 3/4 cup of sugar. If you want to make 2 and 1/2 times the recipe, how much sugar do you need in total?", options: ["A) 1 and 1/2 cups", "B) 1 and 7/8 cups", "C) 2 cups", "D) 1 and 3/4 cups"], a: 1 },
            { q: "Evaluate the expression: (4.5 + 2.5) x (10 - 7.2).", options: ["A) 19.6", "B) 21.4", "C) 28.0", "D) 14.8"], a: 0 },
            { q: "Subtract 2/3 from 4/5. What is the difference?", options: ["A) 2/15", "B) 2/2", "C) 6/15", "D) 1/5"], a: 0 },
            { q: "A rectangular prism has a length of 5 cm, a width of 3.2 cm, and a height of 2 cm. What is its volume?", options: ["A) 10.2 cubic cm", "B) 32.0 cubic cm", "C) 16.0 cubic cm", "D) 30.0 cubic cm"], a: 1 },
            { q: "Solve: 0.12 x 0.12.", options: ["A) 1.44", "B) 0.144", "C) 0.0144", "D) 0.00144"], a: 2 },
            { q: "What is the value of 1/5 divided by 4?", options: ["A) 4/5", "B) 1/20", "C) 20", "D) 5/4"], a: 1 },
            { q: "A store is having a 25% off sale. If a game originally cost 40 dollars, what is the sale price?", options: ["A) 10 dollars", "B) 30 dollars", "C) 25 dollars", "D) 35 dollars"], a: 1 },
            { q: "Solve for y: (y / 4) + 1.5 = 4.", options: ["A) 10", "B) 6", "C) 2.5", "D) 12"], a: 0 },
            { q: "Which of the following is equivalent to 10 to the power of 3?", options: ["A) 30", "B) 100", "C) 1,000", "D) 300"], a: 2 },
            { q: "A tank holds 12 gallons of water. If it leaks at a rate of 0.4 gallons per hour, how many hours will it take to be completely empty?", options: ["A) 3 hours", "B) 30 hours", "C) 48 hours", "D) 25 hours"], a: 1 },
            { q: "Find the sum of 1/2, 1/3, and 1/6.", options: ["A) 3/11", "B) 1", "C) 5/6", "D) 1/2"], a: 1 },
            { q: "Multiply: 15.6 x 0.5.", options: ["A) 7.8", "B) 7.3", "C) 31.2", "D) 8.1"], a: 0 },
            { q: "Round 0.985 to the nearest hundredth.", options: ["A) 0.98", "B) 0.99", "C) 1.00", "D) 0.90"], a: 1 },
            { q: "A rope is 9 feet long. If you cut it into pieces that are each 1/3 of a foot long, how many pieces will you have?", options: ["A) 3", "B) 18", "C) 27", "D) 12"], a: 2 },
            { q: "Solve: 100 x 0.045.", options: ["A) 450", "B) 4.5", "C) 0.45", "D) 45"], a: 1 },
            { q: "Which fraction is greater than 0.6 but less than 0.8?", options: ["A) 1/2", "B) 3/4", "C) 9/10", "D) 1/4"], a: 1 },
            { q: "Calculate: (1/2 x 1/2) + (1/2 x 1/2).", options: ["A) 1/4", "B) 1/2", "C) 1/8", "D) 1"], a: 1 },
            { q: "A car travels 135 miles on 4.5 gallons of gas. How many miles does it get per gallon?", options: ["A) 30", "B) 35", "C) 25", "D) 40"], a: 0 },
            { q: "What is 5 divided by 8, expressed as a decimal?", options: ["A) 0.58", "B) 0.625", "C) 0.75", "D) 0.5"], a: 1 },
            { q: "If you have a square with a perimeter of 4.8 meters, what is the length of one side?", options: ["A) 1.2 meters", "B) 2.4 meters", "C) 0.8 meters", "D) 1.1 meters"], a: 0 }
        ];

        let currentRound = 1;
        let currentQuestionIndex = 0;
        let userResults = [];
        let roundScores = [0, 0];

        function loadRound(round) {
            currentRound = round;
            currentQuestionIndex = (round - 1) * 10;
            document.getElementById('round-info').textContent = `Round ${round}`;
            loadQuestion();
        }

        function loadQuestion() {
            const question = allQuestions[currentQuestionIndex];
            document.getElementById('question').textContent = question.q;
            const optionsUl = document.getElementById('options');
            optionsUl.innerHTML = '';
            question.options.forEach((option, index) => {
                const li = document.createElement('li');
                const button = document.createElement('button');
                button.textContent = option;
                button.onclick = () => checkAnswer(index);
                li.appendChild(button);
                optionsUl.appendChild(li);
            });
            document.getElementById('feedback').style.display = 'none';
            updateProgress();
        }

        function checkAnswer(selectedIndex) {
            const correctIndex = allQuestions[currentQuestionIndex].a;
            const feedback = document.getElementById('feedback');
            if (selectedIndex === correctIndex) {
                feedback.textContent = 'Correct!';
                feedback.className = 'feedback correct';
                roundScores[currentRound - 1]++;
            } else {
                feedback.textContent = `Wrong! The correct answer is: ${allQuestions[currentQuestionIndex].options[correctIndex]}`;
                feedback.className = 'feedback wrong';
            }
            feedback.style.display = 'block';
            userResults.push(selectedIndex === correctIndex);
            setTimeout(() => {
                nextQuestion();
            }, 2000);
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < allQuestions.length) {
                if (currentQuestionIndex % 10 === 0) {
                    // End of round
                    if (currentRound < 2) {
                        loadRound(currentRound + 1);
                    } else {
                        showSummary();
                    }
                } else {
                    loadQuestion();
                }
            } else {
                showSummary();
            }
        }

        function updateProgress() {
            const progress = ((currentQuestionIndex % 10) + 1) / 10 * 100;
            document.getElementById('progress-fill').style.width = progress + '%';
        }

        function showSummary() {
            document.getElementById('active-quiz').style.display = 'none';
            document.getElementById('summary').style.display = 'block';
            const totalCorrect = roundScores[0] + roundScores[1];
            document.getElementById('final-score').textContent = `You got ${totalCorrect} out of 20 questions correct.`;
            document.getElementById('round-scores').textContent = `Round 1: ${roundScores[0]}/10, Round 2: ${roundScores[1]}/10`;
        }

        loadRound(1);
    </script>
</body>
</html>
