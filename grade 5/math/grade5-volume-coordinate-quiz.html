<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grasslands Prairie Dogs Math - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f7f2df;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #c7a25c;
        }
        h2 { font-family: 'Fredoka', cursive; color: #7a5a28; }
        .theme-sub { color: #d9b36c; font-weight: bold; margin-bottom: 1.5rem; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #fbf3e1;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #d9b36c;
            font-weight: 700;
            transition: all 0.2s;
        }
        .topic-link:hover, .choice:hover {
            background: #fff3d9;
            transform: translateY(-2px);
            border-color: #7a5a28;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #d9b36c;
            border-radius: 50px;
            background: white;
            color: #7a5a28;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #fff3d9; border-color: #7a5a28; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #7a5a28;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #7a5a28 0%, #d9b36c 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #f0e1b6; }
        .hidden { display: none; }
</style>
</head>
<body>
    <div class="quiz-container">
        <h1>Grade 5 Advanced: Volume & Coordinate Geometry Quiz</h1>
        <div id="active-quiz">
            <div class="round-info" id="round-info">Round 1</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="question" id="question"></div>
            <ul class="options" id="options"></ul>
            <div class="feedback" id="feedback"></div>
        </div>
        <div class="summary" id="summary">
            <h2>Quiz Complete!</h2>
            <p id="final-score"></p>
            <p id="round-scores"></p>
            <a href="grade5-math-topics.html" class="back-link">Back to Math Topics</a>
        </div>
    </div>

    <script>
        const allQuestions = [
            { q: "To find the volume of a rectangular prism (a 3D box), you use the formula: Volume = (blank) x width x height. What is the missing dimension?", options: ["A) Area", "B) Perimeter", "C) Length", "D) Weight"], a: 2 },
            { q: "Calculate the volume of a storage box with the following dimensions: length = 2 units, width = 3 units, and height = 4 units.", options: ["A) 9 cubic units", "B) 12 cubic units", "C) 20 cubic units", "D) 24 cubic units"], a: 3 },
            { q: "A coordinate graph (grid) is used to show exact locations. What are the names of the two lines used to measure these locations?", options: ["A) The North and South poles", "B) The X-axis and the Y-axis", "C) The Length and the Width", "D) The Top and the Bottom"], a: 1 },
            { q: "In an ordered pair like (3, 4), what does the first number (3) tell you to do on the graph?", options: ["A) Move up 3 spaces from the origin (0,0)", "B) Move to the right 3 spaces from the origin (0,0)", "C) Move to the left 3 spaces from the origin (0,0)", "D) Stay at the center"], a: 1 },
            { q: "Which of the following best describes \"Volume\"?", options: ["A) The distance around the outside of a shape", "B) The amount of space inside a 3D object", "C) The number of squares needed to cover a flat surface", "D) How much an object weighs on a scale"], a: 1 },
            { q: "If a cube has a side length of 5 cm, what is its total volume?", options: ["A) 15 cubic cm", "B) 25 cubic cm", "C) 125 cubic cm", "D) 150 cubic cm"], a: 2 },
            { q: "On a coordinate plane, the point where the X-axis and Y-axis meet (0, 0) is called the:", options: ["A) Destination", "B) Corner", "C) Origin", "D) Vertex"], a: 2 },
            { q: "A rectangular prism has a volume of 60 cubic inches. If the length is 5 inches and the width is 3 inches, what is the height?", options: ["A) 4 inches", "B) 10 inches", "C) 15 inches", "D) 2 inches"], a: 0 },
            { q: "To plot the point (2, 5), you would start at the origin and move:", options: ["A) Up 2, then right 5", "B) Right 2, then up 5", "C) Right 5, then up 2", "D) Left 2, then down 5"], a: 1 },
            { q: "A \"unit cube\" is a cube where each side measures 1 unit. How many unit cubes would fit inside a box that is 4 units long, 2 units wide, and 2 units high?", options: ["A) 8", "B) 16", "C) 12", "D) 32"], a: 1 },
            { q: "Which axis on a coordinate graph is the vertical line (going up and down)?", options: ["A) The X-axis", "B) The Y-axis", "C) The Z-axis", "D) The Main-axis"], a: 1 },
            { q: "If you move 6 units to the right and 0 units up, what is your ordered pair?", options: ["A) (0, 6)", "B) (6, 0)", "C) (6, 6)", "D) (1, 6)"], a: 1 },
            { q: "A flat shape (2D) has area. A solid shape (3D) has volume. Which units are used to measure volume?", options: ["A) Square units", "B) Linear units", "C) Cubic units", "D) Liquid units"], a: 2 },
            { q: "If the volume of a box is 100 cubic cm and the area of its base (length x width) is 20 square cm, what is the height?", options: ["A) 80 cm", "B) 5 cm", "C) 10 cm", "D) 200 cm"], a: 1 },
            { q: "In the ordered pair (7, 2), which number represents the \"y-coordinate\"?", options: ["A) 7", "B) 2", "C) 9", "D) 0"], a: 1 },
            { q: "A swimming pool is 10 meters long, 5 meters wide, and 2 meters deep. How much water can it hold?", options: ["A) 17 cubic meters", "B) 50 cubic meters", "C) 100 cubic meters", "D) 200 cubic meters"], a: 2 },
            { q: "Which point is further to the right on a coordinate grid: (5, 2) or (2, 5)?", options: ["A) (5, 2)", "B) (2, 5)", "C) They are the same distance to the right", "D) Neither is to the right"], a: 0 },
            { q: "If you double the height of a box but keep the length and width the same, what happens to the volume?", options: ["A) The volume stays the same", "B) The volume triples", "C) The volume doubles", "D) The volume is cut in half"], a: 2 },
            { q: "What is the volume of a rectangular prism with a base area of 15 square inches and a height of 10 inches?", options: ["A) 25 cubic inches", "B) 150 cubic inches", "C) 50 cubic inches", "D) 1.5 cubic inches"], a: 1 },
            { q: "To move from (1, 1) to (4, 1) on a graph, you would move:", options: ["A) 3 units up", "B) 3 units to the right", "C) 4 units to the right", "D) 1 unit up"], a: 1 }
        ];

        const questionPool = allQuestions;
        let quizData = [];
        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function shufflePool(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initializeQuiz() {
            quizData = shufflePool(questionPool.slice()).slice(0, 5);
            currentIdx = 0;
            score = 0;
            userResults = [];
            document.getElementById('active-quiz').style.display = 'block';
            document.getElementById('summary').style.display = 'none';
            document.getElementById('round-info').textContent = `Question 1 of ${quizData.length}`;
            loadQuestion();
        }

        function loadQuestion() {
            const question = quizData[currentIdx];
            document.getElementById('question').textContent = question.q;
            const optionsUl = document.getElementById('options');
            optionsUl.innerHTML = '';
            question.options.forEach((option, index) => {
                const li = document.createElement('li');
                const button = document.createElement('button');
                button.textContent = option;
                button.onclick = () => checkAnswer(index);
                li.appendChild(button);
                optionsUl.appendChild(li);
            });
            document.getElementById('feedback').style.display = 'none';
            updateProgress();
        }

        function checkAnswer(selectedIndex) {
            const current = quizData[currentIdx];
            const correctIndex = current.a;
            const feedback = document.getElementById('feedback');
            const buttons = document.querySelectorAll('#options button');
            buttons.forEach(btn => btn.disabled = true);
            if (selectedIndex === correctIndex) {
                feedback.textContent = 'Correct!';
                feedback.className = 'feedback correct';
                score++;
                userResults.push({ q: current.q, res: 'Correct', class: 'correct' });
            } else {
                feedback.textContent = `Wrong! The correct answer is: ${current.options[correctIndex]}`;
                feedback.className = 'feedback wrong';
                userResults.push({ q: current.q, res: `Wrong (Answer: ${current.options[correctIndex]})`, class: 'wrong' });
            }
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                document.getElementById('round-info').textContent = `Question ${currentIdx + 1} of ${quizData.length}`;
                loadQuestion();
                document.getElementById('next-btn').style.display = 'none';
            } else {
                showSummary();
            }
        }

        function updateProgress() {
            const percent = ((currentIdx + 1) / quizData.length) * 100;
            document.getElementById('progress-fill').style.width = `${percent}%`;
        }

        function showSummary() {
            document.getElementById('active-quiz').style.display = 'none';
            document.getElementById('summary').style.display = 'block';
            document.getElementById('final-score').textContent = `You got ${score} out of ${quizData.length} questions correct.`;
            document.getElementById('round-scores').textContent = '';
        }

        initializeQuiz();
    </script>
</body>
</html>
