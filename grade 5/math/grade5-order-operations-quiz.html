<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grasslands Prairie Dogs Math - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f7f2df;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #c7a25c;
        }
        h2 { font-family: 'Fredoka', cursive; color: #7a5a28; }
        .theme-sub { color: #d9b36c; font-weight: bold; margin-bottom: 1.5rem; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #fbf3e1;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #d9b36c;
            font-weight: 700;
            transition: all 0.2s;
        }
        .topic-link:hover, .choice:hover {
            background: #fff3d9;
            transform: translateY(-2px);
            border-color: #7a5a28;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #d9b36c;
            border-radius: 50px;
            background: white;
            color: #7a5a28;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #fff3d9; border-color: #7a5a28; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #7a5a28;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #7a5a28 0%, #d9b36c 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #f0e1b6; }
        .hidden { display: none; }
</style>
</head>
<body>
    <div class="quiz-container">
        <h1>Grade 5 Elite Math: Order of Operations & Logic Quiz</h1>
        <div id="active-quiz">
            <div class="round-info" id="round-info">Round 1</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="question" id="question"></div>
            <ul class="options" id="options"></ul>
            <div class="feedback" id="feedback"></div>
        </div>
        <div class="summary" id="summary">
            <h2>Quiz Complete!</h2>
            <p id="final-score"></p>
            <p id="round-scores"></p>
            <a href="grade5-math-topics.html" class="back-link">Back to Math Topics</a>
        </div>
    </div>

    <script>
        const allQuestions = [
            { q: "Solve for the final value: 100 - (4 + 6) x (12 / 3).", options: ["A) 360", "B) 60", "C) 80", "D) 90"], a: 1 },
            { q: "Calculate: (2.5 + 7.5) x (0.8 - 0.3) + 5.", options: ["A) 10", "B) 5.5", "C) 15", "D) 12"], a: 0 },
            { q: "What is the result of 1/2 of (40 + 60) divided by 5?", options: ["A) 10", "B) 25", "C) 50", "D) 100"], a: 0 },
            { q: "Solve: 9 + 6 x 4 - (10 / 2).", options: ["A) 55", "B) 28", "C) 31", "D) 25"], a: 1 },
            { q: "A baker has 5 trays of 24 cookies. After selling 80 cookies, he splits the remaining cookies into 4 bags. Which expression matches this?", options: ["A) 5 x 24 - 80 / 4", "B) (5 x 24 - 80) / 4", "C) 80 - 5 x 24 / 4", "D) (5 + 24 - 80) / 4"], a: 1 },
            { q: "Evaluate: 12 + 48 / (6 x 2) + 1.", options: ["A) 6", "B) 17", "C) 21", "D) 13"], a: 1 },
            { q: "What is the value of (15 - 3) x (2 + 1) / 6?", options: ["A) 6", "B) 12", "C) 18", "D) 3"], a: 0 },
            { q: "Solve: 0.5 x (20 + 30) - 2.5.", options: ["A) 22.5", "B) 25.0", "C) 27.5", "D) 20.0"], a: 0 },
            { q: "If x = 10 and y = 2, find the value of: (x + y) x (x - y).", options: ["A) 20", "B) 100", "C) 96", "D) 80"], a: 2 },
            { q: "Calculate: 1/4 x 100 + 1/5 x 50.", options: ["A) 35", "B) 75", "C) 150", "D) 45"], a: 0 },
            { q: "Solve: 80 / (2 x 2 x 2) + 10.", options: ["A) 20", "B) 15", "C) 30", "D) 50"], a: 0 },
            { q: "What is 50 minus the product of 4 and 9, plus 6?", options: ["A) 20", "B) 8", "C) 14", "D) 25"], a: 2 },
            { q: "Solve: (1.2 + 0.8) x 5 - 3.", options: ["A) 7", "B) 10", "C) 4.5", "D) 9"], a: 0 },
            { q: "Find the value: 60 / 5 + (3 x 4) - 2.", options: ["A) 12", "B) 22", "C) 20", "D) 24"], a: 1 },
            { q: "Evaluate: (1/3 of 30) + (1/6 of 60).", options: ["A) 10", "B) 15", "C) 20", "D) 30"], a: 2 },
            { q: "Solve: 15 + (10 - 2) x 3 / 4.", options: ["A) 21", "B) 18", "C) 17", "D) 19"], a: 0 },
            { q: "What is (4 x 4) / (2 x 2) + 10?", options: ["A) 14", "B) 12", "C) 16", "D) 11"], a: 0 },
            { q: "Solve: 100 / 2 / 2 / 5.", options: ["A) 25", "B) 5", "C) 10", "D) 2"], a: 1 },
            { q: "If you multiply 8 by 5, subtract 10, and then divide by 6, what is the result?", options: ["A) 5", "B) 6", "C) 10", "D) 4"], a: 0 },
            { q: "Solve: (10 + 10 + 10) / (10 - 5 + 1).", options: ["A) 6", "B) 5", "C) 10", "D) 3"], a: 1 }
        ];

        const questionPool = allQuestions;
        let quizData = [];
        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function shufflePool(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initializeQuiz() {
            quizData = shufflePool(questionPool.slice()).slice(0, 5);
            currentIdx = 0;
            score = 0;
            userResults = [];
            document.getElementById('active-quiz').style.display = 'block';
            document.getElementById('summary').style.display = 'none';
            document.getElementById('round-info').textContent = `Question 1 of ${quizData.length}`;
            loadQuestion();
        }

        function loadQuestion() {
            const question = quizData[currentIdx];
            document.getElementById('question').textContent = question.q;
            const optionsUl = document.getElementById('options');
            optionsUl.innerHTML = '';
            question.options.forEach((option, index) => {
                const li = document.createElement('li');
                const button = document.createElement('button');
                button.textContent = option;
                button.onclick = () => checkAnswer(index);
                li.appendChild(button);
                optionsUl.appendChild(li);
            });
            document.getElementById('feedback').style.display = 'none';
            updateProgress();
        }

        function checkAnswer(selectedIndex) {
            const current = quizData[currentIdx];
            const correctIndex = current.a;
            const feedback = document.getElementById('feedback');
            const buttons = document.querySelectorAll('#options button');
            buttons.forEach(btn => btn.disabled = true);
            if (selectedIndex === correctIndex) {
                feedback.textContent = 'Correct!';
                feedback.className = 'feedback correct';
                score++;
                userResults.push({ q: current.q, res: 'Correct', class: 'correct' });
            } else {
                feedback.textContent = `Wrong! The correct answer is: ${current.options[correctIndex]}`;
                feedback.className = 'feedback wrong';
                userResults.push({ q: current.q, res: `Wrong (Answer: ${current.options[correctIndex]})`, class: 'wrong' });
            }
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                document.getElementById('round-info').textContent = `Question ${currentIdx + 1} of ${quizData.length}`;
                loadQuestion();
                document.getElementById('next-btn').style.display = 'none';
            } else {
                showSummary();
            }
        }

        function updateProgress() {
            const percent = ((currentIdx + 1) / quizData.length) * 100;
            document.getElementById('progress-fill').style.width = `${percent}%`;
        }

        function showSummary() {
            document.getElementById('active-quiz').style.display = 'none';
            document.getElementById('summary').style.display = 'block';
            document.getElementById('final-score').textContent = `You got ${score} out of ${quizData.length} questions correct.`;
            document.getElementById('round-scores').textContent = '';
        }

        initializeQuiz();
    </script>
</body>
</html>
