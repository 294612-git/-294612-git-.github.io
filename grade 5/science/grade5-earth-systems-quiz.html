<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grasslands Elephants Science - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #eef1f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #7b8a8f;
        }
        h2 { font-family: 'Fredoka', cursive; color: #4f6166; }
        .theme-sub { color: #a9b7bc; font-weight: bold; margin-bottom: 1.5rem; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #f7f9fa;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #a9b7bc;
            font-weight: 700;
            transition: all 0.2s;
        }
        .topic-link:hover, .choice:hover {
            background: #e6ecef;
            transform: translateY(-2px);
            border-color: #4f6166;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #a9b7bc;
            border-radius: 50px;
            background: white;
            color: #4f6166;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #e6ecef; border-color: #4f6166; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #4f6166;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #4f6166 0%, #a9b7bc 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #d9e2e5; }
        .hidden { display: none; }
</style>
</head>
<body>
    <div class="quiz-container">
        <h1>Grade 5 Elite: Earth Systems & The Solar System Quiz</h1>
        <div id="active-quiz">
            <div class="round-info" id="round-info">Round 1</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="question" id="question"></div>
            <ul class="options" id="options"></ul>
            <div class="feedback" id="feedback"></div>
        </div>
        <div class="summary" id="summary">
            <h2>Quiz Complete!</h2>
            <p id="final-score"></p>
            <p id="round-scores"></p>
            <a href="grade5-science-topics.html" class="back-link">Back to Science Topics</a>
        </div>
    </div>

    <script>
        const allQuestions = [
            { q: "The Water Cycle is a continuous process. Which specific part of the cycle is driven by gravity, pulling water from the atmosphere back down to the Earth's surface?", options: ["A) Evaporation", "B) Transpiration", "C) Precipitation", "D) Condensation"], a: 2 },
            { q: "Earth's \"Rotation\" on its axis takes approximately 24 hours. What is the primary result of this specific motion?", options: ["A) The change of the four seasons", "B) The cycle of day and night", "C) The phases of the moon", "D) The Earth's orbit around the sun"], a: 1 },
            { q: "The Sun is the center of our solar system. Scientifically, how is the Sun classified?", options: ["A) A giant gaseous planet", "B) A medium-sized yellow star", "C) A solid rock mass", "D) A moon that reflects light from other stars"], a: 1 },
            { q: "Earth is located at a specific distance from the Sun that allows liquid water to exist. What is Earth's position in order from the Sun?", options: ["A) 2nd planet", "B) 3rd planet", "C) 4th planet", "D) 5th planet"], a: 1 },
            { q: "Which of Earth's \"spheres\" includes all the water on the planet, including oceans, lakes, glaciers, and water vapor?", options: ["A) The Atmosphere", "B) The Geosphere", "C) The Hydrosphere", "D) The Biosphere"], a: 2 },
            { q: "Earth \"Revolves\" around the sun in an elliptical path. How long does one full revolution take, and what does it help cause?", options: ["A) 24 hours; causes day and night", "B) 28 days; causes moon phases", "C) 365.25 days; contributes to the changing seasons", "D) 100 years; causes climate change"], a: 2 },
            { q: "The Sun is made mostly of which two elements undergoing nuclear fusion?", options: ["A) Oxygen and Carbon", "B) Nitrogen and Iron", "C) Hydrogen and Helium", "D) Gold and Silver"], a: 2 },
            { q: "What causes the Earth to have different seasons (Summer, Winter, etc.) throughout the year?", options: ["A) The Earth getting closer and further from the sun", "B) The tilt of the Earth's axis as it revolves around the sun", "C) The clouds blocking the sun in the winter", "D) The sun cooling down every six months"], a: 1 },
            { q: "The Atmosphere is a mixture of gases. Which gas is the most abundant (plentiful) in Earth's atmosphere?", options: ["A) Oxygen", "B) Carbon Dioxide", "C) Nitrogen", "D) Argon"], a: 2 },
            { q: "Tides on Earth (the rise and fall of ocean levels) are primarily caused by the gravitational pull of which celestial body?", options: ["A) The Sun", "B) The Moon", "C) Mars", "D) Jupiter"], a: 1 },
            { q: "Which planet is known as the \"Red Planet\" due to the iron oxide (rust) on its surface?", options: ["A) Venus", "B) Mars", "C) Saturn", "D) Mercury"], a: 1 },
            { q: "A \"Solar Eclipse\" occurs when which object passes directly between the Earth and the Sun?", options: ["A) An asteroid", "B) The Moon", "C) Venus", "D) A comet"], a: 1 },
            { q: "What is the name for the layer of the Earth that consists of the crust and the very top part of the mantle?", options: ["A) The Core", "B) The Lithosphere", "C) The Stratosphere", "D) The Biosphere"], a: 1 },
            { q: "In the water cycle, what is \"Transpiration\"?", options: ["A) Water freezing into ice", "B) Plants releasing water vapor into the air through their leaves", "C) Saltwater turning into freshwater", "D) Rain turning into snow"], a: 1 },
            { q: "Which of the outer planets is famous for its large, visible system of rings made of ice and rock?", options: ["A) Neptune", "B) Jupiter", "C) Saturn", "D) Uranus"], a: 2 },
            { q: "What is the \"Ozone Layer\" and why is it important to Earth's systems?", options: ["A) A layer of water in the ocean that protects fish", "B) A layer in the atmosphere that absorbs harmful UV radiation from the sun", "C) A layer of soil where plants grow best", "D) A ring of rocks around the Earth"], a: 1 },
            { q: "Which type of rock is formed from the cooling and hardening of molten magma or lava?", options: ["A) Sedimentary", "B) Metamorphic", "C) Igneous", "D) Fossilized"], a: 2 },
            { q: "The \"Great Red Spot\" is a giant, spinning storm located on which planet?", options: ["A) Saturn", "B) Jupiter", "C) Mars", "D) Neptune"], a: 1 },
            { q: "What is \"Weathering\" in the context of Earth's surface?", options: ["A) The movement of rocks from one place to another", "B) The process of rocks being broken down into smaller pieces by wind, water, or ice", "C) The process of volcanoes erupting", "D) The way animals hide from the rain"], a: 1 },
            { q: "Why does the Moon appear to shine at night?", options: ["A) It is a small star that makes its own light", "B) It reflects light from the Sun", "C) It is made of glowing volcanic lava", "D) It reflects light from the Earth's city lights"], a: 1 }
        ];

        const questionPool = allQuestions;
        let quizData = [];
        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function shufflePool(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initializeQuiz() {
            quizData = shufflePool(questionPool.slice()).slice(0, 5);
            currentIdx = 0;
            score = 0;
            userResults = [];
            document.getElementById('active-quiz').style.display = 'block';
            document.getElementById('summary').style.display = 'none';
            document.getElementById('round-info').textContent = `Question 1 of ${quizData.length}`;
            loadQuestion();
        }

        function loadQuestion() {
            const question = quizData[currentIdx];
            document.getElementById('question').textContent = question.q;
            const optionsUl = document.getElementById('options');
            optionsUl.innerHTML = '';
            question.options.forEach((option, index) => {
                const li = document.createElement('li');
                const button = document.createElement('button');
                button.textContent = option;
                button.onclick = () => checkAnswer(index);
                li.appendChild(button);
                optionsUl.appendChild(li);
            });
            document.getElementById('feedback').style.display = 'none';
            updateProgress();
        }

        function checkAnswer(selectedIndex) {
            const current = quizData[currentIdx];
            const correctIndex = current.a;
            const feedback = document.getElementById('feedback');
            const buttons = document.querySelectorAll('#options button');
            buttons.forEach(btn => btn.disabled = true);
            if (selectedIndex === correctIndex) {
                feedback.textContent = 'Correct!';
                feedback.className = 'feedback correct';
                score++;
                userResults.push({ q: current.q, res: 'Correct', class: 'correct' });
            } else {
                feedback.textContent = `Wrong! The correct answer is: ${current.options[correctIndex]}`;
                feedback.className = 'feedback wrong';
                userResults.push({ q: current.q, res: `Wrong (Answer: ${current.options[correctIndex]})`, class: 'wrong' });
            }
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                document.getElementById('round-info').textContent = `Question ${currentIdx + 1} of ${quizData.length}`;
                loadQuestion();
                document.getElementById('next-btn').style.display = 'none';
            } else {
                showSummary();
            }
        }

        function updateProgress() {
            const percent = ((currentIdx + 1) / quizData.length) * 100;
            document.getElementById('progress-fill').style.width = `${percent}%`;
        }

        function showSummary() {
            document.getElementById('active-quiz').style.display = 'none';
            document.getElementById('summary').style.display = 'block';
            document.getElementById('final-score').textContent = `You got ${score} out of ${quizData.length} questions correct.`;
            document.getElementById('round-scores').textContent = '';
        }

        initializeQuiz();
    </script>
</body>
</html>
