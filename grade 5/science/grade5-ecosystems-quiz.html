<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grasslands Elephants Science - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #eef1f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #7b8a8f;
        }
        h2 { font-family: 'Fredoka', cursive; color: #4f6166; }
        .theme-sub { color: #a9b7bc; font-weight: bold; margin-bottom: 1.5rem; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #f7f9fa;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #a9b7bc;
            font-weight: 700;
            transition: all 0.2s;
        }
        .topic-link:hover, .choice:hover {
            background: #e6ecef;
            transform: translateY(-2px);
            border-color: #4f6166;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #a9b7bc;
            border-radius: 50px;
            background: white;
            color: #4f6166;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #e6ecef; border-color: #4f6166; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #4f6166;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #4f6166 0%, #a9b7bc 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #d9e2e5; }
        .hidden { display: none; }
</style>
</head>
<body>
    <div class="quiz-container">
        <h1>Grade 5 Elite: Ecosystems & Energy Flow Quiz</h1>
        <div id="active-quiz">
            <div class="round-info" id="round-info">Round 1</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="question" id="question"></div>
            <ul class="options" id="options"></ul>
            <div class="feedback" id="feedback"></div>
        </div>
        <div class="summary" id="summary">
            <h2>Quiz Complete!</h2>
            <p id="final-score"></p>
            <p id="round-scores"></p>
            <a href="grade5-science-topics.html" class="back-link">Back to Science Topics</a>
        </div>
    </div>

    <script>
        const allQuestions = [
            { q: "In every ecosystem, plants are classified as \"Producers.\" What is the primary process they use to create their own food (energy) from sunlight?", options: ["A) Respiration", "B) Photosynthesis", "C) Decomposition", "D) Consumption"], a: 1 },
            { q: "Animals cannot make their own food and must eat plants or other animals to survive. This makes them:", options: ["A) Producers", "B) Consumers", "C) Decomposers", "D) Abiotic factors"], a: 1 },
            { q: "Which group of organisms is responsible for breaking down dead plants and animals, returning vital nutrients back into the soil?", options: ["A) Herbivores", "B) Scavengers", "C) Decomposers (like fungi and bacteria)", "D) Apex Predators"], a: 2 },
            { q: "In a food chain, what happens to the amount of available energy as you move from the Producers up to the Tertiary Consumers?", options: ["A) The energy increases at each level", "B) The energy stays exactly the same", "C) The energy decreases significantly at each level", "D) The energy disappears instantly"], a: 2 },
            { q: "Which of the following is an \"Abiotic\" factor in an ecosystem (a non-living part that affects the environment)?", options: ["A) An oak tree", "B) A honeybee", "C) The temperature and sunlight", "D) A mushroom"], a: 2 },
            { q: "A \"Food Web\" is different from a \"Food Chain\" because a food web:", options: ["A) Only shows animals that live in the water", "B) Shows many overlapping and interconnected food chains in an ecosystem", "C) Shows only one path of energy", "D) Does not include producers"], a: 1 },
            { q: "An animal that eats only other animals is known as a:", options: ["A) Herbivore", "B) Omnivore", "C) Carnivore", "D) Producer"], a: 2 },
            { q: "If a disease wipes out the majority of the \"Primary Consumers\" (herbivores) in an ecosystem, what is the most likely effect on the \"Producers\"?", options: ["A) The producer population will decrease", "B) The producer population will increase because fewer animals are eating them", "C) The producers will turn into carnivores", "D) Nothing will change"], a: 1 },
            { q: "What is an \"Apex Predator\"?", options: ["A) An animal at the bottom of the food chain", "B) An animal at the very top of the food chain with no natural predators", "C) A plant that eats insects", "D) A decomposer that lives underwater"], a: 1 },
            { q: "In the energy pyramid, which level contains the most overall energy and the largest number of organisms?", options: ["A) Top Predators", "B) Secondary Consumers", "C) Producers (the base)", "D) Primary Consumers"], a: 2 },
            { q: "An \"Omnivore\" is an organism that survives by eating:", options: ["A) Only sunlight", "B) Only meat", "C) Only plants", "D) Both plants and animals"], a: 3 },
            { q: "Which of these is an example of a \"Biotic\" factor interacting with an \"Abiotic\" factor?", options: ["A) A wolf hunting a deer", "B) A plant using sunlight to grow", "C) A fungus growing on a dead log", "D) A fish eating a smaller fish"], a: 1 },
            { q: "What is a \"Niche\" in an ecosystem?", options: ["A) The physical place where an animal sleeps", "B) The specific role or \"job\" an organism has in its habitat", "C) A type of weather pattern", "D) The total number of animals in a forest"], a: 1 },
            { q: "Which organism would be considered a \"Primary Consumer\" in a meadow ecosystem?", options: ["A) A hawk", "B) A grasshopper", "C) A snake", "D) The grass"], a: 1 },
            { q: "Energy enters most ecosystems on Earth through:", options: ["A) Deep-sea vents", "B) Rainfall", "C) Sunlight", "D) Volcanic eruptions"], a: 2 },
            { q: "What is \"Competition\" in an ecosystem?", options: ["A) When two organisms work together to find food", "B) When organisms struggle for the same limited resources (like food, water, or space)", "C) When an animal goes to sleep for the winter", "D) When a plant loses its leaves"], a: 1 },
            { q: "A \"Parasite\" is an organism that:", options: ["A) Helps its host survive", "B) Lives on or in another organism and harms it to get food", "C) Makes food for other animals", "D) Breaks down rocks into soil"], a: 1 },
            { q: "Which of these would be a \"Secondary Consumer\" in a pond?", options: ["A) Algae", "B) A small fish that eats algae", "C) A large fish that eats the small fish", "D) A turtle eating a strawberry"], a: 2 },
            { q: "What happens to the \"Biomass\" (the total mass of living things) as you move up an energy pyramid?", options: ["A) It increases", "B) It decreases", "C) It stays the same", "D) It turns into gas"], a: 1 },
            { q: "Which of the following is a \"Symbiotic\" relationship where both organisms benefit (Mutualism)?", options: ["A) A tick drinking blood from a dog", "B) A bee pollinating a flower while getting nectar", "C) An owl catching a mouse", "D) A lion fighting a hyena for a zebra"], a: 1 }
        ];

        const questionPool = allQuestions;
        let quizData = [];
        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function shufflePool(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initializeQuiz() {
            quizData = shufflePool(questionPool.slice()).slice(0, 5);
            currentIdx = 0;
            score = 0;
            userResults = [];
            document.getElementById('active-quiz').style.display = 'block';
            document.getElementById('summary').style.display = 'none';
            document.getElementById('round-info').textContent = `Question 1 of ${quizData.length}`;
            loadQuestion();
        }

        function loadQuestion() {
            const question = quizData[currentIdx];
            document.getElementById('question').textContent = question.q;
            const optionsUl = document.getElementById('options');
            optionsUl.innerHTML = '';
            question.options.forEach((option, index) => {
                const li = document.createElement('li');
                const button = document.createElement('button');
                button.textContent = option;
                button.onclick = () => checkAnswer(index);
                li.appendChild(button);
                optionsUl.appendChild(li);
            });
            document.getElementById('feedback').style.display = 'none';
            updateProgress();
        }

        function checkAnswer(selectedIndex) {
            const current = quizData[currentIdx];
            const correctIndex = current.a;
            const feedback = document.getElementById('feedback');
            const buttons = document.querySelectorAll('#options button');
            buttons.forEach(btn => btn.disabled = true);
            if (selectedIndex === correctIndex) {
                feedback.textContent = 'Correct!';
                feedback.className = 'feedback correct';
                score++;
                userResults.push({ q: current.q, res: 'Correct', class: 'correct' });
            } else {
                feedback.textContent = `Wrong! The correct answer is: ${current.options[correctIndex]}`;
                feedback.className = 'feedback wrong';
                userResults.push({ q: current.q, res: `Wrong (Answer: ${current.options[correctIndex]})`, class: 'wrong' });
            }
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                document.getElementById('round-info').textContent = `Question ${currentIdx + 1} of ${quizData.length}`;
                loadQuestion();
                document.getElementById('next-btn').style.display = 'none';
            } else {
                showSummary();
            }
        }

        function updateProgress() {
            const percent = ((currentIdx + 1) / quizData.length) * 100;
            document.getElementById('progress-fill').style.width = `${percent}%`;
        }

        function showSummary() {
            document.getElementById('active-quiz').style.display = 'none';
            document.getElementById('summary').style.display = 'block';
            document.getElementById('final-score').textContent = `You got ${score} out of ${quizData.length} questions correct.`;
            document.getElementById('round-scores').textContent = '';
        }

        initializeQuiz();
    </script>
</body>
</html>
