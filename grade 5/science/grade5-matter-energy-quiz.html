<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grasslands Elephants Science - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #eef1f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #7b8a8f;
        }
        h2 { font-family: 'Fredoka', cursive; color: #4f6166; }
        .theme-sub { color: #a9b7bc; font-weight: bold; margin-bottom: 1.5rem; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #f7f9fa;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #a9b7bc;
            font-weight: 700;
            transition: all 0.2s;
        }
        .topic-link:hover, .choice:hover {
            background: #e6ecef;
            transform: translateY(-2px);
            border-color: #4f6166;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #a9b7bc;
            border-radius: 50px;
            background: white;
            color: #4f6166;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #e6ecef; border-color: #4f6166; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #4f6166;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #4f6166 0%, #a9b7bc 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #d9e2e5; }
        .hidden { display: none; }
</style>
</head>
<body>
    <div class="quiz-container">
        <h1>Grade 5 Challenge Mode: Matter, Energy, & Change Quiz</h1>
        <div id="active-quiz">
            <div class="round-info" id="round-info">Round 1</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="question" id="question"></div>
            <ul class="options" id="options"></ul>
            <div class="feedback" id="feedback"></div>
        </div>
        <div class="summary" id="summary">
            <h2>Quiz Complete!</h2>
            <p id="final-score"></p>
            <p id="round-scores"></p>
            <a href="grade5-science-topics.html" class="back-link">Back to Science Topics</a>
        </div>
    </div>

    <script>
        const allQuestions = [
            { q: "The Law of Conservation of Mass states that in a closed system, matter is neither created nor destroyed. If you burn 5 grams of wood and are left with 2 grams of ash, what happened to the other 3 grams?", options: ["A) The mass was destroyed by the heat", "B) The 3 grams were converted into gases like carbon dioxide and smoke", "C) The wood became more dense and lost weight", "D) Ash is always lighter than wood regardless of mass"], a: 1 },
            { q: "Which of the following describes the behavior of molecules in a gas when the temperature is significantly increased?", options: ["A) The molecules slow down and begin to clump together", "B) The molecules move faster and spread further apart, increasing pressure", "C) The molecules turn into solid particles", "D) The molecules stop moving entirely at high temperatures"], a: 1 },
            { q: "In a \"Solution,\" like saltwater, the substance being dissolved (the salt) is known as the:", options: ["A) Solvent", "B) Solute", "C) Catalyst", "D) Precipitate"], a: 1 },
            { q: "A student mixes baking soda and vinegar in a sealed bag. The bag fizzes and expands. Which of the following is the best evidence that a \"Chemical Change\" occurred?", options: ["A) The substances changed their shape", "B) The vinegar became cloudy", "C) A new gas was produced that was not there before", "D) The mass of the liquid increased"], a: 2 },
            { q: "Imagine a ball sitting at the very top of a steep hill. As it begins to roll down, what energy transformation is taking place?", options: ["A) Kinetic energy is being transformed into Potential energy", "B) Thermal energy is being transformed into Electrical energy", "C) Potential energy is being transformed into Kinetic energy", "D) Chemical energy is being transformed into Light energy"], a: 2 },
            { q: "Water is known as the \"Universal Solvent\" because it can dissolve more substances than any other liquid. This is a:", options: ["A) Chemical property", "B) Physical property", "C) Biological property", "D) Nuclear property"], a: 1 },
            { q: "Which process describes a \"Phase Change\" where a gas turns directly into a solid, skipping the liquid phase (such as frost forming on a cold window)?", options: ["A) Sublimation", "B) Deposition", "C) Condensation", "D) Evaporation"], a: 1 },
            { q: "If you have 100 grams of ice and it melts completely into liquid water, what will the mass of the liquid water be?", options: ["A) Exactly 100 grams", "B) Slightly less than 100 grams because ice is \"fluffy\"", "C) Slightly more than 100 grams because water is heavier", "D) 0 grams because the state changed"], a: 0 },
            { q: "Which of these is an example of \"Conduction\" (the transfer of heat through direct contact)?", options: ["A) Feeling the warmth of the sun on your face", "B) Hot air rising to the ceiling of a room", "C) A metal spoon becoming hot while sitting in a bowl of boiling soup", "D) Microwave radiation heating up a burrito"], a: 2 },
            { q: "In an experiment, a student finds that Object A floats in water while Object B sinks. What can the student conclude?", options: ["A) Object A is heavier than Object B", "B) Object B is more dense than water, while Object A is less dense than water", "C) Object A has more volume than Object B", "D) Water is more dense than Object B"], a: 1 },
            { q: "Electrical energy can be converted into many other forms. When a toaster is plugged in and used, the energy path is:", options: ["A) Electrical to Sound to Mechanical", "B) Electrical to Thermal and Light", "C) Thermal to Electrical to Chemical", "D) Potential to Kinetic to Electrical"], a: 1 },
            { q: "Which of these is a \"Homogeneous Mixture\" (a mixture that looks the same throughout)?", options: ["A) A bowl of cereal and milk", "B) A tossed salad", "C) A glass of apple juice", "D) A jar of sand and pebbles"], a: 2 },
            { q: "What is the primary difference between a \"Physical Change\" and a \"Chemical Change\"?", options: ["A) Physical changes always involve heat, while chemical changes do not", "B) Physical changes only happen to solids", "C) Chemical changes result in a new substance; physical changes only change appearance", "D) Physical changes are always fast, while chemical changes are always slow"], a: 2 },
            { q: "As water freezes into ice, what happens to the motion of its molecules?", options: ["A) They speed up and move randomly", "B) They slow down and settle into a fixed, vibrating pattern", "C) They disappear and are replaced by ice molecules", "D) They expand and turn into gas bubbles"], a: 1 },
            { q: "Which form of energy is produced by the vibration of particles as they move through a medium (like air or water)?", options: ["A) Light Energy", "B) Nuclear Energy", "C) Sound Energy", "D) Magnetic Energy"], a: 2 },
            { q: "A \"Catalyst\" is a substance that:", options: ["A) Slows down a chemical reaction", "B) Speeds up a chemical reaction without being used up itself", "C) Stops a physical change from happening", "D) Changes a liquid into a gas instantly"], a: 1 },
            { q: "Which of these is an example of \"Chemical Potential Energy\"?", options: ["A) A rubber band stretched out wide", "B) A battery or a piece of food", "C) A rock sitting on the edge of a cliff", "D) A car driving 60 miles per hour"], a: 1 },
            { q: "If you stir 10 grams of salt into 90 grams of water until it completely dissolves, what is the final mass of the solution?", options: ["A) 90 grams", "B) 10 grams", "C) 100 grams", "D) 80 grams"], a: 2 },
            { q: "The \"Boiling Point\" of a substance is a physical property. If you move to a very high mountain where the air pressure is lower, water will boil at:", options: ["A) A higher temperature", "B) A lower temperature", "C) The exact same temperature", "D) It will not boil at all"], a: 1 },
            { q: "Which type of energy is generated by the movement of electrons through a conductor?", options: ["A) Static Energy", "B) Electrical Energy", "C) Mechanical Energy", "D) Solar Energy"], a: 1 }
        ];

        const questionPool = allQuestions;
        let quizData = [];
        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function shufflePool(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initializeQuiz() {
            quizData = shufflePool(questionPool.slice()).slice(0, 5);
            currentIdx = 0;
            score = 0;
            userResults = [];
            document.getElementById('active-quiz').style.display = 'block';
            document.getElementById('summary').style.display = 'none';
            document.getElementById('round-info').textContent = `Question 1 of ${quizData.length}`;
            loadQuestion();
        }

        function loadQuestion() {
            const question = quizData[currentIdx];
            document.getElementById('question').textContent = question.q;
            const optionsUl = document.getElementById('options');
            optionsUl.innerHTML = '';
            question.options.forEach((option, index) => {
                const li = document.createElement('li');
                const button = document.createElement('button');
                button.textContent = option;
                button.onclick = () => checkAnswer(index);
                li.appendChild(button);
                optionsUl.appendChild(li);
            });
            document.getElementById('feedback').style.display = 'none';
            updateProgress();
        }

        function checkAnswer(selectedIndex) {
            const current = quizData[currentIdx];
            const correctIndex = current.a;
            const feedback = document.getElementById('feedback');
            const buttons = document.querySelectorAll('#options button');
            buttons.forEach(btn => btn.disabled = true);
            if (selectedIndex === correctIndex) {
                feedback.textContent = 'Correct!';
                feedback.className = 'feedback correct';
                score++;
                userResults.push({ q: current.q, res: 'Correct', class: 'correct' });
            } else {
                feedback.textContent = `Wrong! The correct answer is: ${current.options[correctIndex]}`;
                feedback.className = 'feedback wrong';
                userResults.push({ q: current.q, res: `Wrong (Answer: ${current.options[correctIndex]})`, class: 'wrong' });
            }
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                document.getElementById('round-info').textContent = `Question ${currentIdx + 1} of ${quizData.length}`;
                loadQuestion();
                document.getElementById('next-btn').style.display = 'none';
            } else {
                showSummary();
            }
        }

        function updateProgress() {
            const percent = ((currentIdx + 1) / quizData.length) * 100;
            document.getElementById('progress-fill').style.width = `${percent}%`;
        }

        function showSummary() {
            document.getElementById('active-quiz').style.display = 'none';
            document.getElementById('summary').style.display = 'block';
            document.getElementById('final-score').textContent = `You got ${score} out of ${quizData.length} questions correct.`;
            document.getElementById('round-scores').textContent = '';
        }

        initializeQuiz();
    </script>
</body>
</html>
