<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grasslands Lions Reading - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fff5e6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .topics-container, .quiz-container, .menu-container {
            background: white;
            padding: 2.2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 560px;
            text-align: center;
            border: 4px dashed #d68b36;
        }
        h2 { font-family: 'Fredoka', cursive; color: #8c5a2f; }
        .theme-sub { color: #e6b789; font-weight: bold; margin-bottom: 1.5rem; }
        p { color: #333; line-height: 1.5; }
        .topic-link, .choice {
            display: block;
            text-decoration: none;
            background: #fff8ed;
            color: #333;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 18px;
            border: 3px solid #e6b789;
            font-weight: 700;
            transition: all 0.2s;
        }
        .topic-link:hover, .choice:hover {
            background: #fff1d9;
            transform: translateY(-2px);
            border-color: #8c5a2f;
        }
        .option-btn {
            padding: 14px;
            border: 3px solid #e6b789;
            border-radius: 50px;
            background: white;
            color: #8c5a2f;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .option-btn:hover { background: #fff1d9; border-color: #8c5a2f; }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #8c5a2f;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #8c5a2f 0%, #e6b789 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #f8e3c3; }
        .hidden { display: none; }
</style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <h2>🦁 Lion Reading</h2>
        <h2 id="question-text">Question</h2>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">Try Again</button>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade5-reading-topics.html'">Back to 🦁 Lion Reading Topics</button>
    </div>

    <script>
        const questionPool = [
            { q: "\"bio\" means ___", a: "Life", options: ["Life", "Water"] },
            { q: "\"tele\" means ___", a: "Far", options: ["Far", "Small"] },
            { q: "\"graph\" means ___", a: "Write", options: ["Write", "Run"] },
            { q: "\"phon\" means ___", a: "Sound", options: ["Sound", "Light"] },
            { q: "\"photo\" means ___", a: "Light", options: ["Light", "Heat"] },
            { q: "\"therm\" means ___", a: "Heat", options: ["Heat", "Cold"] },
            { q: "\"scope\" means ___", a: "Look", options: ["Look", "Hear"] },
            { q: "\"meter\" means ___", a: "Measure", options: ["Measure", "Count"] },
            { q: "\"ped\" means ___", a: "Foot", options: ["Foot", "Hand"] },
            { q: "\"dent\" means ___", a: "Tooth", options: ["Tooth", "Eye"] },
            { q: "\"rupt\" means ___", a: "Break", options: ["Break", "Fix"] },
            { q: "\"port\" means ___", a: "Carry", options: ["Carry", "Throw"] }
        ];

        // Function to shuffle array
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // Select 5 random questions
        const quizData = [];
        const shuffledPool = [...questionPool];
        shuffleArray(shuffledPool);
        for (let i = 0; i < 5 && i < shuffledPool.length; i++) {
            quizData.push(shuffledPool[i]);
        }

        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = current.q;
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";

            current.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            
            // Disable buttons after answer
            btns.forEach(b => b.disabled = true);

            if (selected === current.a) {
                feedback.innerText = "Correct! Well done.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "Oops! The correct answer was " + current.a;
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            const summaryBox = document.getElementById("summary-box");
            summaryBox.classList.remove("hidden");
            
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
            
            userResults.forEach(item => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
        }

        // Start the quiz
        loadQuestion();
    </script>
</body>
</html>
