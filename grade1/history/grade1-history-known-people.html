<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 1 History - Known People</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .quiz-container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 540px; text-align: center; }
        h2 { color: #667eea; }
        .options-container { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
        .option-btn { padding: 12px; border: 2px solid #ddd; border-radius: 8px; background: white; cursor: pointer; font-size: 1.1rem; transition: 0.2s; }
        .option-btn:hover { border-color: #667eea; background: #f0f2ff; }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #28a745; }
        .wrong { color: #dc3545; }
        .next-btn { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; display: none; margin: 0 auto; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <h2 id="question-text">Question</h2>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade1-history.html'">Back to History Topics</button>
    </div>

    <script>
        const quizData = [
            { q: "Who is the president?", a: "leader of country", options: ["teacher", "leader of country", "doctor"] },
            { q: "Who was George Washington?", a: "first president", options: ["last president", "first president", "soldier"] },
            { q: "Who was Abraham Lincoln?", a: "ended slavery", options: ["started slavery", "ended slavery", "invented car"] },
            { q: "Who was Martin Luther King?", a: "civil rights leader", options: ["soldier", "civil rights leader", "teacher"] },
            { q: "Who was Christopher Columbus?", a: "explorer", options: ["farmer", "explorer", "doctor"] },
            { q: "Who were the Pilgrims?", a: "early settlers", options: ["native people", "early settlers", "soldiers"] },
            { q: "Who was Sacagawea?", a: "guide for explorers", options: ["cook", "guide for explorers", "teacher"] },
            { q: "Who was Harriet Tubman?", a: "helped slaves escape", options: ["slave owner", "helped slaves escape", "soldier"] },
            { q: "Who was Rosa Parks?", a: "refused bus seat", options: ["bus driver", "refused bus seat", "teacher"] },
            { q: "Who was Susan B. Anthony?", a: "women's rights", options: ["men's rights", "women's rights", "children's rights"] },
            { q: "Who was Thomas Jefferson?", a: "wrote Declaration", options: ["wrote Constitution", "wrote Declaration", "wrote Bible"] },
            { q: "Who was Benjamin Franklin?", a: "inventor statesman", options: ["farmer", "inventor statesman", "soldier"] },
            { q: "Who was John Adams?", a: "second president", options: ["first president", "second president", "third president"] },
            { q: "Who was Theodore Roosevelt?", a: "conservation president", options: ["war president", "conservation president", "peace president"] },
            { q: "Who was Franklin D. Roosevelt?", a: "WWII president", options: ["WWI president", "WWII president", "Cold War president"] },
            { q: "Who was John F. Kennedy?", a: "young president", options: ["old president", "young president", "tall president"] },
            { q: "Who was Ronald Reagan?", a: "actor president", options: ["singer president", "actor president", "dancer president"] },
            { q: "Who was Barack Obama?", a: "first black president", options: ["first white president", "first black president", "first woman president"] },
            { q: "Who was Donald Trump?", a: "businessman president", options: ["lawyer president", "businessman president", "doctor president"] },
            { q: "Who is Joe Biden?", a: "current president", options: ["past president", "current president", "future president"] }
        ];

        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function ensureTryAgainButton() {
            const summaryBox = document.getElementById("summary-box");
            if (summaryBox && !summaryBox.querySelector('button[onclick="location.reload()"]')) {
                const button = document.createElement('button');
                button.className = 'next-btn';
                button.style.display = 'block';
                button.style.marginTop = '20px';
                button.innerText = 'Try Again';
                button.onclick = function() { location.reload(); };
                const backButton = summaryBox.querySelector('button[onclick^="location.href"]');
                summaryBox.insertBefore(button, backButton || null);
            }
        }

        function initializeQuiz() {
            shuffleArray(quizData);
            loadQuestion();
        }

        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = current.q;
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";

            current.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            btns.forEach(b => b.disabled = true);

            if (selected === current.a) {
                feedback.innerText = "Splashtastic! Correct.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "Glub! Incorrect.";
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            const summaryBox = document.getElementById("summary-box");
            summaryBox.classList.remove("hidden");
            ensureTryAgainButton();
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
            userResults.forEach(item => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
        }

        initializeQuiz();
    </script>
</body>
</html>
