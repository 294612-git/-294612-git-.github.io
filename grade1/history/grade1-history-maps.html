<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Sea Turtle History - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
   <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #d9f2ec;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .quiz-container, .menu-container {
            background: white;
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 540px;
            text-align: center;
            border: 4px dashed #26a69a;
        }
        h2 { font-family: 'Fredoka', cursive; color: #00796b; }
        .choice {
            display: block;
            background: #e0f7f1;
            color: #00796b;
            padding: 1rem;
            margin: 0.8rem 0;
            border-radius: 20px;
            border: 3px solid #80cbc4;
            text-decoration: none;
            font-weight: 700;
        }
        .choice:hover { background: #b2dfdb; border-color: #26a69a; }
        .back-link { display: inline-block; margin-top: 1rem; color: #00796b; text-decoration: none; font-size: 0.95rem; }
        .options-container { display: flex; flex-direction: column; gap: 12px; margin: 20px 0; }
        .option-btn {
            padding: 14px;
            border: 3px solid #80cbc4;
            border-radius: 50px;
            background: white;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: 0.2s;
            color: #00796b;
        }
        .option-btn:hover { border-color: #26a69a; background: #e0f7f1; }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #26a69a 0%, #00796b 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px #004d40;
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #b2dfdb; }
        .hidden { display: none; }
</style>
</head>
<body>

   <div class="quiz-container" id="quiz-box">
        <h2>🐢 Sea Turtle History</h2>
       <h2 id="question-text">Question</h2>
       <div class="options-container" id="options"></div>
       <div id="feedback" class="feedback"></div>
       <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
   </div>

   <div class="quiz-container hidden" id="summary-box">
       <h2>Quiz Complete!</h2>
       <div id="results-list"></div>
       <button class="next-btn" style="display:block;" onclick="location.reload()">Try Again</button>
       <button class="next-btn" style="display:block;" onclick="window.history.back()">Back to History Topics</button>
   </div>

   <script>
       const quizDataRaw = [
           { q: "What do maps show us?", a: "Places and where they are", options: ["Places and where they are", "What we should eat", "How to play a game", "The names of our toys"] },
           { q: "On most maps, what color is used to show water like oceans and lakes?", a: "Blue", options: ["Red", "Green", "Blue", "Yellow"] },
           { q: "What tool is often printed on a map to help us know which way is North?", a: "A Compass Rose", options: ["A Spoon", "A Compass Rose", "A Ruler", "A Clock"] },
           { q: "North, South, East, and West are called:", a: "Directions", options: ["Animals", "Directions", "Colors", "Planets"] },
           { q: "A 'map key' or 'legend' tells us:", a: "What the symbols on the map mean", options: ["Where treasure is", "What the symbols mean", "The artist's name", "How to unlock a door"] },
           { q: "On a map, what color usually represents land or forests?", a: "Green", options: ["Blue", "Green", "Purple", "Orange"] },
           { q: "What do we call a book that is full of different maps?", a: "An Atlas", options: ["A Dictionary", "An Atlas", "A Storybook", "A Notebook"] },
           { q: "Which direction is the opposite of North?", a: "South", options: ["East", "West", "South", "Up"] },
           { q: "A map that is shaped like a round ball to show the whole Earth is called a:", a: "Globe", options: ["Square", "Globe", "Circle", "Box"] },
           { q: "What might a small 'star' symbol on a map represent?", a: "A capital city", options: ["A star in the sky", "A capital city", "A mountain", "A park"] },
           { q: "If you are looking at a map, which direction is usually at the very top?", a: "North", options: ["South", "East", "North", "West"] },
           { q: "What do we call the line that divides the Earth into a top and bottom half?", a: "The Equator", options: ["The North Pole", "The Equator", "The Finish Line", "The Street"] },
           { q: "Which direction does the sun rise in the morning?", a: "East", options: ["North", "South", "East", "West"] },
           { q: "A map of your neighborhood might show:", a: "Streets and houses", options: ["Every planet", "Streets and houses", "Inside the fridge", "Your future job"] },
           { q: "What do we call a large area of land, like North America?", a: "A Continent", options: ["A City", "A Continent", "A State", "A Street"] },
           { q: "If you walk toward the sunset in the evening, which direction are you going?", a: "West", options: ["North", "East", "South", "West"] },
           { q: "A symbol that looks like a tiny tent on a map might mean:", a: "A campground", options: ["A hospital", "A campground", "A grocery store", "A swimming pool"] },
           { q: "What does a 'Scale' on a map help you measure?", a: "The distance between two places", options: ["The map's weight", "The distance", "Water temperature", "Population"] },
           { q: "What is a 'Border' on a map?", a: "A line that shows where one place ends", options: ["A line that shows where one place ends", "A type of tree", "The name of the ocean", "A road for bicycles"] },
           { q: "Which of these is a large body of salt water shown on a map?", a: "An Ocean", options: ["A Pond", "A River", "An Ocean", "A Puddle"] }
       ];

       function shuffle(array) {
           for (let i = array.length - 1; i > 0; i--) {
               const j = Math.floor(Math.random() * (i + 1));
               [array[i], array[j]] = [array[j], array[i]];
           }
           return array;
       }

       const quizData = shuffle([...quizDataRaw]).slice(0, 5);
       let currentIdx = 0;
       let score = 0;
       let userResults = [];

       function loadQuestion() {
           const current = quizData[currentIdx];
           document.getElementById("question-text").innerText = current.q;
           const optionsDiv = document.getElementById("options");
           optionsDiv.innerHTML = "";
           document.getElementById("feedback").innerText = "";
           document.getElementById("next-button").style.display = "none";

           current.options.forEach(opt => {
               const btn = document.createElement("button");
               btn.innerText = opt;
               btn.className = "option-btn";
               btn.onclick = () => checkAnswer(opt);
               optionsDiv.appendChild(btn);
           });
       }

       function checkAnswer(selected) {
           const current = quizData[currentIdx];
           const feedback = document.getElementById("feedback");
           const btns = document.querySelectorAll(".option-btn");
           btns.forEach(b => b.disabled = true);

           if (selected === current.a) {
               feedback.innerText = "Correct! Well done.";
               feedback.className = "feedback correct";
               score++;
               userResults.push({ q: current.q, res: "Correct", class: "correct" });
           } else {
               feedback.innerText = "Oops! The correct answer was " + current.a + ".";
               feedback.className = "feedback wrong";
               userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
           }
           document.getElementById("next-button").style.display = "block";
       }

       function loadNextQuestion() {
           currentIdx++;
           if (currentIdx < quizData.length) {
               loadQuestion();
           } else {
               showSummary();
           }
       }

       function showSummary() {
           document.getElementById("quiz-box").classList.add("hidden");
           const summaryBox = document.getElementById("summary-box");
           summaryBox.classList.remove("hidden");
           const list = document.getElementById("results-list");
           list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
           userResults.forEach(item => {
               const div = document.createElement("div");
               div.className = "summary-item";
               div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
               list.appendChild(div);
           });
       }

       loadQuestion();
   </script>
</body>
</html>
