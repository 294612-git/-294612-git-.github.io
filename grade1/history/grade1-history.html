<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sea Turtle History - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #d9f2ec;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .quiz-container, .menu-container {
            background: white;
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 540px;
            text-align: center;
            border: 4px dashed #26a69a;
        }
        h2 { font-family: 'Fredoka', cursive; color: #00796b; }
        .choice {
            display: block;
            background: #e0f7f1;
            color: #00796b;
            padding: 1rem;
            margin: 0.8rem 0;
            border-radius: 20px;
            border: 3px solid #80cbc4;
            text-decoration: none;
            font-weight: 700;
        }
        .choice:hover { background: #b2dfdb; border-color: #26a69a; }
        .back-link { display: inline-block; margin-top: 1rem; color: #00796b; text-decoration: none; font-size: 0.95rem; }
        .options-container { display: flex; flex-direction: column; gap: 12px; margin: 20px 0; }
        .option-btn {
            padding: 14px;
            border: 3px solid #80cbc4;
            border-radius: 50px;
            background: white;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: 0.2s;
            color: #00796b;
        }
        .option-btn:hover { border-color: #26a69a; background: #e0f7f1; }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #26a69a 0%, #00796b 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px #004d40;
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #b2dfdb; }
        .hidden { display: none; }
</style>
</head>
<body>
    <div class="menu-container">
        <h2>🐢 Grade 1 History</h2>
        <p>Choose a topic to explore with sea turtles:</p>
        <a href="grade1-history-symbols.html" class="choice">Symbols</a>
        <a href="grade1-history-known-people.html" class="choice">Known People</a>
        <a href="grade1-history-landmarks.html" class="choice">Landmarks</a>
        <a href="grade1-history-maps.html" class="choice">Maps</a>
        <a href="../../startquiz.html" class="back-link">← Back to Quiz Selection</a>
    </div>
</body>
</html>
