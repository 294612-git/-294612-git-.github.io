<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 1 History - Symbols</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .quiz-container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 540px; text-align: center; }
        h2 { color: #667eea; }
        .options-container { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
        .option-btn { padding: 12px; border: 2px solid #ddd; border-radius: 8px; background: white; cursor: pointer; font-size: 1.1rem; transition: 0.2s; }
        .option-btn:hover { border-color: #667eea; background: #f0f2ff; }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #28a745; }
        .wrong { color: #dc3545; }
        .next-btn { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; display: none; margin: 0 auto; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <h2 id="question-text">Question</h2>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">Try Again</button>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade1-history.html'">Back to History Topics</button>
    </div>

    <script>
        const questionPool = [
            { q: "What is the American flag?", a: "symbol of country", options: ["toy", "symbol of country", "game"] },
            { q: "What colors are on the flag?", a: "red white blue", options: ["green yellow red", "red white blue", "blue black white"] },
            { q: "What is the bald eagle?", a: "national bird", options: ["pet bird", "national bird", "farm bird"] },
            { q: "What is the Statue of Liberty?", a: "symbol of freedom", options: ["statue of war", "symbol of freedom", "statue of peace"] },
            { q: "What does the torch represent?", a: "light of freedom", options: ["light of darkness", "light of freedom", "light of fire"] },
            { q: "What is the Liberty Bell?", a: "symbol of independence", options: ["symbol of slavery", "symbol of independence", "symbol of war"] },
            { q: "What is the White House?", a: "president's home", options: ["king's home", "president's home", "soldier's home"] },
            { q: "What is the Capitol building?", a: "law making place", options: ["school", "law making place", "hospital"] },
            { q: "What are stars on the flag?", a: "states", options: ["cities", "states", "countries"] },
            { q: "What are stripes on the flag?", a: "original colonies", options: ["roads", "original colonies", "rivers"] },
            { q: "What is the Pledge of Allegiance?", a: "promise to country", options: ["song", "promise to country", "dance"] },
            { q: "What is patriotism?", a: "love for country", options: ["hate for country", "love for country", "fear of country"] },
            { q: "What is a monument?", a: "memorial structure", options: ["play structure", "memorial structure", "living structure"] },
            { q: "What is a holiday?", a: "special day", options: ["work day", "special day", "sleep day"] },
            { q: "What is Independence Day?", a: "July 4th", options: ["Christmas", "July 4th", "Halloween"] },
            { q: "What is Thanksgiving?", a: "harvest festival", options: ["birthday party", "harvest festival", "wedding"] },
            { q: "What is Veterans Day?", a: "honor soldiers", options: ["honor teachers", "honor soldiers", "honor doctors"] },
            { q: "What is Memorial Day?", a: "remember dead", options: ["remember alive", "remember dead", "remember sick"] },
            { q: "What is Columbus Day?", a: "explorer day", options: ["farmer day", "explorer day", "teacher day"] },
            { q: "What is Martin Luther King Day?", a: "civil rights leader", options: ["president day", "civil rights leader", "soldier day"] }
        ];

        const quizData = shuffleArray(questionPool.slice()).slice(0, 5);

        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }





        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = current.q;
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";

            current.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            btns.forEach(b => b.disabled = true);

            if (selected === current.a) {
                feedback.innerText = "Correct! Well done.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "Oops! The correct answer was " + current.a + ".";
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            const summaryBox = document.getElementById("summary-box");
            summaryBox.classList.remove("hidden");
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
            userResults.forEach(item => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
        }

        loadQuestion();
    </script>
</body>
</html>
