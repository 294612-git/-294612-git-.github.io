<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Sea Turtle History - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
   <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #d9f2ec;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .quiz-container, .menu-container {
            background: white;
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 540px;
            text-align: center;
            border: 4px dashed #26a69a;
        }
        h2 { font-family: 'Fredoka', cursive; color: #00796b; }
        .choice {
            display: block;
            background: #e0f7f1;
            color: #00796b;
            padding: 1rem;
            margin: 0.8rem 0;
            border-radius: 20px;
            border: 3px solid #80cbc4;
            text-decoration: none;
            font-weight: 700;
        }
        .choice:hover { background: #b2dfdb; border-color: #26a69a; }
        .back-link { display: inline-block; margin-top: 1rem; color: #00796b; text-decoration: none; font-size: 0.95rem; }
        .options-container { display: flex; flex-direction: column; gap: 12px; margin: 20px 0; }
        .option-btn {
            padding: 14px;
            border: 3px solid #80cbc4;
            border-radius: 50px;
            background: white;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: 0.2s;
            color: #00796b;
        }
        .option-btn:hover { border-color: #26a69a; background: #e0f7f1; }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #26a69a 0%, #00796b 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px #004d40;
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #b2dfdb; }
        .hidden { display: none; }
</style>
</head>
<body>

   <div class="quiz-container" id="quiz-box">
        <h2>🐢 Sea Turtle History</h2>
       <h2 id="question-text">Question</h2>
       <div class="options-container" id="options"></div>
       <div id="feedback" class="feedback"></div>
       <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
   </div>

   <div class="quiz-container hidden" id="summary-box">
       <h2>Quiz Complete!</h2>
       <div id="results-list"></div>
       <button class="next-btn" style="display:block;" onclick="location.reload()">Try Again</button>
       <button class="next-btn" style="display:block;" onclick="window.history.back()">Back to History Topics</button>
   </div>

   <script>
       const questionPool = [
           { q: "The red, white, and blue colors are found on which American symbol?", a: "The American Flag", options: ["The School Bus", "The American Flag", "A Library Book", "A Mailbox"] },
           { q: "Which majestic bird is the national symbol of the United States?", a: "The Bald Eagle", options: ["The Blue Jay", "The Bald Eagle", "The Parrot", "The Penguin"] },
           { q: "What is the Statue of Liberty holding high in her right hand?", a: "A Torch", options: ["A Torch", "A Soccer Ball", "A Giant Pencil", "An Umbrella"] },
           { q: "What does the American flag stand for?", a: "Our country", options: ["A fun game", "Our country", "A favorite food", "The weekend"] },
           { q: "How many stars are on the American flag today?", a: "50", options: ["13", "25", "50", "100"] },
           { q: "What do the 13 stripes on the flag represent?", a: "The 13 original colonies", options: ["The 13 original colonies", "The 13 months", "13 languages", "13 presidents"] },
           { q: "Where is the Statue of Liberty located?", a: "New York City", options: ["Washington, D.C.", "New York City", "Los Angeles", "Disney World"] },
           { q: "Who was the very first President of the United States?", a: "George Washington", options: ["Abraham Lincoln", "George Washington", "Barack Obama", "Benjamin Franklin"] },
           { q: "Which famous American symbol is a large bell with a crack in it?", a: "The Liberty Bell", options: ["The Dinner Bell", "The Liberty Bell", "The School Bell", "The Sleigh Bell"] },
           { q: "Where does the President of the United States live and work?", a: "The White House", options: ["The Capitol Building", "The White House", "The Empire State Building", "A Log Cabin"] },
           { q: "Which holiday do we celebrate to say 'thank you' to people who served in the military?", a: "Veterans Day", options: ["Halloween", "Veterans Day", "St. Patrick’s Day", "Valentine’s Day"] },
           { q: "Who is known for having a dream that all people would be treated fairly?", a: "Martin Luther King Jr.", options: ["George Washington", "Martin Luther King Jr.", "Christopher Columbus", "Paul Revere"] },
           { q: "What do the stars on the American flag represent?", a: "The 50 states", options: ["The 50 states", "50 brightest stars", "50 famous people", "50 different flowers"] },
           { q: "Which President is famous for wearing a tall black hat and helping end slavery?", a: "Abraham Lincoln", options: ["Thomas Jefferson", "Abraham Lincoln", "Theodore Roosevelt", "John F. Kennedy"] },
           { q: "What is the capital city of the United States?", a: "Washington, D.C.", options: ["New York City", "Washington, D.C.", "Chicago", "Houston"] },
           { q: "On the 4th of July, we celebrate America's ____.", a: "Birthday (Independence)", options: ["Birthday (Independence)", "Discovery of Gold", "First Winter", "Harvest Time"] },
           { q: "Which symbol is used to show that a person is a citizen of the U.S. when they travel?", a: "A Passport", options: ["A Library Card", "A Passport", "A Movie Ticket", "A Postcard"] },
           { q: "The 'Pledge of Allegiance' is a promise to be loyal to:", a: "The Flag and the Country", options: ["Your favorite team", "The Flag and the Country", "Your toys", "The Moon"] },
           { q: "Who was a woman who helped many people find freedom on the Underground Railroad?", a: "Harriet Tubman", options: ["Betsy Ross", "Harriet Tubman", "Amelia Earhart", "Rosa Parks"] },
           { q: "What is the name of our national anthem (our country's song)?", a: "The Star-Spangled Banner", options: ["Happy Birthday", "The Star-Spangled Banner", "Twinkle Twinkle Little Star", "Jingle Bells"] }
       ];

       function shuffleArray(array) {
           for (let i = array.length - 1; i > 0; i--) {
               const j = Math.floor(Math.random() * (i + 1));
               [array[i], array[j]] = [array[j], array[i]];
           }
           return array;
       }

       const quizData = shuffleArray([...questionPool]).slice(0, 5);
       let currentIdx = 0;
       let score = 0;
       let userResults = [];

       function loadQuestion() {
           const current = quizData[currentIdx];
           document.getElementById("question-text").innerText = current.q;
           const optionsDiv = document.getElementById("options");
           optionsDiv.innerHTML = "";
           document.getElementById("feedback").innerText = "";
           document.getElementById("next-button").style.display = "none";

           current.options.forEach(opt => {
               const btn = document.createElement("button");
               btn.innerText = opt;
               btn.className = "option-btn";
               btn.onclick = () => checkAnswer(opt);
               optionsDiv.appendChild(btn);
           });
       }

       function checkAnswer(selected) {
           const current = quizData[currentIdx];
           const feedback = document.getElementById("feedback");
           const btns = document.querySelectorAll(".option-btn");
           btns.forEach(b => b.disabled = true);

           if (selected === current.a) {
               feedback.innerText = "Correct! Well done.";
               feedback.className = "feedback correct";
               score++;
               userResults.push({ q: current.q, res: "Correct", class: "correct" });
           } else {
               feedback.innerText = "Oops! The correct answer was " + current.a + ".";
               feedback.className = "feedback wrong";
               userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
           }
           document.getElementById("next-button").style.display = "block";
       }

       function loadNextQuestion() {
           currentIdx++;
           if (currentIdx < quizData.length) {
               loadQuestion();
           } else {
               showSummary();
           }
       }

       function showSummary() {
           document.getElementById("quiz-box").classList.add("hidden");
           const summaryBox = document.getElementById("summary-box");
           summaryBox.classList.remove("hidden");
           const list = document.getElementById("results-list");
           list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
           userResults.forEach(item => {
               const div = document.createElement("div");
               div.className = "summary-item";
               div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
               list.appendChild(div);
           });
       }

       loadQuestion();
   </script>
</body>
</html>
