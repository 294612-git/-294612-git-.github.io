<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 1 History - Landmarks</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .quiz-container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 540px; text-align: center; }
        h2 { color: #667eea; }
        .options-container { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
        .option-btn { padding: 12px; border: 2px solid #ddd; border-radius: 8px; background: white; cursor: pointer; font-size: 1.1rem; transition: 0.2s; }
        .option-btn:hover { border-color: #667eea; background: #f0f2ff; }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #28a745; }
        .wrong { color: #dc3545; }
        .next-btn { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; display: none; margin: 0 auto; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <h2 id="question-text">Question</h2>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">Try Again</button>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade1-history.html'">Back to History Topics</button>
    </div>

    <script>
        const questionPool = [
            { q: "What is the Statue of Liberty?", a: "freedom statue", options: ["war statue", "freedom statue", "peace statue"] },
            { q: "Where is the Statue of Liberty?", a: "New York Harbor", options: ["Los Angeles", "New York Harbor", "Chicago"] },
            { q: "What is the White House?", a: "president's house", options: ["king's house", "president's house", "soldier's house"] },
            { q: "Where is the White House?", a: "Washington DC", options: ["New York", "Washington DC", "Boston"] },
            { q: "What is the Capitol?", a: "law building", options: ["school", "law building", "hospital"] },
            { q: "Where is the Capitol?", a: "Washington DC", options: ["New York", "Washington DC", "Philadelphia"] },
            { q: "What is Mount Rushmore?", a: "mountain with faces", options: ["mountain with trees", "mountain with faces", "mountain with water"] },
            { q: "Where is Mount Rushmore?", a: "South Dakota", options: ["North Dakota", "South Dakota", "Montana"] },
            { q: "What is the Liberty Bell?", a: "independence bell", options: ["freedom bell", "independence bell", "peace bell"] },
            { q: "Where is the Liberty Bell?", a: "Philadelphia", options: ["Boston", "Philadelphia", "Baltimore"] },
            { q: "What is the Gateway Arch?", a: "St. Louis monument", options: ["Chicago monument", "St. Louis monument", "Detroit monument"] },
            { q: "Where is the Gateway Arch?", a: "St. Louis", options: ["St. Paul", "St. Louis", "St. Joseph"] },
            { q: "What is the Alamo?", a: "Texas mission", options: ["California mission", "Texas mission", "Arizona mission"] },
            { q: "Where is the Alamo?", a: "San Antonio", options: ["San Diego", "San Antonio", "San Jose"] },
            { q: "What is the Grand Canyon?", a: "big canyon", options: ["small canyon", "big canyon", "medium canyon"] },
            { q: "Where is the Grand Canyon?", a: "Arizona", options: ["Nevada", "Arizona", "Utah"] },
            { q: "What is Yellowstone?", a: "first national park", options: ["last national park", "first national park", "second national park"] },
            { q: "Where is Yellowstone?", a: "Wyoming", options: ["Montana", "Wyoming", "Idaho"] },
            { q: "What is the Golden Gate Bridge?", a: "famous bridge", options: ["small bridge", "famous bridge", "old bridge"] },
            { q: "Where is the Golden Gate Bridge?", a: "San Francisco", options: ["Los Angeles", "San Francisco", "Seattle"] }
        ];

        const quizData = shuffleArray(questionPool.slice()).slice(0, 5);

        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }



        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = current.q;
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";

            current.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            btns.forEach(b => b.disabled = true);

            if (selected === current.a) {
                feedback.innerText = "Correct! Well done.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "Oops! The correct answer was " + current.a + ".";
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            const summaryBox = document.getElementById("summary-box");
            summaryBox.classList.remove("hidden");
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
            userResults.forEach(item => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
        }

        loadQuestion();
    </script>
</body>
</html>
