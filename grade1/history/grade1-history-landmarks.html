<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Sea Turtle History - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
   <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #d9f2ec;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .quiz-container, .menu-container {
            background: white;
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 540px;
            text-align: center;
            border: 4px dashed #26a69a;
        }
        h2 { font-family: 'Fredoka', cursive; color: #00796b; }
        .choice {
            display: block;
            background: #e0f7f1;
            color: #00796b;
            padding: 1rem;
            margin: 0.8rem 0;
            border-radius: 20px;
            border: 3px solid #80cbc4;
            text-decoration: none;
            font-weight: 700;
        }
        .choice:hover { background: #b2dfdb; border-color: #26a69a; }
        .back-link { display: inline-block; margin-top: 1rem; color: #00796b; text-decoration: none; font-size: 0.95rem; }
        .options-container { display: flex; flex-direction: column; gap: 12px; margin: 20px 0; }
        .option-btn {
            padding: 14px;
            border: 3px solid #80cbc4;
            border-radius: 50px;
            background: white;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: 0.2s;
            color: #00796b;
        }
        .option-btn:hover { border-color: #26a69a; background: #e0f7f1; }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #26a69a 0%, #00796b 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px #004d40;
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #b2dfdb; }
        .hidden { display: none; }
</style>
</head>
<body>

   <div class="quiz-container" id="quiz-box">
        <h2>🐢 Sea Turtle History</h2>
       <h2 id="question-text">Question</h2>
       <div class="options-container" id="options"></div>
       <div id="feedback" class="feedback"></div>
       <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
   </div>

   <div class="quiz-container hidden" id="summary-box">
       <h2>Quiz Complete!</h2>
       <div id="results-list"></div>
       <button class="next-btn" style="display:block;" onclick="location.reload()">Try Again</button>
       <button class="next-btn" style="display:block;" onclick="window.history.back()">Back to History Topics</button>
   </div>

   <script>
       const questionPool = [
           { q: "The Statue of Liberty is located in which state?", a: "New York", options: ["Texas", "New York", "Florida", "California"] },
           { q: "The White House is the special home where the ____ lives.", a: "President", options: ["Mayor", "Teacher", "President", "Principal"] },
           { q: "Mount Rushmore has the faces of four ____ carved into it.", a: "Presidents", options: ["Actors", "Presidents", "Astronauts", "Singers"] },
           { q: "The Liberty Bell, which has a famous crack, is found in which state?", a: "Pennsylvania", options: ["Florida", "Pennsylvania", "Hawaii", "Alaska"] },
           { q: "Which landmark is a very tall, pointy monument in Washington, D.C.?", a: "The Washington Monument", options: ["The Washington Monument", "The Golden Gate Bridge", "The Space Needle", "A Skyscraper"] },
           { q: "The Golden Gate Bridge is a famous bright orange bridge in which city?", a: "San Francisco", options: ["New York", "San Francisco", "Chicago", "Miami"] },
           { q: "The Grand Canyon is a deep, beautiful hole in the ground located in:", a: "Arizona", options: ["Arizona", "Maine", "Ohio", "Georgia"] },
           { q: "Which landmark was built to remember President Abraham Lincoln?", a: "The Lincoln Memorial", options: ["The Lincoln Memorial", "The White House", "The Statue of Liberty", "The Library"] },
           { q: "The Gateway Arch is a huge silver shape in Missouri. What is it made of?", a: "Metal (Steel)", options: ["Wood", "Plastic", "Metal (Steel)", "Glass"] },
           { q: "Which landmark is a large clock tower in London?", a: "Big Ben", options: ["Big Ben", "The Liberty Bell", "A Wristwatch", "The Sun"] },
           { q: "The 'Hoover Dam' is a giant wall that holds back a lot of ____.", a: "Water", options: ["Sand", "Water", "Snow", "Trees"] },
           { q: "What is the name of the big forest in Florida where alligators live?", a: "The Everglades", options: ["The Jungle", "The Everglades", "The Desert", "The North Pole"] },
           { q: "Which landmark is a bridge that connects two pieces of land over water?", a: "A Bridge", options: ["A Tunnel", "A Bridge", "A Tower", "A Wall"] },
           { q: "The 'Space Needle' is a tall tower that looks like a UFO in which city?", a: "Seattle", options: ["Seattle", "Dallas", "Boston", "Atlanta"] },
           { q: "What do we call the building where laws are made in Washington, D.C.?", a: "The Capitol Building", options: ["The Grocery Store", "The Capitol Building", "The Post Office", "The Movie Theater"] },
           { q: "Independence Hall is where the Declaration of Independence was signed. Which city?", a: "Philadelphia", options: ["Philadelphia", "Las Vegas", "Denver", "Detroit"] },
           { q: "Which landmark is a famous mission building in San Antonio, Texas?", a: "The Alamo", options: ["The Alamo", "The Empire State Building", "The Pentagon", "The Mall"] },
           { q: "The 'Hollywood' sign is located on a hill in which state?", a: "California", options: ["New Jersey", "California", "Montana", "Kansas"] },
           { q: "Yellowstone is a National Park known for its 'Old Faithful' ____.", a: "Geyser (Water shooter)", options: ["Volcano", "Geyser (Water shooter)", "Waterfall", "Cave"] },
           { q: "Which landmark is a very tall skyscraper in New York City?", a: "The Empire State Building", options: ["The Empire State Building", "A Log Cabin", "A Treehouse", "A Tent"] }
       ];

       function shuffleArray(array) {
           for (let i = array.length - 1; i > 0; i--) {
               const j = Math.floor(Math.random() * (i + 1));
               [array[i], array[j]] = [array[j], array[i]];
           }
           return array;
       }

       const quizData = shuffleArray([...questionPool]).slice(0, 5);
       let currentIdx = 0;
       let score = 0;
       let userResults = [];

       function loadQuestion() {
           const current = quizData[currentIdx];
           document.getElementById("question-text").innerText = current.q;
           const optionsDiv = document.getElementById("options");
           optionsDiv.innerHTML = "";
           document.getElementById("feedback").innerText = "";
           document.getElementById("next-button").style.display = "none";

           current.options.forEach(opt => {
               const btn = document.createElement("button");
               btn.innerText = opt;
               btn.className = "option-btn";
               btn.onclick = () => checkAnswer(opt);
               optionsDiv.appendChild(btn);
           });
       }

       function checkAnswer(selected) {
           const current = quizData[currentIdx];
           const feedback = document.getElementById("feedback");
           const btns = document.querySelectorAll(".option-btn");
           btns.forEach(b => b.disabled = true);

           if (selected === current.a) {
               feedback.innerText = "Correct! Well done.";
               feedback.className = "feedback correct";
               score++;
               userResults.push({ q: current.q, res: "Correct", class: "correct" });
           } else {
               feedback.innerText = "Oops! The correct answer was " + current.a + ".";
               feedback.className = "feedback wrong";
               userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
           }
           document.getElementById("next-button").style.display = "block";
       }

       function loadNextQuestion() {
           currentIdx++;
           if (currentIdx < quizData.length) {
               loadQuestion();
           } else {
               showSummary();
           }
       }

       function showSummary() {
           document.getElementById("quiz-box").classList.add("hidden");
           const summaryBox = document.getElementById("summary-box");
           summaryBox.classList.remove("hidden");
           const list = document.getElementById("results-list");
           list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
           userResults.forEach(item => {
               const div = document.createElement("div");
               div.className = "summary-item";
               div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
               list.appendChild(div);
           });
       }

       loadQuestion();
   </script>
</body>
</html>
