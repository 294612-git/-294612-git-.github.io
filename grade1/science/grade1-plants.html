<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Seaweed & Kelp Quiz - Study Buddy</title>
   <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
   <style>
       body {
           font-family: 'Quicksand', sans-serif;
           background-color: #e3f2fd;
           display: flex;
           justify-content: center;
           align-items: center;
           min-height: 100vh;
           margin: 0;
       }
       .quiz-container {
           background: white;
           padding: 2rem;
           border-radius: 20px;
           box-shadow: 0 8px 25px rgba(0,0,0,0.1);
           width: 90%;
           max-width: 500px;
           text-align: center;
           border: 4px dashed #1976d2;
       }
       h2 { font-family: 'Fredoka', cursive; color: #1565c0; }
       .options-container { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
       .option-btn {
           padding: 12px;
           border: 3px solid #bbdefb;
           border-radius: 50px;
           background: white;
           cursor: pointer;
           font-size: 1.1rem;
           font-weight: 600;
           transition: 0.2s;
           color: #1565c0;
       }
       .option-btn:hover { border-color: #1976d2; background: #e3f2fd; }
       .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
       .correct { color: #1b5e20; }
       .wrong { color: #b71c1c; }
       .next-btn {
           background: linear-gradient(135deg, #1e88e5 0%, #1565c0 100%);
           color: white;
           border: none;
           padding: 12px 25px;
           border-radius: 50px;
           cursor: pointer;
           display: none;
           margin: 0 auto;
           font-weight: bold;
           box-shadow: 0 4px 0px #0d47a1;
       }
       .next-btn:active { transform: translateY(4px); box-shadow: none; }
       .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #bbdefb; }
       .hidden { display: none; }
   </style>
</head>
<body>
   <div class="quiz-container" id="quiz-box">
       <h2>🐬 Seaweed & Kelp Quiz</h2>
       <h2 id="question-text" style="color: #333;">Question</h2>
       <div class="options-container" id="options"></div>
       <div id="feedback" class="feedback"></div>
       <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Dive to Next</button>
   </div>

   <div class="quiz-container hidden" id="summary-box">
       <h2>You're a Dolphin Scientist!</h2>
       <div id="results-list"></div>
       <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">Try Again</button>
       <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade1-science-topics.html'">Back to Dolphin Science</button>
   </div>

   <script>
       const questionPool = [
           { q: "What do seaweed and kelp need to grow?", a: "Water", options: ["Sand", "Light", "Water", "Air"] },
           { q: "Seaweed lives in the ____.", a: "Ocean", options: ["Forest", "Ocean", "Desert", "River"] },
           { q: "Kelp is a type of ____.", a: "Plant", options: ["Animal", "Mineral", "Plant", "Rock"] },
           { q: "Seaweed uses sunlight to make ___.", a: "Food", options: ["Food", "Sound", "Wind", "Fire"] },
           { q: "Kelp forests are home to many ___.", a: "Animals", options: ["Vehicles", "Animals", "Rocks", "Clouds"] },
           { q: "Seaweed grows in ___ water.", a: "Salt", options: ["Fresh", "Salt", "Sweet", "Hot"] },
           { q: "Kelp can grow very ___.", a: "Tall", options: ["Short", "Tall", "Thin", "Round"] },
           { q: "Seaweed helps keep ocean water ___ and healthy.", a: "Clean", options: ["Dirty", "Clean", "Cold", "Still"] },
           { q: "Seaweed & kelp breathe in ___ from the water.", a: "Carbon dioxide", options: ["Oxygen", "Food", "Carbon dioxide", "Light"] },
           { q: "Seaweed is food for some ___.", a: "Fish", options: ["Cars", "Fish", "Birds", "Dogs"] },
           { q: "Kelp grows from the ocean floor with a ___.", a: "Holdfast", options: ["Flower", "Holdfast", "Leaves", "Legs"] },
           { q: "Seaweed is not a tree; it is a ___.", a: "Plant", options: ["Fish", "Rock", "Plant", "Animal"] },
           { q: "Seaweed helps animals by giving them ___ .", a: "Shelter", options: ["Shelter", "Heat", "Sound", "Games"] },
           { q: "Kelp can grow very fast, like a ___ in the sea.", a: "Forest", options: ["House", "Forest", "Cloud", "Mountain"] },
           { q: "Seaweed uses light from the ___ to grow.", a: "Sun", options: ["Moon", "Star", "Sun", "Tree"] },
           { q: "Seaweed is found near the ocean ___.", a: "Bottom", options: ["Top", "Bottom", "Middle", "Sky"] },
           { q: "Kelp hides fish and crabs from ___ .", a: "Predators", options: ["Trees", "Predators", "Cars", "Bubbles"] },
           { q: "Seaweed moves with the ___ in the water.", a: "Current", options: ["Wind", "Current", "Rain", "Clouds"] },
           { q: "Seaweed is green because of a special ___ called chlorophyll.", a: "Pigment", options: ["Pigment", "Tail", "Fur", "Sound"] },
           { q: "Kelp forests help protect the ocean from too much ___.", a: "Erosion", options: ["Air", "Erosion", "Sleep", "Sun"] }
        ];
        const quizData = shufflePool(questionPool.slice()).slice(0, 5);
        function shufflePool(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

       let currentIdx = 0;
       let score = 0;
       let userResults = [];

       function shuffleArray(array) {
           for (let i = array.length - 1; i > 0; i--) {
               const j = Math.floor(Math.random() * (i + 1));
               [array[i], array[j]] = [array[j], array[i]];
           }
       }

       function initializeQuiz() {
           shuffleArray(quizData);
           loadQuestion();
       }

       function loadQuestion() {
           const current = quizData[currentIdx];
           document.getElementById("question-text").innerText = current.q;
           const optionsDiv = document.getElementById("options");
           optionsDiv.innerHTML = "";
           document.getElementById("feedback").innerText = "";
           document.getElementById("next-button").style.display = "none";
           current.options.forEach(opt => {
               const btn = document.createElement("button");
               btn.innerText = opt;
               btn.className = "option-btn";
               btn.onclick = () => checkAnswer(opt);
               optionsDiv.appendChild(btn);
           });
       }

       function checkAnswer(selected) {
           const current = quizData[currentIdx];
           const feedback = document.getElementById("feedback");
           const btns = document.querySelectorAll(".option-btn");
           btns.forEach(b => b.disabled = true);
           if (selected === current.a) {
               feedback.innerText = "Splashtastic! Correct.";
               feedback.className = "feedback correct";
               score++;
               userResults.push({ q: current.q, res: "Correct", class: "correct" });
           } else {
               feedback.innerText = "Glub! The correct answer was " + current.a;
               feedback.className = "feedback wrong";
               userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
           }
           document.getElementById("next-button").style.display = "block";
       }

       function loadNextQuestion() {
           currentIdx++;
           if (currentIdx < quizData.length) { loadQuestion(); } else { showSummary(); }
       }

       function showSummary() {
           document.getElementById("quiz-box").classList.add("hidden");
           document.getElementById("summary-box").classList.remove("hidden");
           const list = document.getElementById("results-list");
           list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
           userResults.forEach(item => {
               const div = document.createElement("div");
               div.className = "summary-item";
               div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
               list.appendChild(div);
           });
       }
       initializeQuiz();
   </script>
</body>
</html>
