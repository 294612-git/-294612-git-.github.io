<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Weather Quiz - Study Buddy</title>
   <style>
       body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
       .quiz-container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 500px; text-align: center; }
       h2 { color: #667eea; }
       .options-container { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
       .option-btn { padding: 12px; border: 2px solid #ddd; border-radius: 8px; background: white; cursor: pointer; font-size: 1.1rem; transition: 0.2s; }
       .option-btn:hover { border-color: #667eea; background: #f0f2ff; }
       .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
       .correct { color: #28a745; }
       .wrong { color: #dc3545; }
       .next-btn { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; display: none; margin: 0 auto; }
       .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
       .hidden { display: none; }
   </style>
</head>
<body>

   <div class="quiz-container" id="quiz-box">
       <h2 id="question-text">Question</h2>
       <div class="options-container" id="options"></div>
       <div id="feedback" class="feedback"></div>
       <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
   </div>

   <div class="quiz-container hidden" id="summary-box">
       <h2>Quiz Complete!</h2>
       <div id="results-list"></div>
       <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">Try Again</button>
       <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade1-science-topics.html'">Back to Topics</button>
   </div>

   <script>
       const quizData = [
           { q: "What falls from clouds when it is gray and wet outside?", a: "Rain", options: ["Rain", "Shoes", "Toys", "Juice"] },
           { q: "What do we use to stay dry when it rains?", a: "An Umbrella", options: ["Sunglasses", "A Hat", "An Umbrella", "A Scarf"] },
           { q: "Which season is usually the hottest time of the year?", a: "Summer", options: ["Winter", "Spring", "Summer", "Fall"] },
           { q: "Snow happens when the air is very ____.", a: "Cold", options: ["Hot", "Cold", "Dry", "Pink"] },
           { q: "What appears in the sky after it rains and the sun comes out?", a: "A Rainbow", options: ["A Moon", "A Rainbow", "A Tornado", "A Snowman"] },
           { q: "In which season do the leaves change color and fall off the trees?", a: "Fall (Autumn)", options: ["Summer", "Fall (Autumn)", "Spring", "Winter"] },
           { q: "What do we call moving air that can fly a kite?", a: "Wind", options: ["Rain", "Snow", "Wind", "Fog"] },
           { q: "Which of these do you wear on a very cold, snowy day?", a: "A heavy coat", options: ["Swimsuit", "Flip-flops", "A heavy coat", "Sunglasses"] },
           { q: "What is the loud sound that often comes after a flash of lightning?", a: "Thunder", options: ["Rain", "Thunder", "Wind", "Music"] },
           { q: "In which season do flowers start to grow and baby birds are born?", a: "Spring", options: ["Winter", "Fall", "Spring", "Summer"] },
           { q: "What is the name of a very big storm with a spinning cloud?", a: "A Tornado", options: ["A Rainbow", "A Tornado", "A Puddle", "A Cloud"] },
           { q: "Which tool do we use to tell how hot or cold it is?", a: "A Thermometer", options: ["A Ruler", "A Clock", "A Thermometer", "A Scale"] },
           { q: "What is 'fog'?", a: "A cloud that is low to the ground", options: ["A cloud that is low to the ground", "Frozen rain", "Very hot wind", "Falling leaves"] },
           { q: "What are clouds made of?", a: "Tiny drops of water or ice", options: ["Cotton candy", "Tiny drops of water or ice", "White paint", "Smoke"] },
           { q: "When the sun is blocked by many clouds, we say the weather is ____.", a: "Cloudy", options: ["Sunny", "Clear", "Cloudy", "Hot"] },
           { q: "What is 'hail'?", a: "Small balls of ice that fall from the sky", options: ["Soft snow", "Small balls of ice that fall from the sky", "A warm breeze", "A type of flower"] },
           { q: "Which season comes right after Winter?", a: "Spring", options: ["Fall", "Summer", "Spring", "Autumn"] },
           { q: "Why should you never stand under a tree during a thunderstorm?", a: "Because of lightning", options: ["Because of lightning", "Because of squirrels", "Because of the leaves", "Because of the shade"] },
           { q: "What do we call a very long time with no rain?", a: "A Drought", options: ["A Flood", "A Drought", "A Season", "A Blizzard"] },
           { q: "Which of these would you use on a sunny day at the beach?", a: "Sunscreen", options: ["Snowboots", "Sunscreen", "A Raincoat", "A Winter hat"] }
       ];

       let currentIdx = 0;
       let score = 0;
       let userResults = [];

       function shuffleArray(array) {
           for (let i = array.length - 1; i > 0; i--) {
               const j = Math.floor(Math.random() * (i + 1));
               [array[i], array[j]] = [array[j], array[i]];
           }
       }

       function ensureTryAgainButton() {
           const summaryBox = document.getElementById("summary-box");
           if (summaryBox && !summaryBox.querySelector('button[onclick="location.reload()"]')) {
               const button = document.createElement('button');
               button.className = 'next-btn';
               button.style.display = 'block';
               button.style.marginTop = '20px';
               button.innerText = 'Try Again';
               button.onclick = function() { location.reload(); };
               const backButton = summaryBox.querySelector('button[onclick^="location.href"]');
               summaryBox.insertBefore(button, backButton || null);
           }
       }

       function initializeQuiz() {
           shuffleArray(quizData);
           loadQuestion();
       }

       function loadQuestion() {
           const current = quizData[currentIdx];
           document.getElementById("question-text").innerText = current.q;
           const optionsDiv = document.getElementById("options");
           optionsDiv.innerHTML = "";
           document.getElementById("feedback").innerText = "";
           document.getElementById("next-button").style.display = "none";

           current.options.forEach(opt => {
               const btn = document.createElement("button");
               btn.innerText = opt;
               btn.className = "option-btn";
               btn.onclick = () => checkAnswer(opt);
               optionsDiv.appendChild(btn);
           });
       }

       function checkAnswer(selected) {
           const current = quizData[currentIdx];
           const feedback = document.getElementById("feedback");
           const btns = document.querySelectorAll(".option-btn");
          
           btns.forEach(b => b.disabled = true);

           if (selected === current.a) {
               feedback.innerText = "Correct! Well done.";
               feedback.className = "feedback correct";
               score++;
               userResults.push({ q: current.q, res: "Correct", class: "correct" });
           } else {
               feedback.innerText = "Oops! The correct answer was " + current.a;
               feedback.className = "feedback wrong";
               userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
           }
           document.getElementById("next-button").style.display = "block";
       }

       function loadNextQuestion() {
           currentIdx++;
           if (currentIdx < quizData.length) {
               loadQuestion();
           } else {
               showSummary();
           }
       }

       function showSummary() {
           document.getElementById("quiz-box").classList.add("hidden");
           const summaryBox = document.getElementById("summary-box");
           summaryBox.classList.remove("hidden");
           ensureTryAgainButton();
          
           const list = document.getElementById("results-list");
           list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
          
           userResults.forEach(item => {
               const div = document.createElement("div");
               div.className = "summary-item";
               div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
               list.appendChild(div);
           });
       }

       initializeQuiz();
   </script>
</body>
</html>
