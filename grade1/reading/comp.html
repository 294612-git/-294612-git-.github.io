<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Starfish Reading Quiz - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
   <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fff3e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .quiz-container, .menu-container {
            background: white;
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 540px;
            text-align: center;
            border: 4px dashed #ffb74d;
        }
        h2 { font-family: 'Fredoka', cursive; color: #ef6c00; }
        .choice {
            display: block;
            background: #fff4e6;
            color: #e65100;
            padding: 1rem;
            margin: 0.8rem 0;
            border-radius: 20px;
            border: 3px solid #ffd59e;
            text-decoration: none;
            font-weight: 700;
        }
        .choice:hover { background: #ffe0b2; border-color: #ffb74d; }
        .back-link { display: inline-block; margin-top: 1rem; color: #e65100; text-decoration: none; font-size: 0.95rem; }
        .options-container { display: flex; flex-direction: column; gap: 12px; margin: 20px 0; }
        .option-btn {
            padding: 14px;
            border: 3px solid #ffd59e;
            border-radius: 50px;
            background: white;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: 0.2s;
            color: #e65100;
        }
        .option-btn:hover { border-color: #ffb74d; background: #fff3e0; }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #ffb74d 0%, #fb8c00 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px #e65100;
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #ffe0b2; }
        .hidden { display: none; }
</style>
</head>
<body>

   <div class="quiz-container" id="quiz-box">
        <h2>⭐ Starfish Reading</h2>
       <h2 id="question-text">Question</h2>
       <div class="options-container" id="options"></div>
       <div id="feedback" class="feedback"></div>
       <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
   </div>

   <div class="quiz-container hidden" id="summary-box">
       <h2>Quiz Complete!</h2>
       <div id="results-list"></div>
       <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='index.html'">Back to Starfish Reading</button>
   </div>

   <script>
       const quizData = [
           { q: "The dog ran fast. What did the dog do?", a: "Ran", options: ["Slept", "Ran", "Ate", "Sat"] },
           { q: "The sun is hot. What is hot?", a: "The Sun", options: ["The Moon", "The Sun", "The Rain", "The Snow"] },
           { q: "Tim has a red hat. What color is the hat?", a: "Red", options: ["Blue", "Green", "Red", "Yellow"] },
           { q: "The cat sat on the mat. Where did the cat sit?", a: "On the mat", options: ["In a tree", "On the mat", "In the car", "On the grass"] },
           { q: "I see a big, blue bird. What size is the bird?", a: "Big", options: ["Tiny", "Blue", "Big", "Fast"] },
           { q: "The apple is sweet and crunchy. How does the apple taste?", a: "Sweet", options: ["Sour", "Sweet", "Salty", "Spicy"] },
           { q: "Jan went to the park to play. Where did Jan go?", a: "To the park", options: ["To school", "To the park", "To the store", "To bed"] },
           { q: "Which word starts with the same sound as 'Dog'?", a: "Duck", options: ["Cat", "Ball", "Duck", "Fish"] },
           { q: "Which word rhymes with 'Cat'?", a: "Bat", options: ["Cot", "Bat", "Cup", "Car"] },
           { q: "Find the action word (verb): 'The frog jumps high.'", a: "Jumps", options: ["Frog", "High", "Jumps", "The"] },
           { q: "Which word is a person, place, or thing (noun)?", a: "School", options: ["Run", "Happy", "School", "Fast"] },
           { q: "The boy is sad because he lost his toy. Why is he sad?", a: "He lost his toy", options: ["He is hungry", "He lost his toy", "He is tired", "He wants to go home"] },
           { q: "Which word should start with a capital letter?", a: "mary", options: ["apple", "mary", "jump", "blue"] },
           { q: "What goes at the end of a question?", a: "A question mark (?)", options: ["A period (.)", "A comma (,)", "A question mark (?)", "An exclamation point (!)"] },
           { q: "The pig is in the mud. Who is in the mud?", a: "The pig", options: ["The cow", "The pig", "The farmer", "The duck"] },
           { q: "Which word is an opposite of 'Big'?", a: "Small", options: ["Large", "Small", "Tall", "Huge"] },
           { q: "Which word rhymes with 'Tree'?", a: "Bee", options: ["True", "Bee", "Try", "Ten"] },
           { q: "The milk is in the cup. What is in the cup?", a: "Milk", options: ["Water", "Juice", "Milk", "Soda"] },
           { q: "How many syllables (beats) are in the word 'Apple'?", a: "2", options: ["1", "2", "3", "4"] },
           { q: "Which sentence is written correctly?", a: "The cat is black.", options: ["the cat is black.", "The cat is black", "The cat is black.", "the cat is Black"] }
       ];

       let currentIdx = 0;
       let score = 0;
       let userResults = [];

       function shuffleArray(array) {
           for (let i = array.length - 1; i > 0; i--) {
               const j = Math.floor(Math.random() * (i + 1));
               [array[i], array[j]] = [array[j], array[i]];
           }
       }

       function ensureTryAgainButton() {
           const summaryBox = document.getElementById("summary-box");
           if (summaryBox && !summaryBox.querySelector('button[onclick="location.reload()"]')) {
               const button = document.createElement('button');
               button.className = 'next-btn';
               button.style.display = 'block';
               button.style.marginTop = '20px';
               button.innerText = 'Try Again';
               button.onclick = function() { location.reload(); };
               const backButton = summaryBox.querySelector('button[onclick^="location.href"]');
               summaryBox.insertBefore(button, backButton || null);
           }
       }

       function initializeQuiz() {
           shuffleArray(quizData);
           loadQuestion();
       }

       function loadQuestion() {
           const current = quizData[currentIdx];
           document.getElementById("question-text").innerText = current.q;
           const optionsDiv = document.getElementById("options");
           optionsDiv.innerHTML = "";
           document.getElementById("feedback").innerText = "";
           document.getElementById("next-button").style.display = "none";

           current.options.forEach(opt => {
               const btn = document.createElement("button");
               btn.innerText = opt;
               btn.className = "option-btn";
               btn.onclick = () => checkAnswer(opt);
               optionsDiv.appendChild(btn);
           });
       }

       function checkAnswer(selected) {
           const current = quizData[currentIdx];
           const feedback = document.getElementById("feedback");
           const btns = document.querySelectorAll(".option-btn");
          
           btns.forEach(b => b.disabled = true);

           if (selected === current.a) {
               feedback.innerText = "Splashtastic! Correct.";
               feedback.className = "feedback correct";
               score++;
               userResults.push({ q: current.q, res: "Correct", class: "correct" });
           } else {
               feedback.innerText = "Glub! Incorrect.";
               feedback.className = "feedback wrong";
               userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
           }
           document.getElementById("next-button").style.display = "block";
       }

       function loadNextQuestion() {
           currentIdx++;
           if (currentIdx < quizData.length) {
               loadQuestion();
           } else {
               showSummary();
           }
       }

       function showSummary() {
           document.getElementById("quiz-box").classList.add("hidden");
           const summaryBox = document.getElementById("summary-box");
           summaryBox.classList.remove("hidden");
           ensureTryAgainButton();
          
           const list = document.getElementById("results-list");
           list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
          
           userResults.forEach(item => {
               const div = document.createElement("div");
               div.className = "summary-item";
               div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
               list.appendChild(div);
           });
       }

       initializeQuiz();
   </script>
</body>
</html>
