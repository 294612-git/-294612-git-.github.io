<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading/Comprehension Quiz - Study Buddy</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .quiz-container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 500px; text-align: center; }
        h2 { color: #667eea; }
        .options-container { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
        .option-btn { padding: 12px; border: 2px solid #ddd; border-radius: 8px; background: white; cursor: pointer; font-size: 1.1rem; transition: 0.2s; }
        .option-btn:hover { border-color: #667eea; background: #f0f2ff; }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #28a745; }
        .wrong { color: #dc3545; }
        .next-btn { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; display: none; margin: 0 auto; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <h2 id="question-text">Question</h2>
        <div class="options-container" id="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div class="quiz-container hidden" id="summary-box">
        <h2>Quiz Complete!</h2>
        <div id="results-list"></div>
        <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='../index.html'">Back to Topics</button>
    </div>

    <script>
        const quizData = [
            { q: "The cat is on the mat. Where is the cat?", a: "on the mat", options: ["under the mat", "on the mat", "beside the mat"] },
            { q: "Sam has a big dog. What does Sam have?", a: "big dog", options: ["small dog", "big dog", "cat"] },
            { q: "The sun is bright. What is bright?", a: "the sun", options: ["the moon", "the sun", "the stars"] },
            { q: "Mary likes to read. What does Mary like?", a: "to read", options: ["to write", "to read", "to draw"] },
            { q: "The bird can fly. What can the bird do?", a: "fly", options: ["swim", "fly", "run"] },
            { q: "Tom is happy. How does Tom feel?", a: "happy", options: ["sad", "happy", "angry"] },
            { q: "The apple is red. What color is the apple?", a: "red", options: ["green", "red", "yellow"] },
            { q: "The car is fast. What is fast?", a: "the car", options: ["the bike", "the car", "the bus"] },
            { q: "Lisa has blue eyes. What color are Lisa's eyes?", a: "blue", options: ["brown", "blue", "green"] },
            { q: "The tree is tall. What is tall?", a: "the tree", options: ["the flower", "the tree", "the grass"] },
            { q: "The fish swims in water. Where does the fish swim?", a: "in water", options: ["on land", "in water", "in air"] },
            { q: "Dad cooks dinner. Who cooks dinner?", a: "Dad", options: ["Mom", "Dad", "Sister"] },
            { q: "The moon is in the sky. Where is the moon?", a: "in the sky", options: ["on ground", "in the sky", "in water"] },
            { q: "The book has pictures. What does the book have?", a: "pictures", options: ["words", "pictures", "music"] },
            { q: "The boy runs fast. How does the boy run?", a: "fast", options: ["slow", "fast", "walk"] },
            { q: "The girl sings a song. What does the girl do?", a: "sings a song", options: ["dances", "sings a song", "reads"] },
            { q: "The house is big. What is big?", a: "the house", options: ["the door", "the house", "the window"] },
            { q: "The dog barks loud. How does the dog bark?", a: "loud", options: ["quiet", "loud", "soft"] },
            { q: "The flower is pretty. What is pretty?", a: "the flower", options: ["the leaf", "the flower", "the stem"] },
            { q: "The ice is cold. What is cold?", a: "the ice", options: ["the fire", "the ice", "the sun"] }
        ];

        let currentIdx = 0;
        let score = 0;
        let userResults = [];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function ensureTryAgainButton() {
            const summaryBox = document.getElementById("summary-box");
            if (summaryBox && !summaryBox.querySelector('button[onclick="location.reload()"]')) {
                const button = document.createElement('button');
                button.className = 'next-btn';
                button.style.display = 'block';
                button.style.marginTop = '20px';
                button.innerText = 'Try Again';
                button.onclick = function() { location.reload(); };
                const backButton = summaryBox.querySelector('button[onclick^="location.href"]');
                summaryBox.insertBefore(button, backButton || null);
            }
        }

        function initializeQuiz() {
            shuffleArray(quizData);
            loadQuestion();
        }

        function loadQuestion() {
            const current = quizData[currentIdx];
            document.getElementById("question-text").innerText = current.q;
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-button").style.display = "none";

            current.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById("feedback");
            const btns = document.querySelectorAll(".option-btn");
            
            // Disable buttons after answer
            btns.forEach(b => b.disabled = true);

            if (selected === current.a) {
                feedback.innerText = "Splashtastic! Correct.";
                feedback.className = "feedback correct";
                score++;
                userResults.push({ q: current.q, res: "Correct", class: "correct" });
            } else {
                feedback.innerText = "Glub! Incorrect.";
                feedback.className = "feedback wrong";
                userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
            }
            document.getElementById("next-button").style.display = "block";
        }

        function loadNextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById("quiz-box").classList.add("hidden");
            const summaryBox = document.getElementById("summary-box");
            summaryBox.classList.remove("hidden");
            ensureTryAgainButton();
            
            const list = document.getElementById("results-list");
            list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
            
            userResults.forEach(item => {
                const div = document.createElement("div");
                div.className = "summary-item";
                div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
                list.appendChild(div);
            });
        }

        // Start the quiz
        initializeQuiz();
    </script>
</body>
</html>
