<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starfish Reading - Choose Topic</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fff3e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .quiz-container, .menu-container {
            background: white;
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 540px;
            text-align: center;
            border: 4px dashed #ffb74d;
        }
        h2 { font-family: 'Fredoka', cursive; color: #ef6c00; }
        .choice {
            display: block;
            background: #fff4e6;
            color: #e65100;
            padding: 1rem;
            margin: 0.8rem 0;
            border-radius: 20px;
            border: 3px solid #ffd59e;
            text-decoration: none;
            font-weight: 700;
        }
        .choice:hover { background: #ffe0b2; border-color: #ffb74d; }
        .back-link { display: inline-block; margin-top: 1rem; color: #e65100; text-decoration: none; font-size: 0.95rem; }
        .options-container { display: flex; flex-direction: column; gap: 12px; margin: 20px 0; }
        .option-btn {
            padding: 14px;
            border: 3px solid #ffd59e;
            border-radius: 50px;
            background: white;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: 0.2s;
            color: #e65100;
        }
        .option-btn:hover { border-color: #ffb74d; background: #fff3e0; }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #ffb74d 0%, #fb8c00 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px #e65100;
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #ffe0b2; }
        .hidden { display: none; }
</style>
</head>
<body>
    <div class="menu-container">
        <h2>⭐ Grade 1 Reading</h2>

        <a href="comp.html" class="choice">Comprehension</a>
        <a href="grade1-phonics.html" class="choice">Phonics</a>
        <a href="grade1-vocabulary.html" class="choice">Vocabulary</a>
        <a href="grade1-writing.html" class="choice">Writing</a>
        <a href="../../startquiz.html" class="back-link">← Back to Quiz Selection</a>
    </div>
</body>
</html>
