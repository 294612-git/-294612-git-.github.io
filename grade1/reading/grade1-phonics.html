<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Starfish Reading Quiz - Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
   <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fff3e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .quiz-container, .menu-container {
            background: white;
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 90%;
            max-width: 540px;
            text-align: center;
            border: 4px dashed #ffb74d;
        }
        h2 { font-family: 'Fredoka', cursive; color: #ef6c00; }
        .choice {
            display: block;
            background: #fff4e6;
            color: #e65100;
            padding: 1rem;
            margin: 0.8rem 0;
            border-radius: 20px;
            border: 3px solid #ffd59e;
            text-decoration: none;
            font-weight: 700;
        }
        .choice:hover { background: #ffe0b2; border-color: #ffb74d; }
        .back-link { display: inline-block; margin-top: 1rem; color: #e65100; text-decoration: none; font-size: 0.95rem; }
        .options-container { display: flex; flex-direction: column; gap: 12px; margin: 20px 0; }
        .option-btn {
            padding: 14px;
            border: 3px solid #ffd59e;
            border-radius: 50px;
            background: white;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: 0.2s;
            color: #e65100;
        }
        .option-btn:hover { border-color: #ffb74d; background: #fff3e0; }
        .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .next-btn {
            background: linear-gradient(135deg, #ffb74d 0%, #fb8c00 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-weight: bold;
            box-shadow: 0 4px 0px #e65100;
        }
        .next-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #ffe0b2; }
        .hidden { display: none; }
</style>
</head>
<body>

   <div class="quiz-container" id="quiz-box">
        <h2>⭐ Starfish Reading</h2>
       <h2 id="question-text">Question</h2>
       <div class="options-container" id="options"></div>
       <div id="feedback" class="feedback"></div>
       <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Question</button>
   </div>

   <div class="quiz-container hidden" id="summary-box">
       <h2>Quiz Complete!</h2>
       <div id="results-list"></div>
       <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">Try Again</button>
       <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='index.html'">Back to Starfish Reading</button>
   </div>

   <script>
       const questionPool = [
           { q: "What sound does the letter “B” make?", a: "/b/ as in bat", options: ["/s/ as in snake", "/b/ as in bat", "/t/ as in top", "/m/ as in moon"] },
           { q: "Which word starts with the letter “S”?", a: "Sun", options: ["Cat", "Dog", "Sun", "Ball"] },
           { q: "Which word has a short “a” sound (like in \"apple\")?", a: "Cat", options: ["Cake", "Rain", "Cat", "Play"] },
           { q: "What two letters work together to make the “sh” sound?", a: "S and H", options: ["C and H", "S and H", "T and H", "P and H"] },
           { q: "Which word starts with the \"ch\" sound?", a: "Chair", options: ["Shoe", "Chair", "Think", "Phone"] },
           { q: "What is the first sound you hear in the word \"Pig\"?", a: "/p/", options: ["/g/", "/p/", "/i/", "/b/"] },
           { q: "Which word has a long \"i\" sound (where the letter says its name)?", a: "Kite", options: ["Pig", "Sit", "Kite", "Bin"] },
           { q: "What sound do \"C\" and \"L\" make when put together (CL)?", a: "/cl/", options: ["/cr/", "/cl/", "/sl/", "/bl/"] },
           { q: "Which word ends with the \"ck\" sound?", a: "Duck", options: ["Duck", "Dog", "Dad", "Day"] },
           { q: "What vowel sound do you hear in the word \"Bed\"?", a: "Short e", options: ["Short a", "Short e", "Short i", "Short o"] },
           { q: "Which word rhymes with \"Moon\"?", a: "Spoon", options: ["Man", "Spoon", "More", "Mouth"] },
           { q: "What sound does the letter \"F\" make?", a: "/f/", options: ["/v/", "/ph/", "/f/", "/s/"] },
           { q: "Which word has a silent \"e\" at the end?", a: "Bike", options: ["Bed", "Bike", "Sit", "Run"] },
           { q: "What sound does \"th\" make in the word \"Thumb\"?", a: "/th/", options: ["/sh/", "/ch/", "/th/", "/wh/"] },
           { q: "Which word starts with a \"Bl\" blend?", a: "Blue", options: ["Blue", "Red", "Green", "Yellow"] },
           { q: "How many sounds (phonemes) are in the word \"Cat\"?", a: "3", options: ["1", "2", "3", "4"] },
           { q: "Which word has a short \"u\" sound (like in \"up\")?", a: "Sun", options: ["Blue", "Use", "Sun", "Cube"] },
           { q: "What sound does the letter \"J\" make?", a: "/j/", options: ["/g/", "/j/", "/y/", "/h/"] },
           { q: "Which word has a \"magic e\" that makes the \"o\" say its name?", a: "Hope", options: ["Hop", "Hot", "Hope", "Hog"] },
           { q: "Which word starts with the same sound as \"Frog\"?", a: "Fish", options: ["Fish", "Pen", "Dog", "Star"] }
        ];
        const quizData = shufflePool(questionPool.slice()).slice(0, 5);
        function shufflePool(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

       let currentIdx = 0;
       let score = 0;
       let userResults = [];

       function shuffleArray(array) {
           for (let i = array.length - 1; i > 0; i--) {
               const j = Math.floor(Math.random() * (i + 1));
               [array[i], array[j]] = [array[j], array[i]];
           }
       }

       function ensureTryAgainButton() {
           const summaryBox = document.getElementById("summary-box");
           if (summaryBox && !summaryBox.querySelector('button[onclick="location.reload()"]')) {
               const button = document.createElement('button');
               button.className = 'next-btn';
               button.style.display = 'block';
               button.style.marginTop = '20px';
               button.innerText = 'Try Again';
               button.onclick = function() { location.reload(); };
               const backButton = summaryBox.querySelector('button[onclick^="location.href"]');
               summaryBox.insertBefore(button, backButton || null);
           }
       }

       function initializeQuiz() {
           shuffleArray(quizData);
           loadQuestion();
       }

       function loadQuestion() {
           const current = quizData[currentIdx];
           document.getElementById("question-text").innerText = current.q;
           const optionsDiv = document.getElementById("options");
           optionsDiv.innerHTML = "";
           document.getElementById("feedback").innerText = "";
           document.getElementById("next-button").style.display = "none";

           current.options.forEach(opt => {
               const btn = document.createElement("button");
               btn.innerText = opt;
               btn.className = "option-btn";
               btn.onclick = () => checkAnswer(opt);
               optionsDiv.appendChild(btn);
           });
       }

       function checkAnswer(selected) {
           const current = quizData[currentIdx];
           const feedback = document.getElementById("feedback");
           const btns = document.querySelectorAll(".option-btn");
          
           btns.forEach(b => b.disabled = true);

           if (selected === current.a) {
               feedback.innerText = "Splashtastic! Correct.";
               feedback.className = "feedback correct";
               score++;
               userResults.push({ q: current.q, res: "Correct", class: "correct" });
           } else {
               feedback.innerText = "Glub! Incorrect.";
               feedback.className = "feedback wrong";
               userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
           }
           document.getElementById("next-button").style.display = "block";
       }

       function loadNextQuestion() {
           currentIdx++;
           if (currentIdx < quizData.length) {
               loadQuestion();
           } else {
               showSummary();
           }
       }

       function showSummary() {
           document.getElementById("quiz-box").classList.add("hidden");
           const summaryBox = document.getElementById("summary-box");
           summaryBox.classList.remove("hidden");
           ensureTryAgainButton();
          
           const list = document.getElementById("results-list");
           list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
          
           userResults.forEach(item => {
               const div = document.createElement("div");
               div.className = "summary-item";
               div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
               list.appendChild(div);
           });
       }

       initializeQuiz();
   </script>
</body>
</html>
