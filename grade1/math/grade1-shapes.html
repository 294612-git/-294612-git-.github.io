<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Shapes Quiz - Study Buddy</title>
   <style>
       body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
       .quiz-container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 500px; text-align: center; }
       h2 { color: #667eea; }
       .question { font-size: 1.2rem; margin: 20px 0; }
       .options-container { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
       .option-btn { padding: 12px; border: 2px solid #ddd; border-radius: 8px; background: white; cursor: pointer; font-size: 1.1rem; transition: 0.2s; }
       .option-btn:hover { border-color: #667eea; background: #f0f2ff; }
       .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
       .correct { color: #28a745; }
       .wrong { color: #dc3545; }
       .next-btn { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; display: none; margin: 0 auto; }
       .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
       .hidden { display: none; }
   </style>
</head>
<body>
   <div class="quiz-container">
       <h2>Grade 1 Shapes Quiz</h2>
      
       <div id="quiz-box">
           <div class="question" id="question"></div>
           <div class="options-container" id="options"></div>
           <div class="feedback" id="feedback"></div>
           <button class="next-btn" id="next-button" onclick="loadNextQuestion()">Next Question</button>
       </div>
      
       <div id="summary-box" class="hidden">
           <h3>Quiz Complete!</h3>
           <div id="results-list"></div>
           <a href="grade1-math-topics.html" style="display: inline-block; margin-top: 20px; color: #667eea; text-decoration: none;">← Back to Topics</a>
       </div>
   </div>

   <script>
       const quizData = [
           { q: "Which shape is round and has no corners?", a: "Circle", options: ["Triangle", "Square", "Circle", "Rectangle"] },
           { q: "Which shape has 4 equal sides (all sides are the same)?", a: "Square", options: ["Square", "Oval", "Triangle", "Star"] },
           { q: "How many corners does a triangle have?", a: "3", options: ["1", "2", "3", "4"] },
           { q: "Which shape looks most like a box?", a: "Square", options: ["Circle", "Square", "Oval", "Heart"] },
           { q: "Which shape looks like a stretched-out circle or an egg?", a: "Oval", options: ["Rectangle", "Square", "Oval", "Triangle"] },
           { q: "How many sides does a rectangle have?", a: "4", options: ["2", "3", "4", "5"] },
           { q: "A slice of pizza is usually the shape of a:", a: "Triangle", options: ["Circle", "Triangle", "Square", "Rectangle"] },
           { q: "Which shape has 5 points and shines in the sky?", a: "Star", options: ["Diamond", "Moon", "Star", "Circle"] },
           { q: "Which shape has 4 sides, but 2 are long and 2 are short?", a: "Rectangle", options: ["Square", "Rectangle", "Triangle", "Circle"] },
           { q: "What do we call a shape with 0 sides?", a: "Circle", options: ["Square", "Triangle", "Circle", "Diamond"] },
           { q: "Which shape looks like a diamond?", a: "Rhombus", options: ["Rhombus", "Circle", "Rectangle", "Oval"] },
           { q: "How many corners does a square have?", a: "4", options: ["3", "4", "5", "0"] },
           { q: "Which shape is used for a 'Yield' road sign?", a: "Triangle", options: ["Circle", "Square", "Triangle", "Rectangle"] },
           { q: "If you put two triangles together side-by-side, what shape might they make?", a: "Square or Diamond", options: ["Circle", "Square or Diamond", "Oval", "Heart"] },
           { q: "Which of these is a 3D shape (like a ball)?", a: "Sphere", options: ["Circle", "Sphere", "Triangle", "Square"] },
           { q: "Which shape has 6 sides?", a: "Hexagon", options: ["Pentagon", "Hexagon", "Square", "Triangle"] },
           { q: "A door is usually the shape of a:", a: "Rectangle", options: ["Circle", "Triangle", "Rectangle", "Oval"] },
           { q: "A 'corner' is also called a:", a: "Vertex", options: ["Line", "Side", "Vertex", "Middle"] },
           { q: "Which shape looks like a roof on a house?", a: "Triangle", options: ["Triangle", "Circle", "Oval", "Rectangle"] },
           { q: "Which shape is often used to show love?", a: "Heart", options: ["Square", "Star", "Heart", "Triangle"] }
       ];

       let currentIdx = 0;
       let score = 0;
       let userResults = [];

       function shuffleArray(array) {
           for (let i = array.length - 1; i > 0; i--) {
               const j = Math.floor(Math.random() * (i + 1));
               [array[i], array[j]] = [array[j], array[i]];
           }
       }

       function initializeQuiz() {
           shuffleArray(quizData);
           loadQuestion();
       }

       function loadQuestion() {
           const current = quizData[currentIdx];
           document.getElementById("question").innerText = current.q;
           document.getElementById("feedback").innerText = "";
           document.getElementById("next-button").style.display = "none";
          
           const optionsContainer = document.getElementById("options");
           optionsContainer.innerHTML = "";
          
           current.options.forEach(option => {
               const btn = document.createElement("button");
               btn.className = "option-btn";
               btn.innerText = option;
               btn.onclick = () => checkAnswer(option);
               optionsContainer.appendChild(btn);
           });
       }

       function checkAnswer(selected) {
           const current = quizData[currentIdx];
           const feedback = document.getElementById("feedback");
           const btns = document.querySelectorAll(".option-btn");
           btns.forEach(b => b.disabled = true);
          
           if (selected === current.a) {
               feedback.innerText = "Correct! 🎉";
               feedback.className = "feedback correct";
               score++;
               userResults.push({ q: current.q, res: "Correct", class: "correct" });
           } else {
               feedback.innerText = "Oops! The correct answer was " + current.a;
               feedback.className = "feedback wrong";
               userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
           }
           document.getElementById("next-button").style.display = "block";
       }

       function loadNextQuestion() {
           currentIdx++;
           if (currentIdx < quizData.length) {
               loadQuestion();
           } else {
               showSummary();
           }
       }

       function ensureTryAgainButton() {
           const summaryBox = document.getElementById("summary-box");
           if (summaryBox && !summaryBox.querySelector('.try-again-btn')) {
               const button = document.createElement('button');
               button.className = 'next-btn try-again-btn';
               button.style.display = 'block';
               button.style.marginTop = '20px';
               button.innerText = 'Try Again';
               button.onclick = function() { location.reload(); };
               summaryBox.appendChild(button);
           }
       }

       function showSummary() {
           document.getElementById("quiz-box").classList.add("hidden");
           const summaryBox = document.getElementById("summary-box");
           summaryBox.classList.remove("hidden");
           ensureTryAgainButton();
          
           const list = document.getElementById("results-list");
           list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
          
           userResults.forEach(item => {
               const div = document.createElement("div");
               div.className = "summary-item";
               div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
               list.appendChild(div);
           });
       }

       // Start the quiz
       initializeQuiz();
   </script>
</body>
</html>
