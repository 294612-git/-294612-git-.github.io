<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Pufferfish Shapes Quiz - Study Buddy</title>
   <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
   <style>
       body {
           font-family: 'Quicksand', sans-serif;
           background-color: #e0f7fa;
           display: flex;
           justify-content: center;
           align-items: center;
           min-height: 100vh;
           margin: 0;
       }
       .quiz-container {
           background: white;
           padding: 2rem;
           border-radius: 20px;
           box-shadow: 0 8px 25px rgba(0,0,0,0.1);
           width: 90%;
           max-width: 500px;
           text-align: center;
           border: 4px dashed #00acc1;
       }
       h2 { font-family: 'Fredoka', cursive; color: #007c91; }
       .question { font-size: 1.2rem; margin: 20px 0; color: #333; }
       .options-container { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
       .option-btn {
           padding: 12px;
           border: 3px solid #b2ebf2;
           border-radius: 50px;
           background: white;
           cursor: pointer;
           font-size: 1.1rem;
           font-weight: 600;
           transition: 0.2s;
           color: #007c91;
       }
       .option-btn:hover { border-color: #00acc1; background: #e0f7fa; }
       .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
       .correct { color: #00897b; }
       .wrong { color: #d32f2f; }
       .next-btn {
           background: linear-gradient(135deg, #00acc1 0%, #007c91 100%);
           color: white;
           border: none;
           padding: 12px 25px;
           border-radius: 50px;
           cursor: pointer;
           display: none;
           margin: 0 auto;
           font-weight: bold;
           box-shadow: 0 4px 0px #005662;
       }
       .next-btn:active { transform: translateY(4px); box-shadow: none; }
       .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #e0f7fa; }
       .hidden { display: none; }
   </style>
</head>
<body>
   <div class="quiz-container">
       <h2>🐡 Shape Waves</h2>
       <div id="quiz-box">
           <div class="question" id="question-text"></div>
           <div class="options-container" id="options"></div>
           <div class="feedback" id="feedback"></div>
           <button class="next-btn" id="next-button" onclick="loadNextQuestion()">Next Bubble</button>
       </div>
       <div id="summary-box" class="hidden">
           <h2>Surf's Up! Quiz Complete!</h2>
           <div id="results-list"></div>
           <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">Try Again</button>
           <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade1-math-topics.html'">Back to Pufferfish Math</button>
       </div>
   </div>

   <script>
       const questionPool = [
           { q: "How many sides does a triangle have?", a: "3", options: ["3", "4", "5"] },
           { q: "How many sides does a square have?", a: "4", options: ["3", "4", "5"] },
           { q: "How many sides does a circle have?", a: "0", options: ["0", "1", "many"] },
           { q: "Which shape has 5 sides?", a: "pentagon", options: ["triangle", "square", "pentagon"] }
        ];
        const quizData = shufflePool(questionPool.slice()).slice(0, 5);
        function shufflePool(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

       let currentIdx = 0;
       let score = 0;
       let userResults = [];

       function shuffleArray(array) {
           for (let i = array.length - 1; i > 0; i--) {
               const j = Math.floor(Math.random() * (i + 1));
               [array[i], array[j]] = [array[j], array[i]];
           }
       }

       function initializeQuiz() {
           shuffleArray(quizData);
           loadQuestion();
       }

       function loadQuestion() {
           const current = quizData[currentIdx];
           document.getElementById("question-text").innerText = current.q;
           const optionsContainer = document.getElementById("options");
           optionsContainer.innerHTML = "";
           document.getElementById("feedback").innerText = "";
           document.getElementById("next-button").style.display = "none";
           current.options.forEach(option => {
               const btn = document.createElement("button");
               btn.className = "option-btn";
               btn.innerText = option;
               btn.onclick = () => checkAnswer(option);
               optionsContainer.appendChild(btn);
           });
       }

       function checkAnswer(selected) {
           const current = quizData[currentIdx];
           const feedback = document.getElementById("feedback");
           const btns = document.querySelectorAll(".option-btn");
           btns.forEach(b => b.disabled = true);
           if (selected === current.a) {
               feedback.innerText = "Splashtastic! Correct.";
               feedback.className = "feedback correct";
               score++;
               userResults.push({ q: current.q, res: "Correct", class: "correct" });
           } else {
               feedback.innerText = "Glub! The correct answer was " + current.a;
               feedback.className = "feedback wrong";
               userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
           }
           document.getElementById("next-button").style.display = "block";
       }

       function loadNextQuestion() {
           currentIdx++;
           if (currentIdx < quizData.length) { loadQuestion(); }
           else { showSummary(); }
       }

       function showSummary() {
           document.getElementById("quiz-box").classList.add("hidden");
           document.getElementById("summary-box").classList.remove("hidden");
           const list = document.getElementById("results-list");
           list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
           userResults.forEach(item => {
               const div = document.createElement("div");
               div.className = "summary-item";
               div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
               list.appendChild(div);
           });
       }
       initializeQuiz();
   </script>
</body>
</html>
