<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Pufferfish Addition Quiz - Study Buddy</title>
   <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
   <style>
       body {
           font-family: 'Quicksand', sans-serif;
           background-color: #e0f7fa;
           display: flex;
           justify-content: center;
           align-items: center;
           min-height: 100vh;
           margin: 0;
       }
       .quiz-container {
           background: white;
           padding: 2rem;
           border-radius: 20px;
           box-shadow: 0 8px 25px rgba(0,0,0,0.1);
           width: 90%;
           max-width: 500px;
           text-align: center;
           border: 4px dashed #00acc1;
       }
       h2 { font-family: 'Fredoka', cursive; color: #007c91; }
       .options-container { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
       .option-btn {
           padding: 12px;
           border: 3px solid #b2ebf2;
           border-radius: 50px;
           background: white;
           cursor: pointer;
           font-size: 1.1rem;
           font-weight: 600;
           transition: 0.2s;
           color: #007c91;
       }
       .option-btn:hover { border-color: #00acc1; background: #e0f7fa; }
       .feedback { margin: 15px 0; font-weight: bold; min-height: 24px; }
       .correct { color: #00897b; }
       .wrong { color: #d32f2f; }
       .next-btn {
           background: linear-gradient(135deg, #00acc1 0%, #007c91 100%);
           color: white;
           border: none;
           padding: 12px 25px;
           border-radius: 50px;
           cursor: pointer;
           display: none;
           margin: 0 auto;
           font-weight: bold;
           box-shadow: 0 4px 0px #005662;
       }
       .next-btn:active { transform: translateY(4px); box-shadow: none; }
       .summary-item { text-align: left; padding: 10px; border-bottom: 1px solid #e0f7fa; }
       .hidden { display: none; }
   </style>
</head>
<body>
   <div class="quiz-container" id="quiz-box">
       <h2>🐡 Addition Waves</h2>
       <h2 id="question-text" style="color: #333;">Question</h2>
       <div class="options-container" id="options"></div>
       <div id="feedback" class="feedback"></div>
       <button id="next-button" class="next-btn" onclick="loadNextQuestion()">Next Bubble</button>
   </div>

   <div class="quiz-container hidden" id="summary-box">
       <h2>Surf's Up! Quiz Complete!</h2>
       <div id="results-list"></div>
       <button class="next-btn" style="display:block; margin-top:20px;" onclick="location.href='grade1-math-topics.html'">Back to Pufferfish Math</button>
   </div>

   <script>
       const questionPool = [
           { q: "What is 4 + 2?", a: "6", options: ["5", "6", "7", "8"] },
           { q: "What is 3 + 5?", a: "8", options: ["7", "8", "9", "10"] },
           { q: "What is 7 + 1?", a: "8", options: ["6", "7", "8", "9"] },
           { q: "What is 5 + 5?", a: "10", options: ["9", "10", "11", "12"] },
           { q: "What is 6 + 3?", a: "9", options: ["8", "9", "10", "11"] },
           { q: "What is 8 + 4?", a: "12", options: ["10", "11", "12", "13"] },
           { q: "What is 9 + 2?", a: "11", options: ["10", "11", "12", "13"] },
           { q: "What is 0 + 7?", a: "7", options: ["0", "6", "7", "8"] },
           { q: "What is 10 + 5?", a: "15", options: ["14", "15", "16", "17"] },
           { q: "What is 4 + 6?", a: "10", options: ["8", "9", "10", "11"] },
           { q: "What is 8 + 8?", a: "16", options: ["14", "15", "16", "17"] },
           { q: "What is 12 + 3?", a: "15", options: ["13", "14", "15", "16"] },
           { q: "What is 7 + 5?", a: "12", options: ["11", "12", "13", "14"] },
           { q: "What is 1 + 9?", a: "10", options: ["8", "9", "10", "11"] },
           { q: "What is 11 + 4?", a: "15", options: ["14", "15", "16", "17"] },
           { q: "What is 2 + 13?", a: "15", options: ["14", "15", "16", "17"] },
           { q: "What is 9 + 6?", a: "15", options: ["14", "15", "16", "17"] },
           { q: "What is 5 + 8?", a: "13", options: ["12", "13", "14", "15"] },
           { q: "What is 10 + 10?", a: "20", options: ["15", "18", "20", "21"] },
           { q: "What is 3 + 14?", a: "17", options: ["16", "17", "18", "19"] }
        ];
        const quizData = shufflePool(questionPool.slice()).slice(0, 5);
        function shufflePool(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }
       let currentIdx = 0;
       let score = 0;
       let userResults = [];

       function shuffleArray(array) {
           for (let i = array.length - 1; i > 0; i--) {
               const j = Math.floor(Math.random() * (i + 1));
               [array[i], array[j]] = [array[j], array[i]];
           }
       }

       function initializeQuiz() {
           shuffleArray(quizData);
           loadQuestion();
       }

       function loadQuestion() {
           const current = quizData[currentIdx];
           document.getElementById("question-text").innerText = current.q;
           const optionsDiv = document.getElementById("options");
           optionsDiv.innerHTML = "";
           document.getElementById("feedback").innerText = "";
           document.getElementById("next-button").style.display = "none";
           current.options.forEach(opt => {
               const btn = document.createElement("button");
               btn.innerText = opt;
               btn.className = "option-btn";
               btn.onclick = () => checkAnswer(opt);
               optionsDiv.appendChild(btn);
           });
       }

       function checkAnswer(selected) {
           const current = quizData[currentIdx];
           const feedback = document.getElementById("feedback");
           const btns = document.querySelectorAll(".option-btn");
           btns.forEach(b => b.disabled = true);
           if (selected === current.a) {
               feedback.innerText = "Splashtastic! Correct.";
               feedback.className = "feedback correct";
               score++;
               userResults.push({ q: current.q, res: "Correct", class: "correct" });
           } else {
               feedback.innerText = "Glub! The correct answer was " + current.a;
               feedback.className = "feedback wrong";
               userResults.push({ q: current.q, res: "Wrong (Answer: " + current.a + ")", class: "wrong" });
           }
           document.getElementById("next-button").style.display = "block";
       }

       function loadNextQuestion() {
           currentIdx++;
           if (currentIdx < quizData.length) { loadQuestion(); }
           else { showSummary(); }
       }

       function showSummary() {
           document.getElementById("quiz-box").classList.add("hidden");
           document.getElementById("summary-box").classList.remove("hidden");
           const list = document.getElementById("results-list");
           list.innerHTML = `<h3>Final Score: ${score}/${quizData.length}</h3>`;
           userResults.forEach(item => {
               const div = document.createElement("div");
               div.className = "summary-item";
               div.innerHTML = `<strong>${item.q}</strong> - <span class="${item.class}">${item.res}</span>`;
               list.appendChild(div);
           });
       }
       // Start the quiz
       initializeQuiz();
   </script>
</body>
</html>
